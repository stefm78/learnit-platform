name: Learn-it Next CI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/learnit-next-ci.yml'
      - 'apps/learnit-next/**'
      - 'authoring/v2/**'
      - 'authoring/factory/**'
      - 'authoring/skills/SKILL_ATLAS_KIT_AUTHORING_V2.md'
      - 'authoring/skills/SKILL_ATLAS_KIT_REVIEW_V1.md'
      - 'contracts/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/learnit-next-ci.yml'
      - 'apps/learnit-next/**'
      - 'authoring/v2/**'
      - 'authoring/factory/**'
      - 'authoring/skills/SKILL_ATLAS_KIT_AUTHORING_V2.md'
      - 'authoring/skills/SKILL_ATLAS_KIT_REVIEW_V1.md'
      - 'contracts/**'
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Exact verification topology
        required: true
        type: choice
        options: [integration-head, post-merge, atlas-contracts, atlas-learning, atlas-core, atlas-experience, atlas-content, atlas-int, atlas-qa, passage-v6-consumer-replay]
      verification_ref:
        description: Exact 40-character commit SHA
        required: true
        type: string
      accepted_integration_head:
        description: Exact accepted integration head for post-merge
        required: false
        type: string

permissions:
  contents: read

env:
  CONTRACT_EVIDENCE_BASE: 58e39e8917006058fdf177a5daa37535f5e2c78d
  CORRECTIVE_COMMON_BASELINE: 6dae2f4f754431ed97c535a3a78fa71067bcd1de
  REVISION_SAFE_SUPPORT_BASE: 247325c61d990731a24efdcff6e4f0b2e5d4b9c2
  WAVE_A_BASE: 8ebafee48cc5277b92776982639a0146ae7e76d0
  ATLAS_M1_PROMOTION_PATHS: |
    apps/learnit-next/build.py
    apps/learnit-next/source_manifest.json
    apps/learnit-next/src/adapters/atlas_indexeddb.js
    apps/learnit-next/src/atlas.css
    apps/learnit-next/src/core/atlas_clock.js
    apps/learnit-next/src/core/atlas_events.js
    apps/learnit-next/src/core/atlas_evidence.js
    apps/learnit-next/src/core/atlas_planner.js
    apps/learnit-next/src/core/atlas_projection.js
    apps/learnit-next/src/core/atlas_recommendation.js
    apps/learnit-next/src/integration/atlas/bootstrap.js
    apps/learnit-next/src/integration/atlas/import_adapter.js
    apps/learnit-next/src/integration/atlas/session.js
    apps/learnit-next/src/integration/atlas/surface.js
    apps/learnit-next/src/main.js
    apps/learnit-next/src/ports/atlas_storage.js
    apps/learnit-next/src/ui/atlas_rewards.js
    apps/learnit-next/src/ui/atlas_session.js
    apps/learnit-next/src/ui/atlas_summary.js
    apps/learnit-next/src/ui/atlas_today.js
    apps/learnit-next/tests/atlas_m1_content.py
    apps/learnit-next/tests/atlas_m1_core.py
    apps/learnit-next/tests/atlas_m1_experience.py
    apps/learnit-next/tests/atlas_m1_int.py
    apps/learnit-next/tests/atlas_m1_learning.py
    authoring/v2/atlas/README.md
    authoring/v2/atlas/nombres_complexes_atlas.json
    authoring/v2/atlas/signaux_electriques_atlas.json
    authoring/v2/atlas/validate_atlas_content.py

concurrency:
  group: learnit-next-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.verification_ref || github.sha }}
  cancel-in-progress: true

jobs:
  exact-head-matrix:
    # Preserve all existing router checks except for the two exact non-applicable CSP PR branches.
    # The pinned base prevents this exception from silently following a different release.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.verification_mode == 'passage-v6-consumer-replay') && !(github.event_name == 'pull_request' && github.event.pull_request.base.sha == '548a5412bc75eb8be0d1e7353f08f77ac5a33504' && (github.head_ref == 'ops/learnit-v6-csp-style-attr-fix-r1' || github.head_ref == 'ops/learnit-v6-csp-ci-routing-r1')) }}
    name: Exact-head routed matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve exact target
        id: target
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_SHA: ${{ github.sha }}
          DISPATCH_SHA: ${{ inputs.verification_ref }}
          DISPATCH_MODE: ${{ inputs.verification_mode }}
          ACCEPTED: ${{ inputs.accepted_integration_head }}
        run: |
          set -euo pipefail

          route_branch() {
            case "$1" in
              agent/ATLAS-WP-001-support-governance-ci) echo 'atlas-support support' ;;
              agent/ATLAS-WP-001-contracts-0-3) echo 'atlas-contracts contract' ;;
              agent/ATLAS-WP-001-learning-corrective-0-3) echo 'atlas-learning corrective' ;;
              agent/ATLAS-WP-001-core-corrective-0-3) echo 'atlas-core corrective' ;;
              agent/ATLAS-WP-001-experience-corrective-0-3) echo 'atlas-experience corrective' ;;
              agent/ATLAS-WP-001-content-corrective-0-3) echo 'atlas-content corrective' ;;
              agent/ATLAS-WP-001-m1-0-3-int) echo 'atlas-int corrective' ;;
              agent/ATLAS-WP-001-qa-0-3) echo 'atlas-qa corrective' ;;
              agent/ATLAS-WP-001-learning) echo 'atlas-learning contract' ;;
              agent/ATLAS-WP-001-core) echo 'atlas-core contract' ;;
              agent/ATLAS-WP-001-experience) echo 'atlas-experience contract' ;;
              agent/ATLAS-WP-001-content) echo 'atlas-content contract' ;;
              agent/ATLAS-WP-001-qa) echo 'atlas-qa contract' ;;
              agent/PROG-WP-001-wave-a-learning|agent/PROG-WP-001-wave-a-ux|agent/PROG-WP-001-wave-a-authoring|agent/PROG-WP-001-wave-a-platform|agent/PROG-WP-001-wave-a-qa|agent/PROG-WP-001-wave-a-int) echo 'wave-a wave' ;;
              atlas/ATLAS-WP-012-m3-1-pedagogical-quality) echo 'm3-1-delegated wave' ;;
              atlas/ATLAS-WP-012-m3-1-promotion) echo 'm3-1-promotion-delegated wave' ;;
              atlas/ATLAS-WP-014-m3-2-ai-kit-factory) echo 'm3-2-factory-delegated wave' ;;
              atlas/ATLAS-WP-015-m3-2-5-factory-reliability) echo 'm3-2-5-factory-reliability-delegated wave' ;;
              atlas/ATLAS-WP-016-source-admission-benchmark-v1) echo 'source-admission-delegated wave' ;;
              atlas/ATLAS-WP-017-real-source-snapshot|atlas/ATLAS-WP-017b-source-snapshot-content-integrity|atlas/ATLAS-WP-017c-management-source-content) echo 'source-snapshot-delegated wave' ;;
              atlas/ATLAS-WP-019-m3-3-review-handoff) echo 'm3-3-review-handoff-delegated wave' ;;
              atlas/ATLAS-WP-023-transient-user-source-admission) echo 'm3-3-transient-source-delegated wave' ;;
              stream1/issue-352-one-atlas-learning-journey) echo 'atlas-ux-convergence wave' ;;
              atlas/ATLAS-WP-021-m3-4-qualified-release-set) echo 'm3-4-release-set-delegated wave' ;;
              *) echo 'ci-router wave' ;;
            esac
          }

          target=''; branch=''; profile=''; family=''; pr=''; mode=''; accepted=''; post_merge=false
          case "${EVENT}" in
            pull_request)
              target="${PR_SHA}"
              branch="${PR_REF}"
              pr="${PR_NUMBER}"
              mode=integration-head
              read -r profile family < <(route_branch "${branch}")
              ;;
            push)
              target="${PUSH_SHA}"
              branch=main
              profile=post-merge-auto
              family=wave
              mode=post-merge
              post_merge=true
              ;;
            workflow_dispatch)
              target="${DISPATCH_SHA}"
              accepted="${ACCEPTED}"
              mode="${DISPATCH_MODE}"
              case "${DISPATCH_MODE}" in
                atlas-contracts) branch=agent/ATLAS-WP-001-contracts-0-3; pr=137 ;;
                atlas-learning) branch=agent/ATLAS-WP-001-learning-corrective-0-3; pr=140; accepted='' ;;
                atlas-core) branch=agent/ATLAS-WP-001-core-corrective-0-3; pr=141; accepted='' ;;
                atlas-experience) branch=agent/ATLAS-WP-001-experience-corrective-0-3; pr=142; accepted='' ;;
                atlas-content) branch=agent/ATLAS-WP-001-content-corrective-0-3; pr=143; accepted='' ;;
                atlas-int) branch=agent/ATLAS-WP-001-m1-0-3-int; pr=147; accepted='' ;;
                atlas-qa) branch=agent/ATLAS-WP-001-qa-0-3; pr=144; accepted='' ;;
                integration-head|post-merge) profile=wave-a; family=wave ;;
                *) echo "Unsupported dispatch mode: ${DISPATCH_MODE}" >&2; exit 2 ;;
              esac
              if [[ -n "${branch}" ]]; then
                read -r profile family < <(route_branch "${branch}")
                mode=integration-head
              fi
              ;;
            *) echo "Unsupported event: ${EVENT}" >&2; exit 2 ;;
          esac

          case "${family}" in
            contract) base="${CONTRACT_EVIDENCE_BASE}" ;;
            corrective) base="${CORRECTIVE_COMMON_BASELINE}" ;;
            support) base="${REVISION_SAFE_SUPPORT_BASE}" ;;
            wave) base="${WAVE_A_BASE}" ;;
            *) echo "Unsupported route family: ${family}" >&2; exit 2 ;;
          esac
          [[ "${target}" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Target must be an exact lowercase SHA.' >&2
            exit 2
          }
          printf 'target=%s\nbranch=%s\nprofile=%s\nfamily=%s\nbase=%s\nmode=%s\naccepted=%s\npr=%s\npost_merge=%s\n' \
            "${target}" "${branch}" "${profile}" "${family}" "${base}" "${mode}" "${accepted}" "${pr}" "${post_merge}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target }}
          fetch-depth: 0
          clean: true

      - name: Resolve post-merge profile
        id: profile
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PROFILE: ${{ steps.target.outputs.profile }}
          BRANCH: ${{ steps.target.outputs.branch }}
          BASE: ${{ steps.target.outputs.base }}
          TARGET: ${{ steps.target.outputs.target }}
          POST_MERGE: ${{ steps.target.outputs.post_merge }}
        run: |
          set -euo pipefail
          profile="${PROFILE}"; branch="${BRANCH}"; base="${BASE}"; post_merge="${POST_MERGE}"
          if [[ "${EVENT}" == push ]]; then
            parents=( $(git show -s --format=%P HEAD) )
            [[ ${#parents[@]} -eq 2 ]] || {
              echo 'Post-merge target must have exactly two parents.' >&2
              exit 2
            }
            parse_name_status_paths() {
              local status path old_path new_path
              local -a paths=()
              while IFS= read -r -d '' status; do
                case "${status}" in
                  R*|C*)
                    IFS= read -r -d '' old_path || return 2
                    IFS= read -r -d '' new_path || return 2
                    paths+=("${old_path}" "${new_path}")
                    ;;
                  *)
                    IFS= read -r -d '' path || return 2
                    paths+=("${path}")
                    ;;
                esac
              done
              printf '%s\n' "${paths[@]}" | sed '/^$/d' | sort -u
            }

            collect_changed_paths() {
              git diff --name-status -z "$1" "$2" | parse_name_status_paths
            }

            changed_text="$(collect_changed_paths "${parents[0]}" HEAD)"
            mapfile -t changed < <(printf '%s\n' "${changed_text}" | sed '/^$/d')
            actual="$(printf '%s\n' "${changed[@]}")"

            product_relevant=false
            workflow_changed=false
            support_only=true
            for path in "${changed[@]}"; do
              case "${path}" in
                apps/learnit-next/**|authoring/v2/**|contracts/**) product_relevant=true ;;
              esac
              case "${path}" in
                .github/workflows/learnit-next-ci.yml) workflow_changed=true ;;
              esac
              case "${path}" in
                .github/workflows/learnit-next-ci.yml|apps/learnit-next/dev/run_checks.py) ;;
                *) support_only=false ;;
              esac
            done

            expected_atlas="$(printf '%s\n' "${ATLAS_M1_PROMOTION_PATHS}" | sed '/^$/d' | sort -u)"

            expected_m3_4="$(printf '%s\n' \
              '.github/workflows/atlas-m3-4-release-set-ci.yml' \
              'authoring/factory/README.md' \
              'authoring/factory/release_set.py' \
              'authoring/factory/tests/test_release_set.py' \
              'work-packages/ATLAS-WP-021.json' | sort -u)"

            if [[ "${workflow_changed}" == true && "${product_relevant}" == false ]]; then
              profile=ci-router
              branch=main
              base="${WAVE_A_BASE}"
              post_merge=false
            elif [[ ${#changed[@]} -gt 0 && "${support_only}" == true ]]; then
              profile=atlas-support
              branch=agent/ATLAS-WP-001-support-governance-ci
              base="${REVISION_SAFE_SUPPORT_BASE}"
              post_merge=true
            elif [[ "${actual}" == "${expected_atlas}" ]]; then
              profile=atlas-int-post-merge
              branch=main
              base="${CORRECTIVE_COMMON_BASELINE}"
              post_merge=true
            elif [[ "${actual}" == "${expected_m3_4}" ]]; then
              profile=m3-4-release-set-post-merge
              branch=main
              base="${parents[0]}"
              post_merge=true
            else
              profile=wave-a
              branch=main
              base="${WAVE_A_BASE}"
              post_merge=false
            fi
          fi
          if [[ "${profile}" == atlas-contracts ]]; then
            artifact="atlas-contracts-evidence-${TARGET}"
          else
            artifact="learnit-next-${profile}-${TARGET}"
          fi
          printf 'name=%s\nbranch=%s\nbase=%s\nartifact=%s\npost_merge=%s\n' \
            "${profile}" "${branch}" "${base}" "${artifact}" "${post_merge}" >> "${GITHUB_OUTPUT}"

      - name: Fetch authority and bind exact branch head
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PROFILE: ${{ steps.profile.outputs.name }}
          BRANCH: ${{ steps.profile.outputs.branch }}
          BASE: ${{ steps.profile.outputs.base }}
          TARGET: ${{ steps.target.outputs.target }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          POST_MERGE: ${{ steps.profile.outputs.post_merge }}
        run: |
          set -euo pipefail

          materialize_branch_or_pr() {
            local branch="$1" pr="$2" expected="${3:-}" remote='' source_ref=''
            if remote="$(git ls-remote --exit-code --heads origin "${branch}" | awk 'NR==1 {print $1}')"; then
              source_ref="refs/heads/${branch}"
            else
              [[ "${pr}" =~ ^[0-9]+$ ]] || {
                echo "No remote branch and no exact PR fallback for ${branch}" >&2
                return 2
              }
              remote="$(git ls-remote --exit-code origin "refs/pull/${pr}/head" | awk 'NR==1 {print $1}')"
              source_ref="refs/pull/${pr}/head"
            fi
            [[ "${remote}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "Resolved ref is not an exact SHA40: ${branch}" >&2
              return 2
            }
            if [[ -n "${expected}" && "${remote}" != "${expected}" ]]; then
              echo "Branch/PR head differs from requested target: ${branch}: ${remote} != ${expected}" >&2
              return 2
            fi
            git fetch --force --no-tags origin "${source_ref}:refs/remotes/origin/${branch}"
            [[ "$(git rev-parse "refs/remotes/origin/${branch}")" == "${remote}" ]]
          }

          git fetch --force --no-tags origin main:refs/remotes/origin/main
          for sha in "${CONTRACT_EVIDENCE_BASE}" "${CORRECTIVE_COMMON_BASELINE}" "${REVISION_SAFE_SUPPORT_BASE}"; do
            git fetch --force --no-tags origin "${sha}"
            git cat-file -e "${sha}^{commit}"
          done
          [[ "$(git rev-parse HEAD)" == "${TARGET}" ]]

          if [[ "${PROFILE}" == atlas-* && "${POST_MERGE}" != true ]]; then
            materialize_branch_or_pr "${BRANCH}" "${PR_NUMBER}" "${TARGET}"
          fi

          if [[ "${PROFILE}" == atlas-support || "${PROFILE}" == atlas-int-post-merge ]]; then
            materialize_branch_or_pr agent/ATLAS-WP-001-learning-corrective-0-3 140
            materialize_branch_or_pr agent/ATLAS-WP-001-core-corrective-0-3 141
            materialize_branch_or_pr agent/ATLAS-WP-001-experience-corrective-0-3 142
            materialize_branch_or_pr agent/ATLAS-WP-001-content-corrective-0-3 143
            materialize_branch_or_pr agent/ATLAS-WP-001-qa-0-3 144
            materialize_branch_or_pr agent/ATLAS-WP-001-m1-0-3-int 147
          fi

          [[ "$(git merge-base "${BASE}" HEAD)" == "${BASE}" ]] || {
            echo "Merge-base differs from exact route baseline." >&2
            exit 2
          }
          if [[ "${PROFILE}" == atlas-contracts ]]; then
            [[ "${BASE}" == "${CONTRACT_EVIDENCE_BASE}" ]]
            [[ "${TARGET}" == f41de5043a22f8559a3b6a0d71654fbd542b5ec6 ]]
          elif [[ "${PROFILE}" == atlas-support ]]; then
            [[ "${BASE}" == "${REVISION_SAFE_SUPPORT_BASE}" ]]
          elif [[ "${PROFILE}" == atlas-int-post-merge ]]; then
            [[ "${BASE}" == "${CORRECTIVE_COMMON_BASELINE}" ]]
            [[ "${BRANCH}" == main ]]
            [[ "${POST_MERGE}" == true ]]
          elif [[ "${PROFILE}" == atlas-ux-convergence ]]; then
            [[ "${EVENT}" == pull_request ]]
            [[ "${BRANCH}" == stream1/issue-352-one-atlas-learning-journey ]]
            [[ "${BASE}" == "${WAVE_A_BASE}" ]]
            [[ "${POST_MERGE}" == false ]]
          elif [[ "${PROFILE}" == atlas-learning || "${PROFILE}" == atlas-core || "${PROFILE}" == atlas-experience || "${PROFILE}" == atlas-content || "${PROFILE}" == atlas-int || "${PROFILE}" == atlas-qa ]]; then
            case "${BRANCH}" in
              *-corrective-0-3|agent/ATLAS-WP-001-qa-0-3|agent/ATLAS-WP-001-m1-0-3-int) [[ "${BASE}" == "${CORRECTIVE_COMMON_BASELINE}" ]] ;;
              *) [[ "${BASE}" == "${CONTRACT_EVIDENCE_BASE}" ]] ;;
            esac
          fi
          if [[ "${PROFILE}" == wave-a ]]; then
            for sha in "${WAVE_A_BASE}" ae999472418a18a1181b43a07259a4395afbcf7f 48df0517d74e8c343223f14361607c4a93e7f55b 6c4111715a55fdff07a3e466d013dcdcc7aa5c78 f260093914542f93ff9145cbac8e98aae415fe01 f25da6356528824e84224718013a3bccb2707c49; do
              git fetch --force --no-tags origin "${sha}"
            done
          fi

      - name: Preflight exact Atlas M1 promotion merge
        if: github.event_name == 'pull_request' && steps.profile.outputs.name == 'atlas-support'
        shell: bash
        run: |
          set -euo pipefail

          candidate="$(git rev-parse refs/remotes/origin/agent/ATLAS-WP-001-m1-0-3-int)"
          [[ "${candidate}" =~ ^[0-9a-f]{40}$ ]]

          merge_tree="${RUNNER_TEMP}/atlas-m1-promotion-preflight-merge"
          candidate_tree="${RUNNER_TEMP}/atlas-m1-promotion-preflight-candidate"

          cleanup() {
            git worktree remove --force "${merge_tree}" >/dev/null 2>&1 || true
            git worktree remove --force "${candidate_tree}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "${merge_tree}" HEAD
          git worktree add --detach "${candidate_tree}" "${candidate}"

          git -C "${merge_tree}" config user.name "atlas-ci"
          git -C "${merge_tree}" config user.email "atlas-ci@users.noreply.github.com"
          git -C "${merge_tree}" merge --no-commit --no-ff "${candidate}"

          actual="$(git -C "${merge_tree}" diff --cached --name-only | sed '/^$/d' | sort -u)"
          expected="$(printf '%s\n' "${ATLAS_M1_PROMOTION_PATHS}" | sed '/^$/d' | sort -u)"
          [[ "${actual}" == "${expected}" ]] || {
            echo "Atlas M1 synthetic merge path set differs." >&2
            diff -u <(printf '%s\n' "${expected}") <(printf '%s\n' "${actual}") || true
            exit 2
          }

          merged_html="${RUNNER_TEMP}/atlas-m1-promotion-preflight-merged.html"
          candidate_html="${RUNNER_TEMP}/atlas-m1-promotion-preflight-candidate.html"

          python -B "${merge_tree}/apps/learnit-next/build.py" --output "${merged_html}"
          python -B "${candidate_tree}/apps/learnit-next/build.py" --output "${candidate_html}"

          cmp "${candidate_html}" "${merged_html}"
          merged_sha="$(sha256sum "${merged_html}" | awk '{print $1}')"
          candidate_sha="$(sha256sum "${candidate_html}" | awk '{print $1}')"
          merged_bytes="$(wc -c < "${merged_html}" | tr -d ' ')"
          candidate_bytes="$(wc -c < "${candidate_html}" | tr -d ' ')"

          [[ "${merged_sha}" == "${candidate_sha}" ]]
          [[ "${merged_bytes}" == "${candidate_bytes}" ]]

          echo "ATLAS_POST_MERGE_PREFLIGHT=PASS"
          echo "ATLAS_PREFLIGHT_ACCEPTED_INT=${candidate}"
          echo "ATLAS_PREFLIGHT_ARTIFACT_SHA256=${candidate_sha}"
          echo "ATLAS_PREFLIGHT_ARTIFACT_BYTES=${candidate_bytes}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove clean worktree and install declared dependencies
        shell: bash
        env:
          PROFILE: ${{ steps.profile.outputs.name }}
          BEFORE: ${{ runner.temp }}/atlas-worktree-before-install.json
          INSTALL: ${{ runner.temp }}/atlas-dependency-commands.json
          AFTER: ${{ runner.temp }}/atlas-worktree-after-install.json
          DEPENDENCY: apps/player/requirements-test.txt
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,json,os,subprocess,sys
          from pathlib import Path
          def rec(c):
              s=datetime.datetime.now(datetime.timezone.utc).isoformat()
              r=subprocess.run(c,text=True,capture_output=True)
              return {'command':c,'started_at_utc':s,'exit_code':r.returncode,'stdout':r.stdout,'stderr':r.stderr}
          def clean(p):
              x=[rec(['git','status','--porcelain=v1','--untracked-files=all']),rec(['git','diff','--exit-code']),rec(['git','diff','--cached','--exit-code'])]
              Path(p).write_text(json.dumps(x))
              assert not any(i['exit_code'] for i in x) and not x[0]['stdout']
          clean(os.environ['BEFORE'])
          cmds=[[sys.executable,'-m','pip','install','--disable-pip-version-check','--no-cache-dir','-r',os.environ['DEPENDENCY']]]
          if os.environ['PROFILE']=='wave-a':
              cmds.append([sys.executable,'-m','playwright','install','--with-deps','chromium'])
          x=[rec(c) for c in cmds]
          Path(os.environ['INSTALL']).write_text(json.dumps(x))
          assert not any(i['exit_code'] for i in x)
          clean(os.environ['AFTER'])
          PY
          printf 'ATLAS_WORKTREE_BEFORE_INSTALL_JSON=%s\nATLAS_DEPENDENCY_COMMANDS_JSON=%s\nATLAS_WORKTREE_AFTER_INSTALL_JSON=%s\nATLAS_DEPENDENCY_PATH=%s\n' \
            "${BEFORE}" "${INSTALL}" "${AFTER}" "${DEPENDENCY}" >> "${GITHUB_ENV}"
          echo "ATLAS_DEPENDENCY_SHA256=$(sha256sum "${DEPENDENCY}" | awk '{print $1}')" >> "${GITHUB_ENV}"

      - name: Run exact routed profile
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PROFILE: ${{ steps.profile.outputs.name }}
          BRANCH: ${{ steps.profile.outputs.branch }}
          BASE: ${{ steps.profile.outputs.base }}
          TARGET: ${{ steps.target.outputs.target }}
          MODE: ${{ steps.target.outputs.mode }}
          ACCEPTED: ${{ steps.target.outputs.accepted }}
          POST_MERGE: ${{ steps.profile.outputs.post_merge }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HTTP_PROXY: ${{ steps.profile.outputs.name == 'atlas-contracts' && 'http://127.0.0.1:9' || '' }}
