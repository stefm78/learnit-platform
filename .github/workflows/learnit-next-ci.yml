name: Learn-it Next CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Exact verification topology
        required: true
        type: choice
        options: [integration-head, post-merge]
      verification_ref:
        description: Exact 40-character commit SHA
        required: true
        type: string
      accepted_integration_head:
        description: Exact accepted integration head for post-merge
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: learnit-next-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.verification_ref || github.sha }}
  cancel-in-progress: true

jobs:
  wave-a-gate:
    name: Wave A exact-head matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve exact target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REF: ${{ github.event.pull_request.head.ref }}
          PUSH_SHA: ${{ github.sha }}
          DISPATCH_SHA: ${{ inputs.verification_ref }}
          DISPATCH_MODE: ${{ inputs.verification_mode }}
          DISPATCH_ACCEPTED: ${{ inputs.accepted_integration_head }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request)
              target="${PR_SHA}"
              mode="integration-head"
              accepted=""
              branch_ref="${PR_REF}"
              case "${branch_ref}" in
                agent/ATLAS-WP-001-support-governance-ci) profile="atlas-support" ;;
                agent/ATLAS-WP-001-learning) profile="atlas-learning" ;;
                agent/ATLAS-WP-001-experience) profile="atlas-experience" ;;
                agent/ATLAS-WP-001-core) profile="atlas-core" ;;
                agent/ATLAS-WP-001-content) profile="atlas-content" ;;
                agent/ATLAS-WP-001-qa) profile="atlas-qa" ;;
                agent/PROG-WP-001-wave-a-learning|\
                agent/PROG-WP-001-wave-a-ux|\
                agent/PROG-WP-001-wave-a-authoring|\
                agent/PROG-WP-001-wave-a-platform|\
                agent/PROG-WP-001-wave-a-qa|\
                agent/PROG-WP-001-wave-a-int)
                  profile="wave-a"
                  ;;
                *)
                  echo "Unrecognized pull-request branch: ${branch_ref}" >&2
                  exit 2
                  ;;
              esac
              ;;
            push)
              target="${PUSH_SHA}"
              mode="post-merge"
              accepted=""
              branch_ref="main"
              profile="post-merge-auto"
              ;;
            workflow_dispatch)
              target="${DISPATCH_SHA}"
              mode="${DISPATCH_MODE}"
              accepted="${DISPATCH_ACCEPTED}"
              branch_ref=""
              profile="wave-a"
              ;;
            *)
              echo "Unsupported event: ${EVENT_NAME}" >&2
              exit 2
              ;;
          esac
          [[ "${target}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Target must be an exact lowercase SHA." >&2
            exit 2
          }
          echo "target=${target}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "accepted=${accepted}" >> "${GITHUB_OUTPUT}"
          echo "branch_ref=${branch_ref}" >> "${GITHUB_OUTPUT}"
          echo "profile=${profile}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target }}
          fetch-depth: 0

      - name: Resolve checked-out profile
        id: profile
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INITIAL_PROFILE: ${{ steps.target.outputs.profile }}
          INITIAL_BRANCH: ${{ steps.target.outputs.branch_ref }}
        run: |
          set -euo pipefail
          profile="${INITIAL_PROFILE}"
          branch_ref="${INITIAL_BRANCH}"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            parents=( $(git show -s --format=%P HEAD) )
            [[ ${#parents[@]} -eq 2 ]] || {
              echo "Post-merge target must have exactly two parents." >&2
              exit 2
            }
            mapfile -t changed < <(git diff --name-only "${parents[0]}" HEAD)
            support_paths=(
              .github/workflows/learnit-next-ci.yml
              apps/learnit-next/dev/run_checks.py
              governance/governor-state.json
            )
            mapfile -t expected < <(printf '%s\n' "${support_paths[@]}" | sort)
            mapfile -t actual < <(printf '%s\n' "${changed[@]}" | sort)
            if [[ "$(printf '%s\n' "${actual[@]}")" == "$(printf '%s\n' "${expected[@]}")" ]]; then
              profile="atlas-support"
              branch_ref="agent/ATLAS-WP-001-support-governance-ci"
            else
              profile="wave-a"
              branch_ref="main"
            fi
          fi
          echo "name=${profile}" >> "${GITHUB_OUTPUT}"
          echo "branch_ref=${branch_ref}" >> "${GITHUB_OUTPUT}"

      - name: Fetch exact Wave A authority and lane heads
        if: steps.profile.outputs.name == 'wave-a'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          for sha in \
            8ebafee48cc5277b92776982639a0146ae7e76d0 \
            ae999472418a18a1181b43a07259a4395afbcf7f \
            48df0517d74e8c343223f14361607c4a93e7f55b \
            6c4111715a55fdff07a3e466d013dcdcc7aa5c78 \
            f260093914542f93ff9145cbac8e98aae415fe01 \
            f25da6356528824e84224718013a3bccb2707c49
          do
            git fetch --force --no-tags origin "${sha}"
            git cat-file -e "${sha}^{commit}"
          done
          [[ "$(git rev-parse HEAD)" == "${{ steps.target.outputs.target }}" ]]

      - name: Fetch Atlas support authority
        if: startsWith(steps.profile.outputs.name, 'atlas-')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git fetch --force --no-tags origin 58e39e8917006058fdf177a5daa37535f5e2c78d
          git cat-file -e 58e39e8917006058fdf177a5daa37535f5e2c78d^{commit}
          [[ "$(git rev-parse HEAD)" == "${{ steps.target.outputs.target }}" ]]

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.25.1 playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Resolve post-merge accepted head
        if: steps.profile.outputs.name == 'wave-a'
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          accepted="${{ steps.target.outputs.accepted }}"
          if [[ "${{ steps.target.outputs.mode }}" == "post-merge" && -z "${accepted}" ]]; then
            parents=( $(git show -s --format=%P HEAD) )
            [[ ${#parents[@]} -eq 2 ]] || {
              echo "Post-merge target must have exactly two parents." >&2
              exit 2
            }
            accepted="${parents[1]}"
          fi
          echo "accepted=${accepted}" >> "${GITHUB_OUTPUT}"

      - name: Run exact-head integration gate
        if: steps.profile.outputs.name == 'wave-a'
        env:
          LEARNIT_NEXT_STRICT_INTEGRATION: '1'
        run: |
          args=(
            --strict
            --mode "${{ steps.target.outputs.mode }}"
            --base-ref "8ebafee48cc5277b92776982639a0146ae7e76d0"
          )
          if [[ -n "${{ steps.mode.outputs.accepted }}" ]]; then
            args+=(--accepted-integration-head "${{ steps.mode.outputs.accepted }}")
          fi
          python apps/learnit-next/dev/run_checks.py "${args[@]}"

      - name: Run Atlas routed profile
        if: startsWith(steps.profile.outputs.name, 'atlas-')
        shell: bash
        run: |
          set -euo pipefail
          runner="${GITHUB_WORKSPACE}/apps/learnit-next/dev/run_checks.py"
          if [[ "${{ steps.profile.outputs.name }}" != "atlas-support" ]]; then
            runner="${RUNNER_TEMP}/atlas-m1-run-checks.py"
            git show origin/main:apps/learnit-next/dev/run_checks.py > "${runner}"
            grep -q 'learnit.next.ci.checks.atlas-m1.v1' "${runner}"
          fi
          LEARNIT_REPO_ROOT="${GITHUB_WORKSPACE}" python "${runner}" \
            --strict \
            --profile "${{ steps.profile.outputs.name }}" \
            --base-ref "58e39e8917006058fdf177a5daa37535f5e2c78d" \
            --branch-ref "${{ steps.profile.outputs.branch_ref }}"

      - name: Run fixed profile — authoring
        if: steps.profile.outputs.name == 'wave-a'
        run: |
          mkdir -p apps/learnit-next/.agent-result
          python tools/learnit_next_agent.py \
            --profile learnit-next-authoring \
            --output apps/learnit-next/.agent-result/profile-authoring.json

      - name: Run fixed profile — contract
        if: steps.profile.outputs.name == 'wave-a'
        run: |
          python tools/learnit_next_agent.py \
            --profile learnit-next-contract \
            --output apps/learnit-next/.agent-result/profile-contract.json

      - name: Run fixed profile — full
        if: steps.profile.outputs.name == 'wave-a'
        env:
          LLV2_QA_STRICT: '1'
        run: |
          python tools/learnit_next_agent.py \
            --profile learnit-next-full \
            --output apps/learnit-next/.agent-result/profile-full.json

      - name: Run fixed profile — browser
        if: steps.profile.outputs.name == 'wave-a'
        env:
          LLV2_QA_STRICT: '1'
          LLV2_QA_BROWSER_STRICT: '1'
        run: |
          python tools/learnit_next_agent.py \
            --profile learnit-next-browser \
            --output apps/learnit-next/.agent-result/profile-browser.json

      - name: Replay exact QA head
        if: steps.profile.outputs.name == 'wave-a'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"

          artifact="${GITHUB_WORKSPACE}/apps/learnit-next/dist/learnit-next.html"
          test -f "${artifact}"
          artifact_bytes_before="$(stat -c '%s' "${artifact}")"
          artifact_sha_before="$(sha256sum "${artifact}" | awk '{print $1}')"

          qa_parent="$(mktemp -d "${RUNNER_TEMP}/wave-a-qa.XXXXXX")"
          trap 'rm -rf -- "${qa_parent}"' EXIT
          qa_root="$(python - "${qa_parent}" <<'PY'
          import importlib.util
          import sys
          from pathlib import Path

          destination = Path(sys.argv[1]).resolve()
          run_checks_path = Path.cwd() / "apps/learnit-next/dev/run_checks.py"
          spec = importlib.util.spec_from_file_location("wave_a_run_checks", run_checks_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load run_checks materialization API")
          run_checks = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(run_checks)
          manifest = run_checks.load_manifest()
          root = run_checks.materialize(destination, manifest).resolve()
          print(root)
          PY
          )"

          [[ "${qa_root}" == "${qa_parent}/repo" ]]
          [[ "${qa_root}" == "${RUNNER_TEMP}"/* ]]
          [[ "${qa_root}" != "${GITHUB_WORKSPACE}"/* ]]

          for required in \
            apps/learnit-next/src/main.js \
            apps/learnit-next/src/core/contract.js \
            apps/learnit-next/tests/qa_learning_loop_v2.py
          do
            test -f "${qa_root}/${required}"
          done

          qa_path="apps/learnit-next/tests/qa_learning_loop_v2.py"
          expected_qa_blob="$(git rev-parse "f25da6356528824e84224718013a3bccb2707c49:${qa_path}")"
          actual_qa_blob="$(git hash-object "${qa_root}/${qa_path}")"
          [[ "${expected_qa_blob}" == "514d095b5fa028d12dc6d87ba7d4bd82c64a0cd9" ]]
          [[ "${actual_qa_blob}" == "${expected_qa_blob}" ]]

          export LLV2_PRODUCT_TREE="${qa_root}"
          export LEARNIT_NEXT_ARTIFACT="${artifact}"
          export LLV2_QA_STRICT='1'
          export LLV2_QA_BROWSER_STRICT='1'
          export PYTHONDONTWRITEBYTECODE='1'

          python - "${qa_root}" <<'PY'
          import os
          import sys
          from pathlib import Path

          expected = Path(sys.argv[1]).resolve()
          actual = Path(os.environ["LLV2_PRODUCT_TREE"]).resolve()
          if actual != expected:
              raise SystemExit("QA product tree differs from materialized tree")
          if Path(os.environ["LEARNIT_NEXT_ARTIFACT"]).resolve() == expected / "apps/learnit-next/dist/learnit-next.html":
              raise SystemExit("QA artifact must be the exact workspace HTML already tested")
          PY

          (
            cd "${qa_root}"
            python "${qa_path}" -v
          ) 2>&1 | tee "${GITHUB_WORKSPACE}/apps/learnit-next/.agent-result/qa-exact.log"

          [[ "$(git hash-object "${qa_root}/${qa_path}")" == "${expected_qa_blob}" ]]
          test -z "$(git status --porcelain --untracked-files=no)"
          [[ "$(stat -c '%s' "${artifact}")" == "${artifact_bytes_before}" ]]
          [[ "$(sha256sum "${artifact}" | awk '{print $1}')" == "${artifact_sha_before}" ]]

      - name: Verify all reports and exact HTML
        if: steps.profile.outputs.name == 'wave-a'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          reports={}
          for name in ("authoring", "contract", "full", "browser"):
              path=Path(f"apps/learnit-next/.agent-result/profile-{name}.json")
              payload=json.loads(path.read_text(encoding="utf-8"))
              if payload.get("result")!="PASS":
                  raise SystemExit(f"profile failed: {name}")
              reports[name]=payload
          gate=json.loads(Path("apps/learnit-next/.agent-result/run_checks.json").read_text(encoding="utf-8"))
          if gate.get("result")!="PASS":
              raise SystemExit("integration gate failed")
          identity={key:gate["artifact"][key] for key in ("path","bytes","sha256")}
          for name in ("full","browser"):
              if reports[name].get("artifact")!=identity:
                  raise SystemExit(f"profile artifact differs: {name}")
          html=Path(identity["path"])
          if not html.is_file() or html.stat().st_size!=identity["bytes"]:
              raise SystemExit("tested HTML is absent or has wrong size")
          if not Path("apps/learnit-next/.agent-result/qa-exact.log").is_file():
              raise SystemExit("exact QA log is absent")
          print(json.dumps(identity,sort_keys=True))
          PY

      - name: Upload exact Wave A proof
        if: always() && steps.profile.outputs.name == 'wave-a'
        uses: actions/upload-artifact@v4
        with:
          name: learnit-next-wave-a-${{ steps.target.outputs.target }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: |
            apps/learnit-next/source_manifest.json
            apps/learnit-next/.agent-result/run_checks.json
            apps/learnit-next/.agent-result/profile-authoring.json
            apps/learnit-next/.agent-result/profile-contract.json
            apps/learnit-next/.agent-result/profile-full.json
            apps/learnit-next/.agent-result/profile-browser.json
            apps/learnit-next/.agent-result/qa-exact.log
            apps/learnit-next/dist/learnit-next.html

      - name: Upload Atlas routed proof
        if: always() && startsWith(steps.profile.outputs.name, 'atlas-')
        uses: actions/upload-artifact@v4
        with:
          name: learnit-next-${{ steps.profile.outputs.name }}-${{ steps.target.outputs.target }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: apps/learnit-next/.agent-result/run_checks.json
