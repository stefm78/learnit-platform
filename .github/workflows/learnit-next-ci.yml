name: Learn-it Next CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Exact verification topology
        required: true
        type: choice
        options: [integration-head, post-merge]
      verification_ref:
        description: Exact 40-character commit SHA
        required: true
        type: string
      accepted_integration_head:
        description: Exact accepted integration head for post-merge
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: learnit-next-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.verification_ref || github.sha }}
  cancel-in-progress: true

jobs:
  exact-head-matrix:
    name: Exact-head routed matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve exact target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REF: ${{ github.event.pull_request.head.ref }}
          PUSH_SHA: ${{ github.sha }}
          DISPATCH_SHA: ${{ inputs.verification_ref }}
          DISPATCH_MODE: ${{ inputs.verification_mode }}
          DISPATCH_ACCEPTED: ${{ inputs.accepted_integration_head }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request)
              target="${PR_SHA}"
              mode="integration-head"
              accepted=""
              branch_ref="${PR_REF}"
              case "${branch_ref}" in
                agent/ATLAS-WP-001-support-governance-ci) profile="atlas-support" ;;
                agent/ATLAS-WP-001-contracts-0-3) profile="atlas-contracts" ;;
                agent/ATLAS-WP-001-learning) profile="atlas-learning" ;;
                agent/ATLAS-WP-001-experience) profile="atlas-experience" ;;
                agent/ATLAS-WP-001-core) profile="atlas-core" ;;
                agent/ATLAS-WP-001-content) profile="atlas-content" ;;
                agent/ATLAS-WP-001-qa) profile="atlas-qa" ;;
                agent/PROG-WP-001-wave-a-learning|\
                agent/PROG-WP-001-wave-a-ux|\
                agent/PROG-WP-001-wave-a-authoring|\
                agent/PROG-WP-001-wave-a-platform|\
                agent/PROG-WP-001-wave-a-qa|\
                agent/PROG-WP-001-wave-a-int)
                  profile="wave-a"
                  ;;
                *)
                  echo "Unrecognized pull-request branch: ${branch_ref}" >&2
                  exit 2
                  ;;
              esac
              ;;
            push)
              target="${PUSH_SHA}"
              mode="post-merge"
              accepted=""
              branch_ref="main"
              profile="post-merge-auto"
              ;;
            workflow_dispatch)
              target="${DISPATCH_SHA}"
              mode="${DISPATCH_MODE}"
              accepted="${DISPATCH_ACCEPTED}"
              branch_ref=""
              profile="wave-a"
              ;;
            *)
              echo "Unsupported event: ${EVENT_NAME}" >&2
              exit 2
              ;;
          esac
          [[ "${target}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Target must be an exact lowercase SHA." >&2
            exit 2
          }
          {
            echo "target=${target}"
            echo "mode=${mode}"
            echo "accepted=${accepted}"
            echo "branch_ref=${branch_ref}"
            echo "profile=${profile}"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target }}
          fetch-depth: 0
          clean: true

      - name: Resolve checked-out profile
        id: profile
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INITIAL_PROFILE: ${{ steps.target.outputs.profile }}
          INITIAL_BRANCH: ${{ steps.target.outputs.branch_ref }}
        run: |
          set -euo pipefail
          profile="${INITIAL_PROFILE}"
          branch_ref="${INITIAL_BRANCH}"
          if [[ "${EVENT_NAME}" == "push" ]]; then
            parents=( $(git show -s --format=%P HEAD) )
            [[ ${#parents[@]} -eq 2 ]] || {
              echo "Post-merge target must have exactly two parents." >&2
              exit 2
            }
            mapfile -t changed < <(git diff --name-only "${parents[0]}" HEAD)
            support_paths=(
              .github/workflows/learnit-next-ci.yml
              apps/learnit-next/dev/run_checks.py
              governance/governor-state.json
            )
            mapfile -t expected < <(printf '%s\n' "${support_paths[@]}" | sort)
            mapfile -t actual < <(printf '%s\n' "${changed[@]}" | sort)
            if [[ "$(printf '%s\n' "${actual[@]}")" == "$(printf '%s\n' "${expected[@]}")" ]]; then
              profile="atlas-support"
              branch_ref="agent/ATLAS-WP-001-support-governance-ci"
            else
              profile="wave-a"
              branch_ref="main"
            fi
          fi
          {
            echo "name=${profile}"
            echo "branch_ref=${branch_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Fetch exact authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git fetch --force --no-tags origin 58e39e8917006058fdf177a5daa37535f5e2c78d
          git cat-file -e 58e39e8917006058fdf177a5daa37535f5e2c78d^{commit}
          [[ "$(git rev-parse HEAD)" == "${{ steps.target.outputs.target }}" ]]
          if [[ "${{ steps.profile.outputs.name }}" == "wave-a" ]]; then
            for sha in \
              8ebafee48cc5277b92776982639a0146ae7e76d0 \
              ae999472418a18a1181b43a07259a4395afbcf7f \
              48df0517d74e8c343223f14361607c4a93e7f55b \
              6c4111715a55fdff07a3e466d013dcdcc7aa5c78 \
              f260093914542f93ff9145cbac8e98aae415fe01 \
              f25da6356528824e84224718013a3bccb2707c49
            do
              git fetch --force --no-tags origin "${sha}"
              git cat-file -e "${sha}^{commit}"
            done
          fi
          if [[ "${{ steps.profile.outputs.name }}" == "atlas-contracts" ]]; then
            [[ "$(git rev-parse HEAD)" == "f41de5043a22f8559a3b6a0d71654fbd542b5ec6" ]]
            [[ "$(git merge-base HEAD 58e39e8917006058fdf177a5daa37535f5e2c78d)" == "58e39e8917006058fdf177a5daa37535f5e2c78d" ]]
            expected="$(
              printf '%s\n' \
                contracts/fixtures/atlas-m1-invalid-loop.json \
                contracts/fixtures/atlas-m1-valid-loop.json \
                contracts/learnit-kit-v2.schema.json \
                docs/atlas/CONTRACTS.md \
                work-packages/ATLAS-WP-001.json |
              sort
            )"
            actual="$(git diff --name-only 58e39e8917006058fdf177a5daa37535f5e2c78d...HEAD | sort)"
            [[ "${actual}" == "${expected}" ]]
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture worktree before dependency installation
        shell: bash
        env:
          OUTPUT: ${{ runner.temp }}/atlas-worktree-before-install.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, subprocess
          from pathlib import Path

          def now():
              return datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z")

          records = []
          for command in (
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              ["git", "diff", "--exit-code"],
              ["git", "diff", "--cached", "--exit-code"],
          ):
              started = now()
              completed = subprocess.run(command, text=True, capture_output=True)
              records.append({
                  "command": command,
                  "working_directory": str(Path.cwd()),
                  "started_at_utc": started,
                  "finished_at_utc": now(),
                  "exit_code": completed.returncode,
                  "stdout": completed.stdout,
                  "stderr": completed.stderr,
              })
          Path(os.environ["OUTPUT"]).write_text(json.dumps(records, indent=2) + "\n", encoding="utf-8")
          if any(item["exit_code"] for item in records) or records[0]["stdout"]:
              raise SystemExit("worktree is not clean before dependency installation")
          PY
          echo "ATLAS_WORKTREE_BEFORE_INSTALL_JSON=${OUTPUT}" >> "${GITHUB_ENV}"

      - name: Install dependencies from repository declaration
        shell: bash
        env:
          OUTPUT: ${{ runner.temp }}/atlas-dependency-commands.json
          PROFILE: ${{ steps.profile.outputs.name }}
          DEPENDENCY_PATH: apps/player/requirements-test.txt
        run: |
          set -euo pipefail
          test -f "${DEPENDENCY_PATH}"
          dependency_sha="$(sha256sum "${DEPENDENCY_PATH}" | awk '{print $1}')"
          echo "ATLAS_DEPENDENCY_PATH=${DEPENDENCY_PATH}" >> "${GITHUB_ENV}"
          echo "ATLAS_DEPENDENCY_SHA256=${dependency_sha}" >> "${GITHUB_ENV}"
          python - <<'PY'
          import datetime, json, os, subprocess, sys
          from pathlib import Path

          def now():
              return datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z")

          commands = [
              [sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "--no-cache-dir", "-r", os.environ["DEPENDENCY_PATH"]],
          ]
          if os.environ["PROFILE"] == "wave-a":
              commands.append([sys.executable, "-m", "playwright", "install", "--with-deps", "chromium"])
          records = []
          for command in commands:
              started = now()
              completed = subprocess.run(command, text=True, capture_output=True)
              records.append({
                  "command": command,
                  "working_directory": str(Path.cwd()),
                  "started_at_utc": started,
                  "finished_at_utc": now(),
                  "exit_code": completed.returncode,
                  "stdout": completed.stdout,
                  "stderr": completed.stderr,
              })
              if completed.returncode:
                  break
          Path(os.environ["OUTPUT"]).write_text(json.dumps(records, indent=2) + "\n", encoding="utf-8")
          if not records or any(item["exit_code"] for item in records):
              raise SystemExit("dependency installation failed")
          PY
          echo "ATLAS_DEPENDENCY_COMMANDS_JSON=${OUTPUT}" >> "${GITHUB_ENV}"

      - name: Capture worktree after dependency installation
        shell: bash
        env:
          OUTPUT: ${{ runner.temp }}/atlas-worktree-after-install.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, subprocess
          from pathlib import Path

          def now():
              return datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z")

          records = []
          for command in (
              ["git", "status", "--porcelain=v1", "--untracked-files=all"],
              ["git", "diff", "--exit-code"],
              ["git", "diff", "--cached", "--exit-code"],
          ):
              started = now()
              completed = subprocess.run(command, text=True, capture_output=True)
              records.append({
                  "command": command,
                  "working_directory": str(Path.cwd()),
                  "started_at_utc": started,
                  "finished_at_utc": now(),
                  "exit_code": completed.returncode,
                  "stdout": completed.stdout,
                  "stderr": completed.stderr,
              })
          Path(os.environ["OUTPUT"]).write_text(json.dumps(records, indent=2) + "\n", encoding="utf-8")
          if any(item["exit_code"] for item in records) or records[0]["stdout"]:
              raise SystemExit("worktree changed during dependency installation")
          PY
          echo "ATLAS_WORKTREE_AFTER_INSTALL_JSON=${OUTPUT}" >> "${GITHUB_ENV}"

      - name: Run exact routed profile
        shell: bash
        env:
          PROFILE: ${{ steps.profile.outputs.name }}
          BRANCH_REF: ${{ steps.profile.outputs.branch_ref }}
          MODE: ${{ steps.target.outputs.mode }}
          ACCEPTED: ${{ steps.target.outputs.accepted }}
          HTTP_PROXY: ${{ steps.profile.outputs.name == 'atlas-contracts' && 'http://127.0.0.1:9' || '' }}
          HTTPS_PROXY: ${{ steps.profile.outputs.name == 'atlas-contracts' && 'http://127.0.0.1:9' || '' }}
          ALL_PROXY: ${{ steps.profile.outputs.name == 'atlas-contracts' && 'http://127.0.0.1:9' || '' }}
          ATLAS_NETWORK_BLOCKED: ${{ steps.profile.outputs.name == 'atlas-contracts' && '1' || '0' }}
        run: |
          set -euo pipefail
          runner="${GITHUB_WORKSPACE}/apps/learnit-next/dev/run_checks.py"
          if [[ "${PROFILE}" != "atlas-support" ]]; then
            runner="${RUNNER_TEMP}/atlas-m1-run-checks.py"
            git show origin/main:apps/learnit-next/dev/run_checks.py > "${runner}"
            grep -q 'learnit.next.ci.checks.atlas-m1.v1' "${runner}"
          fi
          if [[ "${PROFILE}" == "wave-a" ]]; then
            args=(
              --strict
              --profile wave-a-ci
              --mode "${MODE}"
              --base-ref 8ebafee48cc5277b92776982639a0146ae7e76d0
            )
            if [[ -n "${ACCEPTED}" ]]; then
              args+=(--accepted-integration-head "${ACCEPTED}")
            fi
            LEARNIT_REPO_ROOT="${GITHUB_WORKSPACE}" python "${runner}" "${args[@]}"
          else
            LEARNIT_REPO_ROOT="${GITHUB_WORKSPACE}" python "${runner}" \
              --strict \
              --profile "${PROFILE}" \
              --base-ref 58e39e8917006058fdf177a5daa37535f5e2c78d \
              --branch-ref "${BRANCH_REF}"
          fi

      - name: Upload exact contract proof
        if: always() && steps.profile.outputs.name == 'atlas-contracts'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-contracts-evidence-f41de5043a22f8559a3b6a0d71654fbd542b5ec6
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: |
            apps/learnit-next/.agent-result/run_checks.json
            apps/learnit-next/.agent-result/atlas-contracts-evidence.json
            apps/learnit-next/.agent-result/atlas-contracts-evidence.md
            apps/learnit-next/.agent-result/atlas-contracts-commands.log

      - name: Upload exact Wave A proof
        if: always() && steps.profile.outputs.name == 'wave-a'
        uses: actions/upload-artifact@v4
        with:
          name: learnit-next-wave-a-${{ steps.target.outputs.target }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: |
            apps/learnit-next/source_manifest.json
            apps/learnit-next/.agent-result/run_checks.json
            apps/learnit-next/.agent-result/profile-authoring.json
            apps/learnit-next/.agent-result/profile-contract.json
            apps/learnit-next/.agent-result/profile-full.json
            apps/learnit-next/.agent-result/profile-browser.json
            apps/learnit-next/.agent-result/qa-exact.log
            apps/learnit-next/dist/learnit-next.html

      - name: Upload Atlas routed proof
        if: always() && startsWith(steps.profile.outputs.name, 'atlas-') && steps.profile.outputs.name != 'atlas-contracts'
        uses: actions/upload-artifact@v4
        with:
          name: learnit-next-${{ steps.profile.outputs.name }}-${{ steps.target.outputs.target }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: apps/learnit-next/.agent-result/run_checks.json
