name: Learn-it Next CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learnit-next-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: strict foundation gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record checked-out tree identity
        run: |
          mkdir -p apps/learnit-next/.agent-result
          git rev-parse 'HEAD^{tree}' | tee apps/learnit-next/.agent-result/tree-sha.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.25.1 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Resolve main comparison ref
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Run strict integrated checks
        id: checks
        env:
          LEARNIT_NEXT_STRICT_INTEGRATION: '1'
          LEARNIT_NEXT_BASE_REF: origin/main
        shell: bash
        run: |
          set +e
          python apps/learnit-next/dev/run_checks.py --strict
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print strict report
        if: always()
        run: |
          if test -f apps/learnit-next/.agent-result/run_checks.json; then
            cat apps/learnit-next/.agent-result/run_checks.json
          else
            echo "Strict report was not created." >&2
          fi
      - name: Create non-committed release envelope
        if: steps.checks.outputs.exit_code == '0'
        run: python apps/learnit-next/dev/release.py
      - name: Upload proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnit-next-integration-proof
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/learnit-next/source_manifest.json
            apps/learnit-next/.agent-result/tree-sha.txt
            apps/learnit-next/.agent-result/run_checks.json
            apps/learnit-next/release/learnit-next.html
            apps/learnit-next/release/release-envelope.json
      - name: Enforce strict result
        if: steps.checks.outputs.exit_code != '0'
        run: |
          echo "Strict Learn-it Next integration checks failed." >&2
          exit 1
