name: Learn-it Next CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Explicit verification topology
        required: true
        type: choice
        options:
          - integration-head
          - post-merge
          - maintenance-pr
      accepted_integration_head:
        description: Required exact accepted integration head for post-merge mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: learnit-next-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: strict foundation gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record checked-out tree identity
        run: |
          mkdir -p apps/learnit-next/.agent-result
          git rev-parse 'HEAD^{tree}' | tee apps/learnit-next/.agent-result/tree-sha.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.25.1 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Resolve comparison refs
        run: |
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git fetch --force --no-tags origin e5ee65a37326f4861d33c3c80221527511a03f24
      - name: Resolve explicit verification mode
        id: mode
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.verification_mode }}
          DISPATCH_ACCEPTED_HEAD: ${{ inputs.accepted_integration_head }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              if [[ "${PR_NUMBER}" == "114" && "${PR_HEAD_REF}" == "ci/CI-WP-002-current-main" ]]; then
                mode="maintenance-pr"
              else
                mode="integration-head"
              fi
              accepted_head=""
              ;;
            push)
              mode="post-merge"
              accepted_head="$(git rev-parse HEAD^2)"
              ;;
            workflow_dispatch)
              mode="${DISPATCH_MODE}"
              accepted_head="${DISPATCH_ACCEPTED_HEAD}"
              ;;
            *)
              echo "Unsupported event: ${GITHUB_EVENT_NAME}" >&2
              exit 2
              ;;
          esac
          case "${mode}" in
            integration-head|maintenance-pr)
              ;;
            post-merge)
              test -n "${accepted_head}" || {
                echo "post-merge mode requires an accepted integration head" >&2
                exit 2
              }
              ;;
            *)
              echo "Unknown verification mode: ${mode}" >&2
              exit 2
              ;;
          esac
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "accepted_head=${accepted_head}" >> "$GITHUB_OUTPUT"
      - name: Run strict mode-aware checks
        id: checks
        env:
          LEARNIT_NEXT_STRICT_INTEGRATION: '1'
          LEARNIT_NEXT_BASE_REF: origin/main
        shell: bash
        run: |
          set +e
          args=(
            --strict
            --mode "${{ steps.mode.outputs.mode }}"
            --base-ref origin/main
          )
          if test -n "${{ steps.mode.outputs.accepted_head }}"; then
            args+=(--accepted-integration-head "${{ steps.mode.outputs.accepted_head }}")
          fi
          python apps/learnit-next/dev/run_checks.py "${args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print strict report
        if: always()
        run: |
          if test -f apps/learnit-next/.agent-result/run_checks.json; then
            cat apps/learnit-next/.agent-result/run_checks.json
          else
            echo "Strict report was not created." >&2
          fi
      - name: Upload auditable proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnit-next-${{ steps.mode.outputs.mode || 'configuration-failure' }}-proof
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/learnit-next/source_manifest.json
            apps/learnit-next/.agent-result/tree-sha.txt
            apps/learnit-next/.agent-result/run_checks.json
      - name: Enforce strict result
        if: steps.checks.outputs.exit_code != '0'
        run: |
          echo "Strict Learn-it Next ${{ steps.mode.outputs.mode }} checks failed." >&2
          exit 1
