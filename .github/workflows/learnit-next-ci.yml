name: Learn-it Next CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Exact verification topology
        required: true
        type: choice
        options: [integration-head, post-merge]
      verification_ref:
        description: Exact 40-character commit SHA
        required: true
        type: string
      accepted_integration_head:
        description: Exact accepted integration head for post-merge
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: learnit-next-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.verification_ref || github.sha }}
  cancel-in-progress: true

jobs:
  exact-head-matrix:
    name: Learn-it Next exact-head matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve exact target and route
        id: route
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REF: ${{ github.event.pull_request.head.ref }}
          PUSH_SHA: ${{ github.sha }}
          DISPATCH_SHA: ${{ inputs.verification_ref }}
          DISPATCH_MODE: ${{ inputs.verification_mode }}
          DISPATCH_ACCEPTED: ${{ inputs.accepted_integration_head }}
        run: |
          set -euo pipefail
          case "${EVENT}" in
            pull_request)
              target="${PR_SHA}"; mode=integration-head; accepted=""; branch="${PR_REF}"
              case "${branch}" in
                agent/ATLAS-WP-001-support-governance-ci) profile=atlas-support ;;
                agent/ATLAS-WP-001-learning) profile=atlas-learning ;;
                agent/ATLAS-WP-001-experience) profile=atlas-experience ;;
                agent/ATLAS-WP-001-core) profile=atlas-core ;;
                agent/ATLAS-WP-001-content) profile=atlas-content ;;
                agent/ATLAS-WP-001-qa) profile=atlas-qa ;;
                agent/PROG-WP-001-wave-a-learning|agent/PROG-WP-001-wave-a-ux|agent/PROG-WP-001-wave-a-authoring|agent/PROG-WP-001-wave-a-platform|agent/PROG-WP-001-wave-a-qa|agent/PROG-WP-001-wave-a-int) profile=wave-a ;;
                *) echo "Unrecognized pull-request branch: ${branch}" >&2; exit 2 ;;
              esac
              ;;
            push)
              target="${PUSH_SHA}"; mode=post-merge; accepted=""; branch=main; profile=post-merge-auto ;;
            workflow_dispatch)
              target="${DISPATCH_SHA}"; mode="${DISPATCH_MODE}"; accepted="${DISPATCH_ACCEPTED}"; branch=""; profile=wave-a ;;
            *) echo "Unsupported event: ${EVENT}" >&2; exit 2 ;;
          esac
          [[ "${target}" =~ ^[0-9a-f]{40}$ ]] || { echo "Target must be an exact lowercase SHA." >&2; exit 2; }
          for pair in target mode accepted branch profile; do echo "${pair}=${!pair}" >> "${GITHUB_OUTPUT}"; done

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.route.outputs.target }}
          fetch-depth: 0

      - name: Resolve post-merge route
        id: resolved
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INITIAL_PROFILE: ${{ steps.route.outputs.profile }}
          INITIAL_BRANCH: ${{ steps.route.outputs.branch }}
          INITIAL_ACCEPTED: ${{ steps.route.outputs.accepted }}
        run: |
          set -euo pipefail
          profile="${INITIAL_PROFILE}"; branch="${INITIAL_BRANCH}"; accepted="${INITIAL_ACCEPTED}"
          if [[ "${EVENT}" == push ]]; then
            parents=( $(git show -s --format=%P HEAD) ); [[ ${#parents[@]} -eq 2 ]] || exit 2
            mapfile -t actual < <(git diff --name-only "${parents[0]}" HEAD | sort)
            expected=(.github/workflows/learnit-next-ci.yml apps/learnit-next/dev/run_checks.py governance/governor-state.json)
            if [[ "$(printf '%s\n' "${actual[@]}")" == "$(printf '%s\n' "${expected[@]}" | sort)" ]]; then
              profile=atlas-support; branch=agent/ATLAS-WP-001-support-governance-ci
            else
              profile=wave-a; branch=main; accepted="${parents[1]}"
            fi
          fi
          echo "profile=${profile}" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "accepted=${accepted}" >> "${GITHUB_OUTPUT}"

      - name: Fetch exact authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin main:refs/remotes/origin/main
          git fetch --force --no-tags origin 58e39e8917006058fdf177a5daa37535f5e2c78d
          if [[ "${{ steps.resolved.outputs.profile }}" == wave-a ]]; then
            for sha in 8ebafee48cc5277b92776982639a0146ae7e76d0 ae999472418a18a1181b43a07259a4395afbcf7f 48df0517d74e8c343223f14361607c4a93e7f55b 6c4111715a55fdff07a3e466d013dcdcc7aa5c78 f260093914542f93ff9145cbac8e98aae415fe01 f25da6356528824e84224718013a3bccb2707c49; do
              git fetch --force --no-tags origin "${sha}"
            done
          fi
          [[ "$(git rev-parse HEAD)" == "${{ steps.route.outputs.target }}" ]]

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.25.1 playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Select support runner
        id: runner
        shell: bash
        run: |
          set -euo pipefail
          runner="${GITHUB_WORKSPACE}/apps/learnit-next/dev/run_checks.py"
          if [[ "${{ steps.resolved.outputs.profile }}" != atlas-support && "$(git show origin/main:apps/learnit-next/dev/run_checks.py | grep -c 'learnit.next.ci.checks.atlas-m1.v1')" -gt 0 ]]; then
            runner="${RUNNER_TEMP}/learnit-next-run-checks.py"
            git show origin/main:apps/learnit-next/dev/run_checks.py > "${runner}"
          fi
          echo "path=${runner}" >> "${GITHUB_OUTPUT}"

      - name: Run routed checks
        shell: bash
        run: |
          set -euo pipefail
          profile="${{ steps.resolved.outputs.profile }}"
          if [[ "${profile}" == wave-a ]]; then
            args=(--strict --profile wave-a-ci --mode "${{ steps.route.outputs.mode }}" --base-ref 8ebafee48cc5277b92776982639a0146ae7e76d0)
            [[ -z "${{ steps.resolved.outputs.accepted }}" ]] || args+=(--accepted-integration-head "${{ steps.resolved.outputs.accepted }}")
          else
            args=(--strict --profile "${profile}" --base-ref 58e39e8917006058fdf177a5daa37535f5e2c78d --branch-ref "${{ steps.resolved.outputs.branch }}")
          fi
          LEARNIT_REPO_ROOT="${GITHUB_WORKSPACE}" python "${{ steps.runner.outputs.path }}" "${args[@]}"

      - name: Upload exact proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnit-next-${{ steps.resolved.outputs.profile }}-${{ steps.route.outputs.target }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: |
            apps/learnit-next/.agent-result/run_checks.json
            apps/learnit-next/.agent-result/profile-authoring.json
            apps/learnit-next/.agent-result/profile-contract.json
            apps/learnit-next/.agent-result/profile-full.json
            apps/learnit-next/.agent-result/profile-browser.json
            apps/learnit-next/.agent-result/qa-exact.log
            apps/learnit-next/dist/learnit-next.html
