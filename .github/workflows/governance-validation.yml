name: Repository governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate repository governance
        run: python tools/validate_repository.py

  repository-governance-context:
    name: Repository governance
    needs: validate-repository
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mirror authoritative validation result
        env:
          UPSTREAM_RESULT: ${{ needs.validate-repository.result }}
        run: test "${UPSTREAM_RESULT}" = "success"
