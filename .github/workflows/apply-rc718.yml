name: Apply and validate RC718

on:
  push:
    branches:
      - feature/rc718-editable-plan-name
    paths:
      - '.automation/rc718/**'
      - '.github/workflows/apply-rc718.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'Implement RC718 editable imported plan naming') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/rc718-editable-plan-name
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          cat .automation/rc718/part* | base64 --decode | gzip --decompress > /tmp/rc718.patch
          git apply --check /tmp/rc718.patch
          git apply /tmp/rc718.patch
          rm -rf .automation/rc718
          rm -f .github/workflows/apply-rc718.yml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install player test dependencies
        working-directory: apps/player
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Refresh source manifest and build
        working-directory: apps/player
        run: |
          python dev/update_manifest.py
          python build.py

      - name: Run RC718 naming and persistence gates
        working-directory: apps/player
        run: |
          python tests/contract_library_persistence_naming.py
          python tests/browser_library_persistence_naming.py
          python tests/browser_scale_progress_import.py
          python tests/browser_storage_resilience.py
          python tests/browser_bilan_library_ux.py
          python tests/browser_product_flow.py

      - name: Validate repository governance
        run: python tools/validate_repository.py

      - name: Commit validated RC718 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'learnit-governed-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Implement RC718 editable imported plan naming'
          git push origin HEAD:feature/rc718-editable-plan-name
