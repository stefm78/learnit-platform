name: Atlas M3.4 Qualified Release Set Contradictory QA R2

on:
  push:
    branches:
      - 'qa/QA-WP-024-R2-m3-4-release-set-contradictory'
    paths:
      - 'work-packages/QA-WP-024.json'
      - 'authoring/factory/tests/qa_release_set.py'
      - '.github/workflows/atlas-m3-4-release-set-qa.yml'
  pull_request:
    branches:
      - 'atlas/ATLAS-WP-021-m3-4-qualified-release-set'
    paths:
      - 'work-packages/QA-WP-024.json'
      - 'authoring/factory/tests/qa_release_set.py'
      - '.github/workflows/atlas-m3-4-release-set-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-m3-4-release-set-qa-r2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contradictory-qa:
    name: QA-WP-024 R2 exact-head contradictory oracle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_EXPECTED_PRODUCT_HEAD: 870d69800dcb07fcfff9f1d232dd143c8eaa6486
      QA_PRODUCT_BRANCH: atlas/ATLAS-WP-021-m3-4-qualified-release-set
      QA_PASS_VERDICT: PASS_QA_WP_024_R2_EXACT_HEAD_CONTRADICTORY_QA
      QA_HOLD_VERDICT: HOLD_QA_WP_024_R2_EXACT_HEAD_CONTRADICTORY_QA
    steps:
      - name: Check out QA R2 head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt

      - name: Bind fresh QA R2 to exact frozen product HEAD and disjoint scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "${QA_PRODUCT_BRANCH}"
          actual_product_head="$(git rev-parse "origin/${QA_PRODUCT_BRANCH}")"
          [[ "${actual_product_head}" == "${QA_EXPECTED_PRODUCT_HEAD}" ]] || {
            echo "Frozen product branch moved: expected ${QA_EXPECTED_PRODUCT_HEAD}, got ${actual_product_head}" >&2
            echo "${QA_HOLD_VERDICT}" >&2
            exit 2
          }

          merge_base="$(git merge-base "${QA_EXPECTED_PRODUCT_HEAD}" HEAD)"
          [[ "${merge_base}" == "${QA_EXPECTED_PRODUCT_HEAD}" ]] || {
            echo "QA R2 is not based on the exact frozen product HEAD." >&2
            echo "${QA_HOLD_VERDICT}" >&2
            exit 2
          }

          first_qa_commit="$(git rev-list --reverse "${QA_EXPECTED_PRODUCT_HEAD}..HEAD" | head -n 1)"
          [[ -n "${first_qa_commit}" ]] || {
            echo "No QA R2 commit found above frozen product HEAD." >&2
            echo "${QA_HOLD_VERDICT}" >&2
            exit 2
          }
          first_parent="$(git rev-parse "${first_qa_commit}^")"
          [[ "${first_parent}" == "${QA_EXPECTED_PRODUCT_HEAD}" ]] || {
            echo "Fresh-branch direct-parent guard failed: expected ${QA_EXPECTED_PRODUCT_HEAD}, got ${first_parent}" >&2
            echo "${QA_HOLD_VERDICT}" >&2
            exit 2
          }

          actual="$(git diff --name-only "${QA_EXPECTED_PRODUCT_HEAD}" HEAD | sort)"
          expected="$(printf '%s\n'             '.github/workflows/atlas-m3-4-release-set-qa.yml'             'authoring/factory/tests/qa_release_set.py'             'work-packages/QA-WP-024.json' | sort)"
          [[ "${actual}" == "${expected}" ]] || {
            echo "QA-WP-024 R2 exact path set mismatch." >&2
            diff -u <(printf '%s\n' "${expected}") <(printf '%s\n' "${actual}") || true
            echo "${QA_HOLD_VERDICT}" >&2
            exit 2
          }

          for path in             work-packages/ATLAS-WP-021.json             authoring/factory/release_set.py             authoring/factory/README.md             authoring/factory/tests/test_release_set.py             .github/workflows/atlas-m3-4-release-set-ci.yml; do
            git diff --quiet "${QA_EXPECTED_PRODUCT_HEAD}" HEAD -- "${path}" || {
              echo "QA modified frozen product path: ${path}" >&2
              echo "${QA_HOLD_VERDICT}" >&2
              exit 2
            }
          done

      - name: Confirm frozen product regression oracle remains green
        shell: bash
        run: |
          set +e
          python -B authoring/factory/tests/test_release_set.py
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            echo "${QA_HOLD_VERDICT}" >&2
            exit $rc
          fi

      - name: Run fresh independent contradictory QA R2 oracle
        shell: bash
        run: |
          set +e
          python -B authoring/factory/tests/qa_release_set.py
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            echo "${QA_HOLD_VERDICT}" >&2
            exit $rc
          fi
          echo "${QA_PASS_VERDICT}"
