name: Atlas M3.4 Qualified Release Set QA

on:
  pull_request:
    paths:
      - 'work-packages/QA-WP-024.json'
      - 'authoring/factory/tests/qa_release_set.py'
      - '.github/workflows/atlas-m3-4-release-set-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contradictory-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind exact frozen product head
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "41f2245e56b42a2e541d185f39a3edb5d8b6f01b" || {
            echo "QA branch is not based directly on frozen product HEAD" >&2
            exit 2
          }
      - name: Run independent contradictory QA
        run: python authoring/factory/tests/qa_release_set.py
