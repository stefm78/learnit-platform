name: CI-WP-015 one-shot router patcher

on:
  push:
    branches:
      - ci/CI-WP-015-atlas-ux-post-merge-route

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/CI-WP-015-atlas-ux-post-merge-route
          fetch-depth: 0
      - name: Apply exact router patch
        run: python .ci-wp-015-patch.py
      - name: Commit final two-file CI correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/learnit-next-ci.yml
          git rm .ci-wp-015-patch.py .github/workflows/ci-wp-015-patcher.yml
          git diff --cached --check
          git commit -m 'ci: route accepted Atlas UX merge post-merge'
          git push origin HEAD:ci/CI-WP-015-atlas-ux-post-merge-route
