name: Build standalone download

on:
  workflow_dispatch:
  push:
    branches:
      - release/rc715-download-artifact
  pull_request:
    paths:
      - 'apps/player/**'
      - '.github/workflows/build-standalone-download.yml'

permissions:
  contents: read

jobs:
  build-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build promoted RC715 standalone application
        working-directory: apps/player
        run: python build.py

      - name: Verify promoted artifact identity
        working-directory: apps/player
        shell: bash
        run: |
          set -euo pipefail
          expected='6d4546efbf9a1216e18fa90ee260e7d79841171c48f533d6b107266e281aa7c0'
          actual="$(sha256sum dist/learnit.html | awk '{print $1}')"
          test "$actual" = "$expected"
          mkdir -p ../../release-artifact
          cp dist/learnit.html ../../release-artifact/learnit-standalone-rc715.html
          printf '%s  %s\n' "$actual" 'learnit-standalone-rc715.html' > ../../release-artifact/SHA256SUMS.txt

      - name: Upload downloadable application
        uses: actions/upload-artifact@v4
        with:
          name: learnit-standalone-rc715
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
