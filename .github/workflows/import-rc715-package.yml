name: Import RC715 package

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.import/*.zip'
      - '.github/workflows/import-rc715-package.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: import-rc715-development-baseline
  cancel-in-progress: false

jobs:
  import-source:
    if: github.head_ref == 'import/rc715-development-baseline' || github.ref_name == 'import/rc715-development-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out controlled import branch
        uses: actions/checkout@v7
        with:
          ref: import/rc715-development-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify package and safely extract exact source
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import json
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          import_dir = root / '.import'
          destination = root / 'apps' / 'player'
          evidence_dir = root / 'docs' / 'evidence' / 'rc715'

          expected_outer_sha = 'f5e1bd5b17a9e16a6e14962d6db18632abb954bf71a68935c9186e8b1c190033'
          expected_source_sha = 'c6854bee987cfea2c2e7673fa0611d58e2f1db15fdb0c19e202806afee140eb4'
          expected_artifact_sha = '6d4546efbf9a1216e18fa90ee260e7d79841171c48f533d6b107266e281aa7c0'
          expected_source_root = 'learnit_rc715_source'
          expected_regular_files = 145

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          candidates = sorted(import_dir.glob('*.zip'))
          matches = [p for p in candidates if sha256(p.read_bytes()) == expected_outer_sha]
          if len(matches) != 1:
              found = {p.name: sha256(p.read_bytes()) for p in candidates}
              raise SystemExit(f'Expected one exact RC715 package; found {found}')

          outer_path = matches[0]
          outer_raw = outer_path.read_bytes()
          nested_raw = None
          nested_name = None

          with zipfile.ZipFile(io.BytesIO(outer_raw)) as outer:
              seen = set()
              for info in outer.infolist():
                  name = info.filename.replace('\\', '/')
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe outer path: {name}')
                  if name in seen:
                      raise SystemExit(f'Duplicate outer path: {name}')
                  seen.add(name)
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f'Symlink rejected: {name}')
                  if info.is_dir() or not name.lower().endswith('.zip'):
                      continue
                  raw = outer.read(info)
                  if sha256(raw) == expected_source_sha:
                      if nested_raw is not None:
                          raise SystemExit('Multiple nested source archives match')
                      nested_raw = raw
                      nested_name = name

          if nested_raw is None:
              raise SystemExit('Expected nested RC715 source archive not found')

          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir(parents=True, exist_ok=True)

          extracted = []
          excluded = []
          seen = set()
          with zipfile.ZipFile(io.BytesIO(nested_raw)) as source:
              infos = source.infolist()
              regular_count = sum(1 for info in infos if not info.is_dir())
              if regular_count != expected_regular_files:
                  raise SystemExit(
                      f'Unexpected source file count: expected {expected_regular_files}, got {regular_count}'
                  )

              for info in infos:
                  name = info.filename.replace('\\', '/')
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe source path: {name}')
                  if not path.parts or path.parts[0] != expected_source_root:
                      raise SystemExit(f'Unexpected source root: {name}')
                  normalized = path.as_posix()
                  if normalized in seen:
                      raise SystemExit(f'Duplicate source path: {normalized}')
                  seen.add(normalized)
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f'Symlink rejected: {name}')
                  if info.is_dir():
                      continue

                  relative_parts = path.parts[1:]
                  relative = PurePosixPath(*relative_parts).as_posix()
                  if relative.startswith(('dist/', 'release/', 'reports/')) or '__pycache__/' in relative or relative.endswith('.pyc'):
                      excluded.append(relative)
                      continue

                  target = destination.joinpath(*relative_parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with source.open(info) as src, target.open('wb') as dst:
                      shutil.copyfileobj(src, dst)
                  extracted.append(target.relative_to(root).as_posix())

          evidence_dir.mkdir(parents=True, exist_ok=True)
          evidence = {
              'schemaVersion': 1,
              'workPackage': 'SRC-WP-001',
              'candidate': 'RC715 durable library and rename candidate',
              'classification': 'development baseline; human stable promotion pending',
              'outerPackageFile': outer_path.name,
              'outerPackageSha256': expected_outer_sha,
              'nestedSourceArchive': nested_name,
              'sourceArchiveSha256': expected_source_sha,
              'sourceArchiveRoot': expected_source_root,
              'sourceArchiveRegularFileCount': regular_count,
              'committedSourceFileCount': len(extracted),
              'excludedGeneratedFiles': sorted(excluded),
              'expectedArtifactSha256': expected_artifact_sha,
              'safeExtraction': True,
              'pathTraversalRejected': True,
              'duplicatePathsRejected': True,
              'symlinksRejected': True,
              'artifactIdentityVerified': False,
              'mandatoryChecksPassed': False,
              'humanPromotion': 'pending',
              'extractedFiles': sorted(extracted),
          }
          (evidence_dir / 'import-reconstruction.json').write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'outerPackage': outer_path.name,
              'nestedSourceArchive': nested_name,
              'sourceRegularFiles': regular_count,
              'committedSourceFiles': len(extracted),
          }, indent=2))
          PY

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r apps/player/requirements-test.txt

      - name: Rebuild exact RC715 artifact
        working-directory: apps/player
        run: python build.py

      - name: Verify rebuilt artifact identity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected = '6d4546efbf9a1216e18fa90ee260e7d79841171c48f533d6b107266e281aa7c0'
          artifact = Path('apps/player/dist/learnit.html')
          actual = hashlib.sha256(artifact.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Artifact SHA mismatch: expected {expected}, got {actual}')

          path = Path('docs/evidence/rc715/import-reconstruction.json')
          evidence = json.loads(path.read_text(encoding='utf-8'))
          evidence['rebuiltArtifactSha256'] = actual
          evidence['artifactIdentityVerified'] = True
          path.write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'RC715 artifact identity verified: {actual}')
          PY

      - name: Run mandatory non-browser checks
        working-directory: apps/player
        run: python dev/run_all_checks.py --skip-build

      - name: Mark checks as passed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/evidence/rc715/import-reconstruction.json')
          evidence = json.loads(path.read_text(encoding='utf-8'))
          evidence['mandatoryChecksPassed'] = True
          path.write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Remove generated and transfer-only material
        shell: bash
        run: |
          rm -rf apps/player/dist apps/player/release apps/player/reports
          find apps/player -type d -name '__pycache__' -prune -exec rm -rf {} +
          find apps/player -type f -name '*.pyc' -delete
          rm -rf .import
          rm -f .github/workflows/import-rc715-source.yml
          rm -f .github/workflows/import-rc715-package.yml
          rm -f .github/workflows/repair-rc715-import.yml

      - name: Update work package and governor state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          wp_path = Path('work-packages/SRC-WP-001.json')
          wp = json.loads(wp_path.read_text(encoding='utf-8'))
          wp['status'] = 'under-qa'
          wp['result'] = {
              'artifactSha256': '6d4546efbf9a1216e18fa90ee260e7d79841171c48f533d6b107266e281aa7c0',
              'artifactIdentityVerified': True,
              'mandatoryChecksPassed': True,
              'humanPromotion': 'pending',
              'decision': 'GO_WITH_CONDITIONS',
          }
          wp_path.write_text(json.dumps(wp, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          state_path = Path('governance/governor-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['stateId'] = 'GOV-STATE-2026-07-13-003'
          state['currentPhase'] = {
              'id': 'standalone-stabilization-on-github',
              'status': 'active',
              'description': 'RC715 is imported as the active development baseline. Standalone stabilization continues from GitHub; stable human promotion remains pending.',
          }
          state['authorizedWork'] = [
              'standalone functional, UX, accessibility, persistence, performance, test, and release stabilization in this repository',
              'repository governance hardening',
              'architecture reference hardening',
              'black-box test and evidence improvement',
              'read-only source cartography',
              'work-package and provenance tooling',
          ]
          state['activeExceptions'] = [
              item for item in state.get('activeExceptions', [])
              if item.get('id') != 'EXC-SRC-IMPORT-001'
          ]
          state['nextMandatoryGate'] = {
              'id': 'ARC-WP-000',
              'condition': 'A precise GitHub commit passes the complete human standalone promotion gate and is selected as the stable forensic baseline.',
          }
          state['review'] = {
              'lastReviewedAt': '2026-07-13',
              'lastReviewedBy': 'Architecture & Repository Governor — SRC-WP-001 import verification',
              'decision': 'GO_WITH_CONDITIONS',
              'nextReviewTrigger': 'standalone promotion candidate, architecture-sensitive PR, serious regression, or release provenance change',
          }
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Validate repository governance
        run: python tools/validate_repository.py

      - name: Commit exact source and reconstruction evidence
        shell: bash
        run: |
          git config user.name 'learnit-import-bot'
          git config user.email 'learnit-import-bot@users.noreply.github.com'
          git add -A
          git commit -m 'source: import exact RC715 development baseline'
          SOURCE_COMMIT="$(git rev-parse HEAD)"

          python - "$SOURCE_COMMIT" <<'PY'
          import json
          import sys
          from pathlib import Path

          source_commit = sys.argv[1]

          evidence_path = Path('docs/evidence/rc715/import-reconstruction.json')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          evidence['sourceImportCommit'] = source_commit
          evidence_path.write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          wp_path = Path('work-packages/SRC-WP-001.json')
          wp = json.loads(wp_path.read_text(encoding='utf-8'))
          wp['status'] = 'accepted'
          wp['result']['sourceImportCommit'] = source_commit
          wp_path.write_text(json.dumps(wp, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          state_path = Path('governance/governor-state.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['reviewedBaselineCommit'] = source_commit
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          python tools/validate_repository.py
          git add docs/evidence/rc715/import-reconstruction.json work-packages/SRC-WP-001.json governance/governor-state.json
          git commit -m 'governance: accept RC715 development baseline import'
          git push origin HEAD:import/rc715-development-baseline
