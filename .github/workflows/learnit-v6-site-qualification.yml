name: LearnIT V6 integrated site qualification (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/learnit_v6_site/**'
      - 'apps/learnit-next/src/**'
      - 'apps/learnit-next/tests/**'
      - 'apps/learnit-next/source_manifest.json'
      - 'apps/learnit-next/build.py'
      - 'authoring/studio/pages/**'
      - '.github/workflows/learnit-v6-site-qualification.yml'
      - 'work-packages/OPS-WP-026.json'
permissions:
  contents: read
jobs:
  local_candidate_qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable browser test dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Rebuild byte-exact site twice from pinned immutable Git refs
        run: |
          set -euo pipefail
          python -B tools/learnit_v6_site/assemble.py --repo . --output "$RUNNER_TEMP/site-a" --manifest "$RUNNER_TEMP/site-a.json"
          python -B tools/learnit_v6_site/assemble.py --repo . --output "$RUNNER_TEMP/site-b" --manifest "$RUNNER_TEMP/site-b.json"
          cmp "$RUNNER_TEMP/site-a.json" "$RUNNER_TEMP/site-b.json"
      - name: Verify exact site and no missing declared static links
        run: |
          set -euo pipefail
          python -B tools/learnit_v6_site/test_site.py --site "$RUNNER_TEMP/site-a" --manifest "$RUNNER_TEMP/site-a.json"
      - name: Native V6 eight-activity browser consumption and invalid-data rejection
        env:
          LEARNIT_V6_ARTIFACT: ${{ runner.temp }}/site-a/index.html
        run: python -B apps/learnit-next/tests/passage_v6_consumption.py
      - name: Chromium integration - migration, blocked IDB, recovery and basic a11y
        run: |
          set -euo pipefail
          python -B tools/learnit_v6_site/test_browser_integration.py \
            --repo . --site "$RUNNER_TEMP/site-a" --manifest "$RUNNER_TEMP/site-a.json"
