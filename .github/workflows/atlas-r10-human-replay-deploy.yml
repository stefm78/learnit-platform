name: Atlas R11 human replay deploy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/atlas-r10-human-replay-deploy.yml'
      - 'work-packages/OPS-WP-018.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/atlas-r10-human-replay-deploy.yml'
      - 'work-packages/OPS-WP-018.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-human-replay
  cancel-in-progress: false

env:
  PRODUCT_HEAD: 934e1c7193fc6d20d408339f8a962bca6aea51a6
  PRODUCT_EXPECTED_SHA256: 4f620a570fabb669165791f36db1977b744ac82c9eb5c95654c6c402deb4b173
  PRODUCT_EXPECTED_BYTES: '407356'
  PREVIOUS_HEAD: 10fbe658175f634648baf86f7bf10320b88a3127
  PREVIOUS_SHA256: c4abc922e1d80793263557f12a3f4c2f9a7203e19a26240c914c2ab39ba97e89
  PREVIOUS_BYTES: '405648'
  STABLE_LEARNER_HEAD: 4eebdef9fb0014c2e4a965e0c1e78d127dd712f4
  STABLE_LEARNER_SHA256: 4b50af3dfe8820d258eaa73999b8a7e52b4991584d27986dca7e647af608f6d7
  STABLE_LEARNER_BYTES: '366412'
  STABLE_M3_1_MAIN: be3d5b2635836e8ce0d9a6ecf42d573efc9ef749
  FROZEN_PRODUCT_HEAD: 6fa1acc23999b5a0b9a0b7f375a12f19ecc4e4e2
  FROZEN_QA_HEAD: 6ff592af68e6cc95bd479911a09388293c5528f5

jobs:
  verify:
    name: Verify exact R11 replay and preserve stable Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      site_artifact: ${{ steps.names.outputs.site_artifact }}
    steps:
      - name: Checkout exact stable M3.1 Pages source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STABLE_M3_1_MAIN }}
          fetch-depth: 0
          clean: true

      - name: Materialize exact stable learner and replay products
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "$STABLE_LEARNER_HEAD" "$PRODUCT_HEAD" "$PREVIOUS_HEAD"
          stable="$RUNNER_TEMP/stable-learner"
          current="$RUNNER_TEMP/current-product"
          previous="$RUNNER_TEMP/previous-product"
          git worktree add --detach "$stable" "$STABLE_LEARNER_HEAD"
          git worktree add --detach "$current" "$PRODUCT_HEAD"
          git worktree add --detach "$previous" "$PREVIOUS_HEAD"
          [[ "$(git -C "$stable" rev-parse HEAD)" == "$STABLE_LEARNER_HEAD" ]]
          [[ "$(git -C "$current" rev-parse HEAD)" == "$PRODUCT_HEAD" ]]
          [[ "$(git -C "$previous" rev-parse HEAD)" == "$PREVIOUS_HEAD" ]]
          echo "STABLE_TREE=$stable" >> "$GITHUB_ENV"
          echo "CURRENT_TREE=$current" >> "$GITHUB_ENV"
          echo "PREVIOUS_TREE=$previous" >> "$GITHUB_ENV"

      - name: Assemble stable site plus immutable R10 and R11 replays
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          authoring_a="$RUNNER_TEMP/authoring-a"
          authoring_b="$RUNNER_TEMP/authoring-b"
          mkdir -p "$site"

          python -B authoring/studio/pages/build_pages.py --output "$authoring_a"
          python -B authoring/studio/pages/build_pages.py --output "$authoring_b"
          diff -qr "$authoring_a" "$authoring_b"
          cp -a "$authoring_a" "$site/authoring"

          python -B "$STABLE_TREE/apps/learnit-next/build.py" --output "$site/index.html"
          cp "$site/index.html" "$site/learnit-next.html"
          [[ "$(sha256sum "$site/index.html" | awk '{print $1}')" == "$STABLE_LEARNER_SHA256" ]]
          [[ "$(wc -c < "$site/index.html" | tr -d ' ')" == "$STABLE_LEARNER_BYTES" ]]

          quality_sha="$(sha256sum authoring/v2/atlas/pedagogical_quality.py | awk '{print $1}')"
          authoring_sha="$(sha256sum "$site/authoring/index.html" | awk '{print $1}')"
          cat > "$site/deployment-evidence.json" <<EOF
          {"schema":"learnit.next.pages.deployment.v3","learnerPromotedHead":"$STABLE_LEARNER_HEAD","learnerArtifactBytes":$STABLE_LEARNER_BYTES,"learnerArtifactSha256":"$STABLE_LEARNER_SHA256","m3_1PromotedMain":"$STABLE_M3_1_MAIN","frozenProductHead":"$FROZEN_PRODUCT_HEAD","frozenQaHead":"$FROZEN_QA_HEAD","qualityEngineSha256":"$quality_sha","authoringIndexSha256":"$authoring_sha","authoringPath":"/authoring/","learnerIndexByteIdentity":"PASS","stableAuthoringPublication":true,"humanUxDebtIssue":272,"runtimeBackendDependencyAdded":false}
          EOF

          build_replay() {
            local tree="$1" head="$2" expected_sha="$3" expected_bytes="$4"
            local dir="$site/human-replay/$head" a="$RUNNER_TEMP/$head-a.html" b="$RUNNER_TEMP/$head-b.html"
            mkdir -p "$dir/fixtures"
            python -B "$tree/apps/learnit-next/build.py" --output "$a"
            python -B "$tree/apps/learnit-next/build.py" --output "$b"
            cmp "$a" "$b"
            [[ "$(sha256sum "$a" | awk '{print $1}')" == "$expected_sha" ]]
            [[ "$(wc -c < "$a" | tr -d ' ')" == "$expected_bytes" ]]
            cp "$a" "$dir/index.html"
            cp "$a" "$dir/learnit-next.html"
            cp "$tree/authoring/v2/golden/signaux_electriques.json" "$dir/fixtures/signaux_electriques.json"
            local fixture_sha
            fixture_sha="$(sha256sum "$dir/fixtures/signaux_electriques.json" | awk '{print $1}')"
            cat > "$dir/identity.json" <<EOF
          {"schema":"learnit.atlas.human-replay.v1","issue":352,"pullRequest":354,"productHead":"$head","learnerArtifactBytes":$expected_bytes,"learnerArtifactSha256":"$expected_sha","fixture":"fixtures/signaux_electriques.json","fixtureSha256":"$fixture_sha","promotion":false,"humanGateRequired":true,"learnerUxPass":false}
          EOF
          }

          build_replay "$PREVIOUS_TREE" "$PREVIOUS_HEAD" "$PREVIOUS_SHA256" "$PREVIOUS_BYTES"
          build_replay "$CURRENT_TREE" "$PRODUCT_HEAD" "$PRODUCT_EXPECTED_SHA256" "$PRODUCT_EXPECTED_BYTES"

          grep -Fq 'identity.slice(0, 8)' "$site/human-replay/$PRODUCT_HEAD/index.html"
          grep -Fq 'data-learnit-build-identity' "$site/human-replay/$PRODUCT_HEAD/index.html"
          echo "SITE=$site" >> "$GITHUB_ENV"

      - name: Name immutable verification artifact
        id: names
        shell: bash
        run: echo "site_artifact=atlas-r11-human-replay-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.site_artifact }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ env.SITE }}

  deploy:
    name: Deploy exact R11 human replay
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}human-replay/${{ env.PRODUCT_HEAD }}/
    steps:
      - name: Download immutable verified site
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.site_artifact }}
          path: ${{ runner.temp }}/site

      - name: Recheck downloaded identities
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          [[ "$(sha256sum "$site/index.html" | awk '{print $1}')" == "$STABLE_LEARNER_SHA256" ]]
          for row in "$PREVIOUS_HEAD:$PREVIOUS_SHA256:$PREVIOUS_BYTES" "$PRODUCT_HEAD:$PRODUCT_EXPECTED_SHA256:$PRODUCT_EXPECTED_BYTES"; do
            IFS=: read -r head expected_sha expected_bytes <<< "$row"
            replay="$site/human-replay/$head/index.html"
            [[ "$(sha256sum "$replay" | awk '{print $1}')" == "$expected_sha" ]]
            [[ "$(wc -c < "$replay" | tr -d ' ')" == "$expected_bytes" ]]
            grep -q "\"productHead\":\"$head\"" "$site/human-replay/$head/identity.json"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Live post-deploy identity smoke
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          current_url="${PAGE_URL}human-replay/${PRODUCT_HEAD}/"
          previous_url="${PAGE_URL}human-replay/${PREVIOUS_HEAD}/"
          ok=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$PAGE_URL" -o "$RUNNER_TEMP/root.html" \
              && curl --fail --silent --show-error "$current_url" -o "$RUNNER_TEMP/current.html" \
              && curl --fail --silent --show-error "$previous_url" -o "$RUNNER_TEMP/previous.html" \
              && curl --fail --silent --show-error "${current_url}identity.json" -o "$RUNNER_TEMP/identity.json" \
              && curl --fail --silent --show-error "${current_url}fixtures/signaux_electriques.json" -o "$RUNNER_TEMP/fixture.json"; then
              fixture_expected="$(python - "$RUNNER_TEMP/identity.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert data['productHead']=='934e1c7193fc6d20d408339f8a962bca6aea51a6'
          assert data['learnerArtifactSha256']=='4f620a570fabb669165791f36db1977b744ac82c9eb5c95654c6c402deb4b173'
          assert data['promotion'] is False
          assert data['humanGateRequired'] is True
          assert data['learnerUxPass'] is False
          print(data['fixtureSha256'])
          PY
          )"
              if [[ "$(sha256sum "$RUNNER_TEMP/root.html" | awk '{print $1}')" == "$STABLE_LEARNER_SHA256" \
                && "$(sha256sum "$RUNNER_TEMP/current.html" | awk '{print $1}')" == "$PRODUCT_EXPECTED_SHA256" \
                && "$(sha256sum "$RUNNER_TEMP/previous.html" | awk '{print $1}')" == "$PREVIOUS_SHA256" \
                && "$(sha256sum "$RUNNER_TEMP/fixture.json" | awk '{print $1}')" == "$fixture_expected" ]]; then
                ok=1; break
              fi
            fi
            sleep 3
          done
          [[ "$ok" == 1 ]]
          echo "R11_REPLAY_URL=$current_url" >> "$GITHUB_STEP_SUMMARY"
          echo "R11_IDENTITY_URL=${current_url}identity.json" >> "$GITHUB_STEP_SUMMARY"
          echo "R11_FIXTURE_URL=${current_url}fixtures/signaux_electriques.json" >> "$GITHUB_STEP_SUMMARY"
