name: PASSAGE V6 Consumption Closure R2

on:
  push:
    branches: [passage/v6-consumption-closure-r2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passage-v6-consumption-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true

      - name: Bind R2 authority and scope
        shell: bash
        run: |
          set -euo pipefail
          BASE=10f058c4693fb72439a13feb3abfd45db43f9b42
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "$(git merge-base "$BASE" HEAD)" == "$BASE" ]]
          python - <<'PY'
          import subprocess
          base='10f058c4693fb72439a13feb3abfd45db43f9b42'
          changed=set(subprocess.check_output(['git','diff','--name-only',base+'...HEAD'],text=True).splitlines())
          allowed={
            '.github/workflows/passage-v6-consumption-ci.yml',
            'apps/learnit-next/source_manifest.json',
            'apps/learnit-next/src/core/activity_semantics.js',
            'apps/learnit-next/src/integration/atlas/activity_projection.js',
            'apps/learnit-next/src/integration/atlas/import_adapter.js',
            'apps/learnit-next/src/ui/activity_presenters.js',
            'apps/learnit-next/tests/passage_v6_consumption.py',
            'work-packages/PASSAGE-WP-002.json',
          }
          extra=changed-allowed
          assert not extra, f'PASSAGE_WP_002_SCOPE_EXPANSION:{sorted(extra)}'
          required={
            'apps/learnit-next/src/core/activity_semantics.js',
            'apps/learnit-next/src/integration/atlas/activity_projection.js',
            'apps/learnit-next/src/integration/atlas/import_adapter.js',
            'apps/learnit-next/src/ui/activity_presenters.js',
            'apps/learnit-next/tests/passage_v6_consumption.py',
            'work-packages/PASSAGE-WP-002.json',
          }
          assert required<=changed, f'PASSAGE_WP_002_REQUIRED_DELTA_MISSING:{sorted(required-changed)}'
          print('PASSAGE_WP_002_CHANGED='+','.join(sorted(changed)))
          PY

      - name: Prove producer firewall unchanged
        shell: bash
        run: |
          set -euo pipefail
          BASE=10f058c4693fb72439a13feb3abfd45db43f9b42
          git diff --exit-code "$BASE"...HEAD -- contracts/learnit-kit-v6.schema.json authoring/v6 authoring/factory

      - name: Materialize deterministic manifest candidate
        id: rebind
        shell: bash
        run: |
          set -euo pipefail
          cp apps/learnit-next/source_manifest.json "$RUNNER_TEMP/source_manifest.before.json"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('apps/learnit-next/source_manifest.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          targets={
            'apps/learnit-next/src/core/activity_semantics.js',
            'apps/learnit-next/src/integration/atlas/activity_projection.js',
            'apps/learnit-next/src/integration/atlas/import_adapter.js',
            'apps/learnit-next/src/ui/activity_presenters.js',
          }
          def blob(data): return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          seen=set(); self_item=None
          for item in m['workingFiles']:
            path=item['path']
            if path in targets:
              item['fingerprint']={'kind':'git-blob-sha1','value':blob(Path(path).read_bytes())}
              item['owner']='PASSAGE-WP-002'
              item['provenance']='PASSAGE-WP-002 V6 consumer closure R2'
              seen.add(path)
            if path=='apps/learnit-next/source_manifest.json': self_item=item
          assert seen==targets and self_item is not None
          self_item['owner']='PASSAGE-WP-002'
          self_item['provenance']='PASSAGE-WP-002 V6 consumer closure R2 manifest rebind'
          self_item['fingerprint']={'kind':'canonical-self-sha256','value':None}
          canonical=json.dumps(m,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          self_item['fingerprint']['value']=hashlib.sha256(canonical).hexdigest()
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          if cmp -s apps/learnit-next/source_manifest.json "$RUNNER_TEMP/source_manifest.before.json"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          sha256sum apps/learnit-next/source_manifest.json

      - name: Upload manifest candidate
        if: steps.rebind.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: passage-v6-source-manifest-candidate
          path: apps/learnit-next/source_manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Build twice deterministically
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "$RUNNER_TEMP/learnit-a.html"
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "$RUNNER_TEMP/learnit-b.html"
          cmp "$RUNNER_TEMP/learnit-a.html" "$RUNNER_TEMP/learnit-b.html"
          sha256sum "$RUNNER_TEMP/learnit-a.html"

      - name: Replay preserved runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B apps/learnit-next/tests/contract_v2.py
          python -B apps/learnit-next/tests/student_v01_learning_runtime.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_learning.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_platform.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_authoring.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_ui.py

      - name: Prove generic V6 consumer closure in browser
        shell: bash
        env:
          LEARNIT_V6_ARTIFACT: ${{ runner.temp }}/learnit-a.html
        run: python -B apps/learnit-next/tests/passage_v6_consumption.py

      - name: Qualification disposition
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 10f058c4693fb72439a13feb3abfd45db43f9b42...HEAD
          if [[ '${{ steps.rebind.outputs.changed }}' == 'true' ]]; then
            echo HOLD_PASSAGE_V6_CONSUMPTION_MANIFEST_REBIND_REQUIRED
          else
            git diff --exit-code
            echo PASS_PASSAGE_V6_CONSUMPTION_EXACT_HEAD_R2
          fi
