name: Atlas M3 Pages Promotion Rebind

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_PAGES_HEAD: e3db34b2da3fc270451a6f63b6229c16e8e5113e
  FROZEN_AUTHORING_HEAD: a1b9259955ce748cd7e47531a470cd12b7dc0436
  EXPECTED_LEARNER_SHA256: 4b50af3dfe8820d258eaa73999b8a7e52b4991584d27986dca7e647af608f6d7
  EXPECTED_LEARNER_BYTES: '366412'
  PROMOTION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: M3 Pages promotion rebind
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'atlas/ATLAS-WP-010-m3-pages-promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact promotion head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Prove exact packaging delta and frozen identities
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ -n "$PR_BASE" ]]
          [[ "$(git rev-parse HEAD)" == "$PROMOTION_HEAD" ]]
          [[ "$(git merge-base "$PR_BASE" HEAD)" == "$PR_BASE" ]]
          allowed='^(work-packages/ATLAS-WP-010\.json|authoring/studio/pages/README\.md|authoring/studio/pages/build_pages\.py|authoring/studio/pages/pages-bootstrap\.js|authoring/studio/tests/test_m3_pages_packaging\.py|\.github/workflows/atlas-m3-pages-candidate\.yml)$'
          changed="$(git diff --name-only "$PR_BASE"...HEAD)"
          count=0
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            [[ "$path" =~ $allowed ]] || { echo "OUT_OF_SCOPE_PAGES_PROMOTION: $path"; exit 1; }
            count=$((count+1))
          done <<< "$changed"
          [[ "$count" -eq 6 ]]

          git diff --exit-code "$FROZEN_PAGES_HEAD" HEAD --             work-packages/ATLAS-WP-010.json             authoring/studio/pages/README.md             authoring/studio/pages/build_pages.py             authoring/studio/pages/pages-bootstrap.js             authoring/studio/tests/test_m3_pages_packaging.py             .github/workflows/atlas-m3-pages-candidate.yml

          git diff --exit-code "$FROZEN_AUTHORING_HEAD" HEAD --             work-packages/ATLAS-WP-009.json             authoring/studio/README.md             authoring/studio/core.py             authoring/studio/server.py             authoring/studio/web/index.html             authoring/studio/web/studio.css             authoring/studio/web/studio.js             authoring/studio/tests/test_m3_authoring_foundation.py             .github/workflows/atlas-m3-authoring-foundation-ci.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation and browser dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Run Pages packaging browser/product tests
        run: python -B authoring/studio/tests/test_m3_pages_packaging.py

      - name: Re-run M3 authoring foundation tests
        run: python -B authoring/studio/tests/test_m3_authoring_foundation.py

      - name: Run canonical Atlas validators
        shell: bash
        run: |
          set -euo pipefail
          python -B authoring/v2/validate_kit.py             authoring/v2/atlas/nombres_complexes_atlas.json             authoring/v2/atlas/signaux_electriques_atlas.json
          python -B authoring/v2/atlas/validate_atlas_content.py

      - name: Build Pages bundle twice deterministically
        shell: bash
        run: |
          set -euo pipefail
          python -B authoring/studio/pages/build_pages.py --output "$RUNNER_TEMP/pages-a"
          python -B authoring/studio/pages/build_pages.py --output "$RUNNER_TEMP/pages-b"
          diff -qr "$RUNNER_TEMP/pages-a" "$RUNNER_TEMP/pages-b"

      - name: Materialize declared learner projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('apps/learnit-next/source_manifest.json').read_text(encoding='utf-8'))
          for item in manifest['workingFiles']:
              path=Path(item['path'])
              if path.is_file():
                  continue
              fingerprint=item.get('fingerprint',{})
              if fingerprint.get('kind')!='git-blob-sha1':
                  continue
              data=subprocess.run(
                  ['git','cat-file','blob',fingerprint.get('value','')],
                  check=True,stdout=subprocess.PIPE,
              ).stdout
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          PY

      - name: Run promoted learner regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B apps/learnit-next/tests/contract_v2.py
          python -B apps/learnit-next/tests/storage_isolation.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_learning.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_platform.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_authoring.py

      - name: Verify learner artifact identity twice
        shell: bash
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/learnit-a.html"
          b="$RUNNER_TEMP/learnit-b.html"
          python -B apps/learnit-next/build.py --output "$a"
          python -B apps/learnit-next/build.py --output "$b"
          cmp "$a" "$b"
          bytes="$(wc -c < "$a" | tr -d ' ')"
          sha="$(sha256sum "$a" | awk '{print $1}')"
          [[ "$bytes" == "$EXPECTED_LEARNER_BYTES" ]]
          [[ "$sha" == "$EXPECTED_LEARNER_SHA256" ]]

      - name: Write promotion evidence
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-pages-promotion-evidence"
          cat > "$RUNNER_TEMP/m3-pages-promotion-evidence/evidence.json" <<EOF
          {
            "schema": "learnit.atlas.m3.pages.promotion-rebind.v1",
            "baseHead": "$PR_BASE",
            "frozenPagesHead": "$FROZEN_PAGES_HEAD",
            "frozenAuthoringHead": "$FROZEN_AUTHORING_HEAD",
            "promotionHead": "$PROMOTION_HEAD",
            "workflowEventSha": "$GITHUB_SHA",
            "packagingBlobIdentity": "PASS",
            "authoringBlobIdentity": "PASS",
            "pagesAndBrowserTests": "PASS",
            "authoringFoundationTests": "PASS",
            "canonicalValidators": "PASS",
            "pagesDeterminism": "PASS",
            "learnerBytes": $EXPECTED_LEARNER_BYTES,
            "learnerSha256": "$EXPECTED_LEARNER_SHA256",
            "humanGate": "PASS",
            "verdict": "PASS_ATLAS_M3_PAGES_PROMOTION_REBIND"
          }
          EOF

      - name: Upload promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-m3-pages-promotion-rebind-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/m3-pages-promotion-evidence/evidence.json
