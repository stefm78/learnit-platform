name: Atlas Source Admission CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-source-admission-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  source-admission:
    name: Source Admission exact-head evidence
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'atlas/ATLAS-WP-016-source-admission-benchmark-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source-admission head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Bind exact baseline and scope
        shell: bash
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          BASE=524cfc8b35654d7d54d3222a462fe582f4706a89
          SCOPE_BASE="${PR_BASE_SHA:-$BASE}"
          [[ "$(git rev-parse HEAD)" == "$TARGET" ]]
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$SCOPE_BASE^{commit}"
          [[ "$(git merge-base "$BASE" HEAD)" == "$BASE" ]]
          [[ "$(git merge-base "$SCOPE_BASE" HEAD)" == "$SCOPE_BASE" ]]
          export SCOPE_BASE
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          wp=json.loads(Path('work-packages/ATLAS-WP-016.json').read_text(encoding='utf-8'))
          assert wp['id']=='ATLAS-WP-016'
          assert wp['authority']['issue']==299
          assert wp['baseline']['baseCommit']=='524cfc8b35654d7d54d3222a462fe582f4706a89'
          allowed=set(wp['scope']['allowedPaths'])
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',os.environ['SCOPE_BASE']+'...HEAD'], text=True
          ).splitlines())
          assert changed==allowed, f'ATLAS_WP_016_SCOPE_MISMATCH:{sorted(changed)} != {sorted(allowed)}'
          assert len(changed)==6
          print('ATLAS_WP_016_SCOPE=PASS')
          PY

      - name: Prove promoted factory layers untouched
        shell: bash
        run: |
          set -euo pipefail
          BASE=524cfc8b35654d7d54d3222a462fe582f4706a89
          git diff --exit-code "$BASE"...HEAD --             authoring/factory/factory_gate.py             authoring/factory/reliability.py             authoring/factory/benchmark_contract.json             authoring/skills             authoring/v2             contracts             apps             governance
          echo 'PROMOTED_FACTORY_LAYERS_UNCHANGED=PASS'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt

      - name: Validate repository
        run: python -B tools/validate_repository.py

      - name: Re-run promoted M3.2 oracle
        run: python -B authoring/factory/tests/test_ai_kit_factory.py

      - name: Re-run M3.2.5 reliability oracle
        run: python -B authoring/factory/tests/test_factory_reliability.py

      - name: Validate source catalog
        run: |
          python -B authoring/factory/source_admission.py validate-catalog             --catalog authoring/factory/benchmark_sources_v1.json

      - name: Run source-admission oracle
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile             authoring/factory/source_admission.py             authoring/factory/tests/test_source_admission.py
          python -B authoring/factory/tests/test_source_admission.py

      - name: Prove source admission has no network or output-write capability
        shell: bash
        run: |
          set -euo pipefail
          ! grep -REn '\b(requests|httpx|aiohttp)\b|urllib\.request|socket\.|WebSocket|XMLHttpRequest|EventSource'             authoring/factory/source_admission.py
          ! grep -En '\.write_text\(|\.write_bytes\(|(^|[^A-Za-z])open\('             authoring/factory/source_admission.py
          echo 'SOURCE_ADMISSION_LOCAL_READ_ONLY=PASS'

      - name: Diff hygiene
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          SCOPE_BASE="${PR_BASE_SHA:-524cfc8b35654d7d54d3222a462fe582f4706a89}"
          git diff --check "$SCOPE_BASE"...HEAD

      - name: Write exact source-admission evidence
        if: success()
        shell: bash
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          catalog=json.loads(Path('authoring/factory/benchmark_sources_v1.json').read_text(encoding='utf-8'))
          primary=sorted({
              x['domain'] for x in catalog['sources']
              if x['benchmarkRole']=='primary'
          })
          negative=sorted(
              x['sourceId'] for x in catalog['sources']
              if x['benchmarkRole']=='negative-control'
          )
          proof={
            'schema':'learnit.atlas.source-admission.product-evidence.v1',
            'result':'PASS',
            'verdict':'PASS_ATLAS_SOURCE_ADMISSION_PRODUCT_HEAD',
            'workPackage':'ATLAS-WP-016',
            'authorityIssue':299,
            'head':os.environ['TARGET'],
            'baseline':'524cfc8b35654d7d54d3222a462fe582f4706a89',
            'catalogSha256':hashlib.sha256(Path('authoring/factory/benchmark_sources_v1.json').read_bytes()).hexdigest(),
            'gateSha256':hashlib.sha256(Path('authoring/factory/source_admission.py').read_bytes()).hexdigest(),
            'primaryDomains':primary,
            'negativeControls':negative,
            'sourceBytesStoredInGit':False,
            'networkRequired':False,
            'preIngestionFailClosed':True,
          }
          out=Path(os.environ['RUNNER_TEMP'])/'atlas_source_admission.json'
          out.write_text(json.dumps(proof,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY

      - name: Upload exact source-admission evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-source-admission-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/atlas_source_admission.json
