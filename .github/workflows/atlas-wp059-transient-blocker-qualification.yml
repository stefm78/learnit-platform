name: ATLAS WP059 Transient Qualification
on:
  push:
    branches: [student-v01/r2-v5-showcase-port-r1]
permissions:
  contents: read
jobs:
  exact-wp059:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - run: python -m pip install 'jsonschema>=4.18' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -B apps/learnit-next/tests/v5_showcase_port_r1.py
      - run: python -B authoring/v5/tests/test_validate_v5.py -v
      - run: python -B authoring/v4/tests/test_validate_v4.py -v
      - run: PYTHONPATH=. python -B authoring/factory/tests/test_v5_authoring_factory_source_governance.py -v
      - run: python -B apps/learnit-next/tests/v8_selected_presenters_r1.py
      - run: python -B apps/learnit-next/build.py
      - run: python tools/validate_repository.py
