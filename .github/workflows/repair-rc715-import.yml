name: Repair RC715 import gate

on:
  push:
    branches:
      - import/rc715-development-baseline
    paths:
      - '.github/workflows/repair-rc715-import.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out controlled import branch
        uses: actions/checkout@v7
        with:
          ref: import/rc715-development-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Correct independently verified source file count
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/import-rc715-package.yml')
          text = workflow.read_text(encoding='utf-8')
          old = 'expected_regular_files = 144'
          new = 'expected_regular_files = 145'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one occurrence of {old!r}')
          workflow.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Remove one-shot repair workflow and commit correction
        shell: bash
        run: |
          rm -f .github/workflows/repair-rc715-import.yml
          git config user.name 'learnit-import-bot'
          git config user.email 'learnit-import-bot@users.noreply.github.com'
          git add -A
          git commit -m 'ci: correct RC715 verified source file count'
          git push origin HEAD:import/rc715-development-baseline

      - name: Dispatch corrected import workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run import-rc715-package.yml --ref import/rc715-development-baseline
