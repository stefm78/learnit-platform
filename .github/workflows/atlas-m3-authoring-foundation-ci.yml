name: Atlas M3 Authoring Foundation CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-m3-authoring-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  product:
    name: M3.0 authoring foundation evidence
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'atlas/ATLAS-WP-009-m3-authoring-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Bind authority, baseline and exact scope
        shell: bash
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE=c8e6e2a01a9a517f0aa7bdbfc2e01a600d2f30ba
          [[ "$(git rev-parse HEAD)" == "${TARGET}" ]]
          git cat-file -e "${BASE}^{commit}"
          [[ "$(git merge-base "${BASE}" HEAD)" == "${BASE}" ]]
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          wp=json.loads(Path('work-packages/ATLAS-WP-009.json').read_text(encoding='utf-8'))
          assert wp['id']=='ATLAS-WP-009'
          assert wp['authority']['issue']==232
          assert wp['baseline']['baseCommit']=='c8e6e2a01a9a517f0aa7bdbfc2e01a600d2f30ba'
          assert wp['baseline']['acceptedDesignHead']=='f75bbebe580aba56df389a9851b4c55016d0b231'
          assert wp['status']=='in-progress'
          allowed=set(wp['scope']['allowedPaths'])
          changed=set(subprocess.check_output(
              ['git','diff','--name-only','c8e6e2a01a9a517f0aa7bdbfc2e01a600d2f30ba...HEAD'],
              text=True,
          ).splitlines())
          unexpected=changed-allowed
          assert not unexpected, f'OUT_OF_SCOPE:{sorted(unexpected)}'
          assert len(changed)<=wp['execution']['maximumChangedFiles']
          assert 'authoring/studio/tests/qa_m3_authoring_foundation.py' not in changed
          assert '.github/workflows/atlas-m3-authoring-foundation-qa.yml' not in changed
          print('ATLAS_M3_CHANGED_PATHS='+str(len(changed)))
          for path in sorted(changed): print(path)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install declared validation and browser dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run M3.0 product contract and browser tests
        run: python -B authoring/studio/tests/test_m3_authoring_foundation.py

      - name: Re-run frozen canonical validators on both proof kits
        shell: bash
        run: |
          set -euo pipefail
          python -B authoring/v2/validate_kit.py \
            authoring/v2/atlas/nombres_complexes_atlas.json \
            authoring/v2/atlas/signaux_electriques_atlas.json
          python -B authoring/v2/atlas/validate_atlas_content.py

      - name: Materialize exact declared learner projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('apps/learnit-next/source_manifest.json').read_text(encoding='utf-8'))
          materialized=[]
          for item in manifest['workingFiles']:
              path=Path(item['path'])
              if path.is_file():
                  continue
              fingerprint=item.get('fingerprint',{})
              if fingerprint.get('kind')!='git-blob-sha1':
                  continue
              data=subprocess.run(
                  ['git','cat-file','blob',fingerprint.get('value','')],
                  check=True,stdout=subprocess.PIPE,
              ).stdout
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              materialized.append(str(path))
          print('ATLAS_M3_MATERIALIZED='+str(len(materialized)))
          PY

      - name: Run promoted learner regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B apps/learnit-next/tests/contract_v2.py
          python -B apps/learnit-next/tests/storage_isolation.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_learning.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_platform.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_authoring.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_ui.py
          python -B apps/learnit-next/tests/atlas_m1_learning.py
          python -B apps/learnit-next/tests/atlas_m1_core.py
          python -B apps/learnit-next/tests/atlas_m1_experience.py
          python -B apps/learnit-next/tests/atlas_m1_content.py
          python -B apps/learnit-next/tests/atlas_m1_int.py
          python -B apps/learnit-next/tests/atlas_m2_memory.py
          python -B apps/learnit-next/tests/atlas_m2_transfer.py
          python -B apps/learnit-next/tests/atlas_m2_ux_clarity.py

      - name: Rebuild canonical learner artifact twice and verify promoted identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "${RUNNER_TEMP}/learner-a.html"
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "${RUNNER_TEMP}/learner-b.html"
          cmp "${RUNNER_TEMP}/learner-a.html" "${RUNNER_TEMP}/learner-b.html"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'learner-a.html'
          data=path.read_bytes()
          assert len(data)==366412, len(data)
          digest=hashlib.sha256(data).hexdigest()
          assert digest=='4b50af3dfe8820d258eaa73999b8a7e52b4991584d27986dca7e647af608f6d7', digest
          print('CANONICAL_LEARNER_BYTES='+str(len(data)))
          print('CANONICAL_LEARNER_SHA256='+digest)
          PY
          mkdir -p apps/learnit-next/dist
          cp "${RUNNER_TEMP}/learner-a.html" apps/learnit-next/dist/learnit-next.html

      - name: Run strict visible learner import regression
        env:
          LEARNIT_NEXT_STRICT_INTEGRATION: '1'
        run: python -B apps/learnit-next/tests/browser_vertical_slice.py

      - name: Prove local/offline authoring boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -REn 'Access-Control-Allow-Origin|\b(requests|httpx|aiohttp)\b|XMLHttpRequest|WebSocket|EventSource' \
            authoring/studio/core.py authoring/studio/server.py authoring/studio/web
          ! grep -REn 'https?://' authoring/studio/web
          grep -q "learnit.authoring.m3.v1" authoring/studio/core.py
          grep -q "learnit.authoring.m3.v1" authoring/studio/web/studio.js

      - name: Build deterministic authoring source package
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf "${RUNNER_TEMP}/atlas-m3-authoring-source.tar" \
            authoring/studio/README.md \
            authoring/studio/core.py \
            authoring/studio/server.py \
            authoring/studio/web/index.html \
            authoring/studio/web/studio.css \
            authoring/studio/web/studio.js
          sha256sum "${RUNNER_TEMP}/atlas-m3-authoring-source.tar"

      - name: Diff hygiene
        run: git diff --check c8e6e2a01a9a517f0aa7bdbfc2e01a600d2f30ba...HEAD

      - name: Write exact product evidence
        if: success()
        shell: bash
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          source=temp/'atlas-m3-authoring-source.tar'
          source_data=source.read_bytes()
          proof={
            'schema':'learnit.atlas.m3.authoring-foundation.product-evidence.v1',
            'result':'PASS',
            'verdict':'PASS_ATLAS_M3_AUTHORING_FOUNDATION_PRODUCT_HEAD',
            'workPackage':'ATLAS-WP-009',
            'authorityIssue':232,
            'head':os.environ['TARGET'],
            'baseline':'c8e6e2a01a9a517f0aa7bdbfc2e01a600d2f30ba',
            'acceptedDesignHead':'f75bbebe580aba56df389a9851b4c55016d0b231',
            'authoringSourceBytes':len(source_data),
            'authoringSourceSha256':hashlib.sha256(source_data).hexdigest(),
            'canonicalLearnerBytes':366412,
            'canonicalLearnerSha256':'4b50af3dfe8820d258eaa73999b8a7e52b4991584d27986dca7e647af608f6d7',
            'draftNamespace':'learnit.authoring.m3.v1',
            'networkRequired':False,
            'serverScope':'loopback-only',
            'noOpByteIdentity':'PASS',
            'qcmEdit':'PASS',
            'fillEdit':'PASS',
            'canonicalValidation':'PASS',
            'learnerRegression':'PASS',
            'browserIsolation':'PASS',
          }
          out=temp/'atlas_m3_authoring_product.json'
          out.write_text(json.dumps(proof,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY

      - name: Upload exact M3.0 product evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-m3-authoring-product-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/atlas-m3-authoring-source.tar
            ${{ runner.temp }}/atlas_m3_authoring_product.json
