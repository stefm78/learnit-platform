name: Atlas WP-025 Secret Boundary Repair

on:
  push:
    branches:
      - ops/atlas-wp025-secret-boundary-repair
    paths:
      - '.github/workflows/atlas-wp025-secret-boundary-repair.yml'

permissions:
  contents: write

jobs:
  repair-qualify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: learning/atlas-activity-ui-seam-r15
      TARGET_EXPECTED: 48d3d33c401dbfb2ea361365793e1483b5dc187a
    steps:
      - name: Checkout repair helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install declared browser-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Fail closed on target drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          actual="$(git rev-parse "origin/${TARGET_BRANCH}")"
          printf 'TARGET_EXPECTED=%s\nTARGET_ACTUAL=%s\n' "${TARGET_EXPECTED}" "${actual}"
          test "${actual}" = "${TARGET_EXPECTED}"
          git cat-file -e "${TARGET_EXPECTED}^{commit}"

      - name: Materialize exact product head
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_ROOT="${RUNNER_TEMP}/atlas-wp025-product"
          git worktree add --detach "${PRODUCT_ROOT}" "${TARGET_EXPECTED}"
          echo "PRODUCT_ROOT=${PRODUCT_ROOT}" >> "${GITHUB_ENV}"

      - name: Apply learner-safe activity boundary
        shell: bash
        run: |
          set -euo pipefail
          export PRODUCT_ROOT
          python3 experiments/atlas-activity-ui-seam/apply_secret_boundary_repair.py

      - name: Prove boundary causally
        shell: bash
        run: |
          set -euo pipefail
          cd "${PRODUCT_ROOT}"
          python3 apps/learnit-next/tests/atlas_activity_ui_seam.py
          git diff --exit-code "${TARGET_EXPECTED}" -- apps/learnit-next/src/core/session.js
          ! grep -F 'renderAtlasActivityMarkup(activity)' apps/learnit-next/src/integration/atlas/session.js
          ! grep -F 'readAtlasActivityResponse(wrapper, activity)' apps/learnit-next/src/integration/atlas/session.js
          grep -F 'renderAtlasActivityMarkup(presentation)' apps/learnit-next/src/integration/atlas/session.js
          grep -F 'readAtlasActivityResponse(wrapper, presentation)' apps/learnit-next/src/integration/atlas/session.js

      - name: Syntax and deterministic build
        shell: bash
        run: |
          set -euo pipefail
          cd "${PRODUCT_ROOT}"
          node --check apps/learnit-next/src/integration/atlas/session.js
          node --check apps/learnit-next/src/ui/render.js
          python3 apps/learnit-next/build.py
          bytes="$(wc -c < apps/learnit-next/dist/learnit-next.html | tr -d ' ')"
          sha="$(sha256sum apps/learnit-next/dist/learnit-next.html | awk '{print $1}')"
          printf 'REPAIRED_ARTIFACT_BYTES=%s\nREPAIRED_ARTIFACT_SHA256=%s\n' "${bytes}" "${sha}"

      - name: Replay qcm fill and Atlas regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "${PRODUCT_ROOT}"
          for path in \
            apps/learnit-next/tests/dev_learning_loop_v2_platform.py \
            apps/learnit-next/tests/dev_learning_loop_v2_ui.py \
            apps/learnit-next/tests/atlas_m1_core.py \
            apps/learnit-next/tests/atlas_m1_learning.py \
            apps/learnit-next/tests/atlas_m1_experience.py \
            apps/learnit-next/tests/atlas_m1_int.py \
            apps/learnit-next/tests/atlas_m2_ux_clarity.py
          do
            test -f "${path}"
            python3 "${path}"
          done

      - name: Commit exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          cd "${PRODUCT_ROOT}"
          git config user.name "Stef"
          git config user.email "104558808+stefm78@users.noreply.github.com"
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          printf 'REPAIR_CHANGED_PATHS\n'
          printf '%s\n' "${changed[@]}"
          expected=(
            apps/learnit-next/source_manifest.json
            apps/learnit-next/src/integration/atlas/session.js
            apps/learnit-next/tests/atlas_activity_ui_seam.py
            apps/learnit-next/tests/atlas_m1_int.py
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "${path}" >/dev/null
          done
          git add "${expected[@]}"
          git commit -m "fix(atlas): keep scoring secrets behind session boundary"
          echo "REPAIR_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Exact-head proof and publish
        shell: bash
        run: |
          set -euo pipefail
          cd "${PRODUCT_ROOT}"
          test "$(git rev-parse HEAD^)" = "${TARGET_EXPECTED}"
          test -z "$(git status --porcelain)"
          git diff --exit-code "${TARGET_EXPECTED}" HEAD -- apps/learnit-next/src/core/session.js
          printf 'REPAIR_SHA=%s\n' "${REPAIR_SHA}"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${TARGET_EXPECTED}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "ATLAS_WP_025_SECRET_BOUNDARY_REPAIR=QUALIFIED_AND_PUSHED"
