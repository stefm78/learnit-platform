name: Atlas M3.1 Pedagogical Quality CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-m3-1-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  product:
    name: M3.1 pedagogical quality evidence
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'atlas/ATLAS-WP-012-m3-1-pedagogical-quality'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Bind authority baseline and exact scope
        shell: bash
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE=6741050ef90e9f47b0642709912fc41a0e7ac5b5
          [[ "$(git rev-parse HEAD)" == "$TARGET" ]]
          [[ "$(git merge-base "$BASE" HEAD)" == "$BASE" ]]
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          wp=json.loads(Path('work-packages/ATLAS-WP-012.json').read_text(encoding='utf-8'))
          assert wp['id']=='ATLAS-WP-012'
          assert wp['authority']['issue']==261
          assert wp['baseline']['baseCommit']=='6741050ef90e9f47b0642709912fc41a0e7ac5b5'
          assert wp['baseline']['acceptedDesignHead']=='12acb83c3f986a0c29e06e4add715984d1484b5a'
          allowed=set(wp['scope']['allowedPaths'])
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',wp['baseline']['baseCommit']+'...HEAD'],
              text=True,
          ).splitlines())
          unexpected=changed-allowed
          missing_wp='work-packages/ATLAS-WP-012.json' not in changed
          assert not unexpected, f'OUT_OF_SCOPE:{sorted(unexpected)}'
          assert not missing_wp, 'WORK_PACKAGE_NOT_CHANGED'
          assert len(changed)<=wp['execution']['maximumChangedFiles']
          assert 'authoring/studio/tests/qa_m3_1_pedagogical_quality.py' not in changed
          assert '.github/workflows/atlas-m3-1-pedagogical-quality-qa.yml' not in changed
          print('ATLAS_M3_1_CHANGED_PATHS='+str(len(changed)))
          for path in sorted(changed): print(path)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Prove frozen upstream authorities unchanged
        shell: bash
        run: |
          set -euo pipefail
          BASE=6741050ef90e9f47b0642709912fc41a0e7ac5b5
          git diff --exit-code "$BASE"...HEAD --             contracts/learnit-kit-v2.schema.json             authoring/v2/validate_kit.py             authoring/v2/atlas/validate_atlas_content.py             authoring/v2/atlas/nombres_complexes_atlas.json             authoring/v2/atlas/signaux_electriques_atlas.json             authoring/studio/server.py             apps/learnit-next/source_manifest.json

      - name: Run canonical Atlas validators
        shell: bash
        run: |
          set -euo pipefail
          python -B authoring/v2/validate_kit.py             authoring/v2/atlas/nombres_complexes_atlas.json             authoring/v2/atlas/signaux_electriques_atlas.json
          python -B authoring/v2/atlas/validate_atlas_content.py

      - name: Run M3.1 product and browser tests
        run: python -B authoring/studio/tests/test_m3_1_pedagogical_quality.py

      - name: Prove deterministic Pages bundle
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/m3-1-pages-a"
          B="$RUNNER_TEMP/m3-1-pages-b"
          python -B authoring/studio/pages/build_pages.py --output "$A"
          python -B authoring/studio/pages/build_pages.py --output "$B"
          diff -qr "$A" "$B"
          cmp             authoring/v2/atlas/pedagogical_quality.py             "$A/_authority/authoring/v2/atlas/pedagogical_quality.py"
          ! grep -n 'PQ_' authoring/studio/web/studio.js authoring/studio/pages/pages-bootstrap.js

      - name: Prove offline and no-write quality boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -REn '\b(requests|httpx|aiohttp)\b|urllib\.request|socket\.|WebSocket|XMLHttpRequest|EventSource'             authoring/v2/atlas/pedagogical_quality.py
          ! grep -En '\.write_text\(|\.write_bytes\(|(^|[^A-Za-z])open\('             authoring/v2/atlas/pedagogical_quality.py
          grep -q 'pedagogicalQuality' authoring/studio/core.py
          grep -q 'pedagogicalQuality' authoring/studio/web/studio.js
          grep -q 'pedagogical_quality.py' authoring/studio/pages/pages-bootstrap.js
          ! grep -q 'PQ_' authoring/studio/web/studio.js
          ! grep -q 'PQ_' authoring/studio/pages/pages-bootstrap.js

      - name: Prove authoring skill contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'learnit.kit.v2' authoring/skills/SKILL_ATLAS_KIT_AUTHORING_V1.md
          grep -q 'pedagogical_quality.py candidate.json --json --require-excellent' authoring/skills/SKILL_ATLAS_KIT_AUTHORING_V1.md
          grep -q 'exactement deux' authoring/skills/SKILL_ATLAS_KIT_AUTHORING_V1.md
          grep -q 'Do not create a third claim for transfer' authoring/skills/SKILL_ATLAS_KIT_AUTHORING_V1.md
          grep -q 'stop and report the gap instead of fabricating content' authoring/skills/SKILL_ATLAS_KIT_AUTHORING_V1.md
          ! grep -q 'learnit.import.v1.1' authoring/skills/SKILL_ATLAS_KIT_AUTHORING_V1.md

      - name: Materialize exact declared learner projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('apps/learnit-next/source_manifest.json').read_text(encoding='utf-8'))
          materialized=[]
          for item in manifest['workingFiles']:
              path=Path(item['path'])
              if path.is_file():
                  continue
              fingerprint=item.get('fingerprint',{})
              if fingerprint.get('kind')!='git-blob-sha1':
                  continue
              data=subprocess.run(
                  ['git','cat-file','blob',fingerprint.get('value','')],
                  check=True,stdout=subprocess.PIPE,
              ).stdout
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              materialized.append(str(path))
          print('MATERIALIZED='+str(len(materialized)))
          PY

      - name: Run promoted learner regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B apps/learnit-next/tests/contract_v2.py
          python -B apps/learnit-next/tests/storage_isolation.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_learning.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_platform.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_authoring.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_ui.py
          python -B apps/learnit-next/tests/atlas_m1_learning.py
          python -B apps/learnit-next/tests/atlas_m1_core.py
          python -B apps/learnit-next/tests/atlas_m1_experience.py
          python -B apps/learnit-next/tests/atlas_m1_content.py
          python -B apps/learnit-next/tests/atlas_m1_int.py
          python -B apps/learnit-next/tests/atlas_m2_memory.py
          python -B apps/learnit-next/tests/atlas_m2_transfer.py
          python -B apps/learnit-next/tests/atlas_m2_ux_clarity.py

      - name: Rebuild exact promoted learner artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "$RUNNER_TEMP/learner-a.html"
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "$RUNNER_TEMP/learner-b.html"
          cmp "$RUNNER_TEMP/learner-a.html" "$RUNNER_TEMP/learner-b.html"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          data=(Path(os.environ['RUNNER_TEMP'])/'learner-a.html').read_bytes()
          assert len(data)==366412, len(data)
          digest=hashlib.sha256(data).hexdigest()
          assert digest=='4b50af3dfe8820d258eaa73999b8a7e52b4991584d27986dca7e647af608f6d7', digest
          print('LEARNER_BYTES='+str(len(data)))
          print('LEARNER_SHA256='+digest)
          PY

      - name: Diff hygiene
        run: git diff --check 6741050ef90e9f47b0642709912fc41a0e7ac5b5...HEAD

      - name: Write exact product evidence
        if: success()
        shell: bash
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          q=Path('authoring/v2/atlas/pedagogical_quality.py').read_bytes()
          skill=Path('authoring/skills/SKILL_ATLAS_KIT_AUTHORING_V1.md').read_bytes()
          proof={
            'schema':'learnit.atlas.m3_1.pedagogical-quality.product-evidence.v1',
            'result':'PASS',
            'verdict':'PASS_ATLAS_M3_1_PEDAGOGICAL_QUALITY_PRODUCT_HEAD',
            'workPackage':'ATLAS-WP-012',
            'authorityIssue':261,
            'head':os.environ['TARGET'],
            'baseline':'6741050ef90e9f47b0642709912fc41a0e7ac5b5',
            'acceptedDesignHead':'12acb83c3f986a0c29e06e4add715984d1484b5a',
            'qualityEngineSha256':hashlib.sha256(q).hexdigest(),
            'authoringSkillSha256':hashlib.sha256(skill).hexdigest(),
            'reportSchema':'learnit.atlas.pedagogical_quality_report.v1',
            'qualityProfile':'atlas.pedagogy.v1',
            'singlePythonQualityAuthority':True,
            'canonicalAuthorityUnchanged':True,
            'thirdClaimRequired':False,
            'networkRequired':False,
            'inputMutation':False,
            'pagesPythonAuthority':'PASS',
            'browserPythonEquivalence':'PASS',
            'learnerArtifactBytes':366412,
            'learnerArtifactSha256':'4b50af3dfe8820d258eaa73999b8a7e52b4991584d27986dca7e647af608f6d7',
          }
          out=Path(os.environ['RUNNER_TEMP'])/'atlas_m3_1_product.json'
          out.write_text(json.dumps(proof,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY

      - name: Upload exact M3.1 product evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-m3-1-product-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/atlas_m3_1_product.json
