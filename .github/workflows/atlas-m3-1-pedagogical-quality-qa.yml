name: Atlas M3.1 Pedagogical Quality Independent QA

on:
  push:
    branches:
      - qa/QA-WP-021-m3-1-pedagogical-quality
  pull_request:
    branches:
      - atlas/ATLAS-WP-012-m3-1-pedagogical-quality
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-m3-1-qa-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA-WP-021 exact-head contradictory QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact QA head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Bind exact product and QA scope
        shell: bash
        env:
          QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PRODUCT=6fa1acc23999b5a0b9a0b7f375a12f19ecc4e4e2
          [[ "$(git rev-parse HEAD)" == "$QA_HEAD" ]]
          git cat-file -e "$PRODUCT^{commit}"
          [[ "$(git merge-base "$PRODUCT" HEAD)" == "$PRODUCT" ]]
          export PRODUCT
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          product=os.environ["PRODUCT"]
          qa=json.loads(Path("work-packages/QA-WP-021.json").read_text(encoding="utf-8"))
          assert qa["id"]=="QA-WP-021"
          assert qa["authority"]["issue"]==268
          assert qa["baseline"]["exactProductHead"]==product

          allowed=set(qa["scope"]["allowedPaths"])
          changed=set(subprocess.check_output(
              ["git","diff","--name-only",product+"...HEAD"], text=True
          ).splitlines())
          assert changed==allowed, f"QA_SCOPE_MISMATCH:{sorted(changed)} != {sorted(allowed)}"

          product_wp=json.loads(subprocess.check_output(
              ["git","show",product+":work-packages/ATLAS-WP-012.json"], text=True
          ))
          for path in product_wp["scope"]["allowedPaths"]:
              expected=subprocess.check_output(["git","rev-parse",product+":"+path],text=True).strip()
              actual=subprocess.check_output(["git","rev-parse","HEAD:"+path],text=True).strip()
              assert actual==expected, f"PRODUCT_BLOB_CHANGED:{path}"

          assert "authoring/studio/tests/qa_m3_1_pedagogical_quality.py" not in product_wp["scope"]["allowedPaths"]
          print("QA_CHANGED_PATHS=3")
          print("FROZEN_PRODUCT_BLOB_IDENTITY=PASS")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Reprove canonical product authorities
        shell: bash
        run: |
          set -euo pipefail
          python -B authoring/v2/validate_kit.py             authoring/v2/atlas/nombres_complexes_atlas.json             authoring/v2/atlas/signaux_electriques_atlas.json
          python -B authoring/v2/atlas/validate_atlas_content.py

      - name: Run independent contradictory QA oracle
        run: python -B authoring/studio/tests/qa_m3_1_pedagogical_quality.py

      - name: Prove QA does not introduce product rule authority
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'PQ_' authoring/studio/web/studio.js
          ! grep -q 'PQ_' authoring/studio/pages/pages-bootstrap.js
          grep -q 'pedagogical_quality.py' authoring/studio/pages/pages-bootstrap.js
          grep -q 'pedagogicalQuality' authoring/studio/core.py

      - name: Materialize exact declared learner projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('apps/learnit-next/source_manifest.json').read_text(encoding='utf-8'))
          materialized=[]
          for item in manifest['workingFiles']:
              path=Path(item['path'])
              if path.is_file():
                  continue
              fingerprint=item.get('fingerprint',{})
              if fingerprint.get('kind')!='git-blob-sha1':
                  continue
              data=subprocess.run(
                  ['git','cat-file','blob',fingerprint.get('value','')],
                  check=True,stdout=subprocess.PIPE,
              ).stdout
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              materialized.append(str(path))
          print('MATERIALIZED='+str(len(materialized)))
          PY

      - name: Run promoted learner regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B apps/learnit-next/tests/contract_v2.py
          python -B apps/learnit-next/tests/storage_isolation.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_learning.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_platform.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_authoring.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_ui.py
          python -B apps/learnit-next/tests/atlas_m1_learning.py
          python -B apps/learnit-next/tests/atlas_m1_core.py
          python -B apps/learnit-next/tests/atlas_m1_experience.py
          python -B apps/learnit-next/tests/atlas_m1_content.py
          python -B apps/learnit-next/tests/atlas_m1_int.py
          python -B apps/learnit-next/tests/atlas_m2_memory.py
          python -B apps/learnit-next/tests/atlas_m2_transfer.py
          python -B apps/learnit-next/tests/atlas_m2_ux_clarity.py

      - name: Rebuild exact promoted learner artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "$RUNNER_TEMP/learner-a.html"
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "$RUNNER_TEMP/learner-b.html"
          cmp "$RUNNER_TEMP/learner-a.html" "$RUNNER_TEMP/learner-b.html"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          data=(Path(os.environ['RUNNER_TEMP'])/'learner-a.html').read_bytes()
          assert len(data)==366412, len(data)
          digest=hashlib.sha256(data).hexdigest()
          assert digest=='4b50af3dfe8820d258eaa73999b8a7e52b4991584d27986dca7e647af608f6d7', digest
          print('LEARNER_BYTES='+str(len(data)))
          print('LEARNER_SHA256='+digest)
          PY

      - name: Diff hygiene
        run: git diff --check 6fa1acc23999b5a0b9a0b7f375a12f19ecc4e4e2...HEAD

      - name: Write exact QA evidence
        if: success()
        shell: bash
        env:
          QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          quality=Path('authoring/v2/atlas/pedagogical_quality.py').read_bytes()
          oracle=Path('authoring/studio/tests/qa_m3_1_pedagogical_quality.py').read_bytes()
          proof={
            'schema':'learnit.atlas.m3_1.pedagogical-quality.qa-evidence.v1',
            'result':'PASS',
            'verdict':'PASS_QA_WP_021_EXACT_HEAD_CONTRADICTORY_QA',
            'workPackage':'QA-WP-021',
            'authorityIssue':268,
            'productHead':'6fa1acc23999b5a0b9a0b7f375a12f19ecc4e4e2',
            'qaHead':os.environ['QA_HEAD'],
            'productEvidenceArtifact':9736746706,
            'productEvidenceDigest':'sha256:3e348dbe55af28be92af24774a8106a4e9708bdb7d435351e36619d8d73cc6d1',
            'qualityEngineSha256':hashlib.sha256(quality).hexdigest(),
            'qaOracleSha256':hashlib.sha256(oracle).hexdigest(),
            'frozenProductBlobIdentity':'PASS',
            'browserPythonEquivalence':'PASS',
            'canonicalQualityExportSeparation':'PASS',
            'thirdTransferClaimRequired':False,
            'learnerArtifactBytes':366412,
            'learnerArtifactSha256':'4b50af3dfe8820d258eaa73999b8a7e52b4991584d27986dca7e647af608f6d7',
          }
          out=Path(os.environ['RUNNER_TEMP'])/'qa_wp_021.json'
          out.write_text(json.dumps(proof,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY

      - name: Upload exact QA evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qa-wp-021-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/qa_wp_021.json
