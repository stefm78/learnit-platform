name: Atlas controlled-time navigator CI

on:
  pull_request:
    branches: [main]
    paths:
      - work-packages/DEV-WP-032.json
      - apps/learnit-next/dev/controlled_time_navigator.py
      - apps/learnit-next/dev/controlled_time_inject.js
      - apps/learnit-next/tests/dev_controlled_time_navigator.py
      - .github/workflows/atlas-controlled-time-navigator-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-controlled-time-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controlled-time-navigator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize declared baseline projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest=json.loads(Path('apps/learnit-next/source_manifest.json').read_text(encoding='utf-8'))
          materialized=[]
          for item in manifest['workingFiles']:
              path=Path(item['path'])
              if path.is_file():
                  continue
              fingerprint=item.get('fingerprint',{})
              if fingerprint.get('kind')!='git-blob-sha1':
                  continue
              blob=fingerprint.get('value','')
              data=subprocess.run(
                  ['git','cat-file','blob',blob],check=True,stdout=subprocess.PIPE,
              ).stdout
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              materialized.append(str(path))
          print('CONTROLLED_TIME_MATERIALIZED='+str(len(materialized)))
          PY

      - name: Enforce exact DEV-WP-032 scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          base='c8e6e2a01a9a517f0aa7bdbfc2e01a600d2f30ba'
          package=json.loads(Path('work-packages/DEV-WP-032.json').read_text(encoding='utf-8'))
          assert package['id']=='DEV-WP-032'
          assert package['authority']['issue']==231
          assert package['baseline']['baseCommit']==base
          assert package['status']=='under-qa'
          assert subprocess.check_output(['git','merge-base',base,'HEAD'],text=True).strip()==base
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',f'{base}...HEAD'],text=True,
          ).splitlines())
          allowed=set(package['scope']['allowedPaths'])
          unexpected=changed-allowed
          assert not unexpected, f'OUT_OF_SCOPE:{sorted(unexpected)}'
          assert changed, 'EMPTY_IMPLEMENTATION_DIFF'
          assert 'work-packages/QA-WP-019.json' not in changed
          print(json.dumps({'changedPaths':sorted(changed),'scope':'PASS'},sort_keys=True))
          PY

      - name: Prove learner and Pages source identity
        shell: bash
        run: |
          set -euo pipefail
          base='c8e6e2a01a9a517f0aa7bdbfc2e01a600d2f30ba'
          git diff --exit-code "$base...HEAD" -- \
            apps/learnit-next/src \
            apps/learnit-next/source_manifest.json \
            apps/learnit-next/build.py \
            .github/workflows/learnit-next-pages.yml
          python - <<'PY'
          from pathlib import Path
          paths=[Path('apps/learnit-next/dev/controlled_time_inject.js')]
          forbidden=('fetch(', 'XMLHttpRequest', 'WebSocket', 'EventSource')
          for path in paths:
              text=path.read_text(encoding='utf-8')
              hits=[token for token in forbidden if token in text]
              assert not hits, (str(path),hits)
          PY

      - name: Install declared browser test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run controlled-time implementation suite
        env:
          LEARNIT_CONTROLLED_TIME_BROWSER: '1'
        run: python -B apps/learnit-next/tests/dev_controlled_time_navigator.py

      - name: Run promoted learner regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B apps/learnit-next/tests/contract_v2.py
          python -B apps/learnit-next/tests/storage_isolation.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_learning.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_platform.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_authoring.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_ui.py
          python -B apps/learnit-next/tests/atlas_m1_learning.py
          python -B apps/learnit-next/tests/atlas_m1_core.py
          python -B apps/learnit-next/tests/atlas_m1_experience.py
          python -B apps/learnit-next/tests/atlas_m1_content.py
          python -B apps/learnit-next/tests/atlas_m1_int.py
          python -B apps/learnit-next/tests/atlas_m2_memory.py
          python -B apps/learnit-next/tests/atlas_m2_transfer.py
          python -B apps/learnit-next/tests/atlas_m2_ux_clarity.py

      - name: Build exact controlled-time evidence
        shell: bash
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -B apps/learnit-next/dev/controlled_time_navigator.py \
            --output "${RUNNER_TEMP}/learnit-next-controlled-time.html" \
            | tee "${RUNNER_TEMP}/generator-result.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result=json.loads(Path(os.environ['RUNNER_TEMP']+'/generator-result.json').read_text(encoding='utf-8'))
          evidence={
              'schema':'learnit.atlas.controlled-time.product-evidence.v1',
              'result':'PASS',
              'verdict':'PASS_DEV_WP_032_IMPLEMENTATION_HEAD',
              'workPackage':'DEV-WP-032',
              'authorityIssue':231,
              'head':os.environ['TARGET'],
              'canonical':result['canonical'],
              'candidate':result['candidate'],
              'storage':result['storage'],
              'networkRequired':result['networkRequired'],
              'publishedToNormalPages':result['publishedToNormalPages'],
          }
          Path(os.environ['RUNNER_TEMP']+'/controlled-time-evidence.json').write_text(
              json.dumps(evidence,sort_keys=True,separators=(',',':'))+'\n',
              encoding='utf-8',
          )
          print(json.dumps(evidence,indent=2,sort_keys=True))
          PY

      - name: Run repository validation and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/validate_repository.py
          git diff --check c8e6e2a01a9a517f0aa7bdbfc2e01a600d2f30ba...HEAD

      - name: Upload exact controlled-time candidate
        uses: actions/upload-artifact@v4
        with:
          name: atlas-controlled-time-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/learnit-next-controlled-time.html
            ${{ runner.temp }}/generator-result.json
            ${{ runner.temp }}/controlled-time-evidence.json
