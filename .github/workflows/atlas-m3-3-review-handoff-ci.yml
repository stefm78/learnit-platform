name: Atlas M3.3 Review Handoff and Transient Source Admission CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'work-packages/ATLAS-WP-023.json'
      - 'authoring/factory/transient_source_admission.py'
      - 'authoring/factory/tests/test_transient_source_admission.py'
      - 'authoring/factory/handoff.py'
      - 'authoring/factory/README.md'
      - 'authoring/factory/tests/test_review_handoff.py'
      - '.github/workflows/atlas-m3-3-review-handoff-ci.yml'
  push:
    branches: [main]
    paths:
      - 'work-packages/ATLAS-WP-023.json'
      - 'authoring/factory/transient_source_admission.py'
      - 'authoring/factory/tests/test_transient_source_admission.py'
      - 'authoring/factory/handoff.py'
      - 'authoring/factory/README.md'
      - 'authoring/factory/tests/test_review_handoff.py'
      - '.github/workflows/atlas-m3-3-review-handoff-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-m3-3-review-handoff-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: M3.3 transient-source review-handoff exact-head evidence
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'atlas/ATLAS-WP-023-transient-user-source-admission'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt

      - name: Bind exact product scope and frozen upstream authorities
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
          PRODUCT_BASE: e90940130b540f57abb999c56a24015c6b470249
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${TARGET}" ]]
          git fetch --force --no-tags origin "${PRODUCT_BASE}"
          for path in \
            authoring/factory/factory_gate.py \
            authoring/factory/reliability.py \
            authoring/factory/source_admission.py \
            authoring/factory/benchmark_contract.json \
            authoring/factory/benchmark_sources_v1.json \
            authoring/skills/SKILL_ATLAS_KIT_REVIEW_V1.md; do
            git diff --quiet "${PRODUCT_BASE}" HEAD -- "${path}" || {
              echo "Frozen upstream authority changed: ${path}" >&2
              exit 2
            }
          done
          if [[ "${EVENT}" == pull_request ]]; then
            [[ "${BRANCH}" == atlas/ATLAS-WP-023-transient-user-source-admission ]]
            git fetch --force --no-tags origin "${BASE_SHA}"
            compare_base="$(git merge-base "${BASE_SHA}" "${TARGET}")"
            actual="$(git diff --name-only "${compare_base}" "${TARGET}" | sort)"
            expected="$(printf '%s\n' \
              '.github/workflows/atlas-m3-3-review-handoff-ci.yml' \
              'authoring/factory/README.md' \
              'authoring/factory/handoff.py' \
              'authoring/factory/transient_source_admission.py' \
              'authoring/factory/tests/test_review_handoff.py' \
              'authoring/factory/tests/test_transient_source_admission.py' \
              'work-packages/ATLAS-WP-023.json' | sort)"
            [[ "${actual}" == "${expected}" ]] || {
              echo "M3.3 exact path set mismatch." >&2
              diff -u <(printf '%s\n' "${expected}") <(printf '%s\n' "${actual}") || true
              exit 2
            }
          fi
          python - <<'PY'
          import json, pathlib
          wp=json.loads(pathlib.Path("work-packages/ATLAS-WP-023.json").read_text(encoding="utf-8"))
          assert wp["id"]=="ATLAS-WP-023"
          assert wp["authority"]["issue"]==340
          assert wp["baseline"]["baseCommit"]=="e90940130b540f57abb999c56a24015c6b470249"
          assert wp["scope"]["allowedPaths"]==[
              "work-packages/ATLAS-WP-023.json",
              "authoring/factory/transient_source_admission.py",
              "authoring/factory/handoff.py",
              "authoring/factory/README.md",
              "authoring/factory/tests/test_transient_source_admission.py",
              "authoring/factory/tests/test_review_handoff.py",
              ".github/workflows/atlas-m3-3-review-handoff-ci.yml",
          ]
          PY

      - name: Run promoted factory regression oracles
        run: |
          set -euo pipefail
          python -B authoring/factory/tests/test_ai_kit_factory.py
          python -B authoring/factory/tests/test_factory_reliability.py
          python -B authoring/factory/tests/test_source_admission.py

      - name: Run transient source-admission and M3.3 handoff oracles
        run: |
          set -euo pipefail
          python -B authoring/factory/tests/test_transient_source_admission.py
          python -B authoring/factory/tests/test_review_handoff.py

      - name: Repository governance mirror
        run: |
          set -euo pipefail
          python tools/validate_repository.py
