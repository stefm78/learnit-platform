name: ATLAS WP073 Student V0.1 limited pilot R1

on:
  push:
    branches: [student-v01/limited-pilot-5-6-students-r1]
  pull_request:
    branches: [student-v01/g5-final-closeout-limited-pilot-r1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    if: github.event_name != 'pull_request' || github.head_ref == 'student-v01/limited-pilot-5-6-students-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE: af14bc0a9b1988b5d42b158ae4a6b3afa544221f
      EXPECTED_APP_BYTES: '583764'
      EXPECTED_APP_SHA256: 7ee493b8855e4cda7703deccbf5c813391afaa5a9674d6760b75a277e0267553
      EXPECTED_KIT_SHA256: aeac0925e686d6055405382142ad14831c27f73992401a1748ec76b85665c62b
      KIT: showcase/student-v0.1/nombres-complexes/nombres_complexes_student_v01_v5.json
      LEARNER_ZIP: /tmp/student-v01-limited-pilot-r1-learner.zip
      FACILITATOR_ZIP: /tmp/student-v01-limited-pilot-r1-facilitator.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install exact qualification dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.25.1 playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Revalidate exact topology and mutation allowlist
        shell: bash
        run: |
          set -euo pipefail
          target="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$target"
          git cat-file -e "$BASE^{commit}"
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            test "${{ github.event.pull_request.base.ref }}" = "student-v01/g5-final-closeout-limited-pilot-r1"
            test "${{ github.event.pull_request.base.sha }}" = "$BASE"
            test "${{ github.event.pull_request.head.ref }}" = "student-v01/limited-pilot-5-6-students-r1"
          fi
          python - "$BASE" <<'PY'
          import subprocess,sys
          base=sys.argv[1]
          changed=set(subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          exact={
            "qualification/STUDENT_V01_JOB31_LIMITED_PILOT_R1_PREPARATION_RESULT.md",
            "qualification/STUDENT_V01_JOB31_LIMITED_PILOT_R1_COHORT_RESULT.md",
            "work-packages/ATLAS-WP-073.json",
            ".github/workflows/atlas-wp073-limited-pilot-r1.yml",
          }
          prefixes=(
            "pilot/student-v0.1/limited-pilot-r1/",
            "qualification/student-v0.1/limited-pilot-r1/",
          )
          forbidden=[p for p in changed if p not in exact and not p.startswith(prefixes)]
          assert not forbidden, forbidden
          protected_prefixes=("apps/learnit-next/","contracts/","authoring/","showcase/")
          protected=[p for p in changed if p.startswith(protected_prefixes)]
          protected += [p for p in changed if p in {
            "docs/programs/student-v0.1/PROGRAM_CHARTER.md",
            "docs/programs/student-v0.1/COORDINATION.yaml",
          }]
          assert not protected, protected
          print("JOB31_SCOPE=PASS")
          PY

      - name: Rebuild exact frozen learner twice
        shell: bash
        run: |
          set -euo pipefail
          python -B apps/learnit-next/build.py --output /tmp/job31-app-1.html
          python -B apps/learnit-next/build.py --output /tmp/job31-app-2.html
          cmp -s /tmp/job31-app-1.html /tmp/job31-app-2.html
          bytes="$(wc -c < /tmp/job31-app-1.html | tr -d ' ')"
          sha="$(sha256sum /tmp/job31-app-1.html | awk '{print $1}')"
          test "$bytes" = "$EXPECTED_APP_BYTES"
          test "$sha" = "$EXPECTED_APP_SHA256"
          echo "BUILD_BYTES=$bytes"
          echo "BUILD_SHA256=$sha"
          echo "FROZEN_PRODUCT_BUILD=PASS"

      - name: Validate exact V5 showcase
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$KIT" | awk '{print $1}')" = "$EXPECTED_KIT_SHA256"
          python -B authoring/v5/validate_kit.py "$KIT" --format=json | tee /tmp/job31-v5-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          kit=json.loads(Path("showcase/student-v0.1/nombres-complexes/nombres_complexes_student_v01_v5.json").read_text(encoding="utf-8"))
          assert kit["contract"]=="learnit.kit.v5"
          assert sum(len(c.get("activities",[])) for c in kit["courses"])==10
          print("V5_CONTRACT_AND_ACTIVITY_COUNT=PASS")
          PY
          echo "V5_SHOWCASE_SHA256=$EXPECTED_KIT_SHA256"

      - name: Build deterministic learner and facilitator packages twice
        shell: bash
        run: |
          set -euo pipefail
          python -B pilot/student-v0.1/limited-pilot-r1/build_packages.py \
            --app /tmp/job31-app-1.html --kit "$KIT" \
            --learner-output "$LEARNER_ZIP" \
            --facilitator-output "$FACILITATOR_ZIP" | tee /tmp/job31-packages.jsonl
          python -B pilot/student-v0.1/limited-pilot-r1/build_packages.py \
            --app /tmp/job31-app-2.html --kit "$KIT" \
            --learner-output /tmp/job31-learner-2.zip \
            --facilitator-output /tmp/job31-facilitator-2.zip >/tmp/job31-packages-2.jsonl
          cmp -s "$LEARNER_ZIP" /tmp/job31-learner-2.zip
          cmp -s "$FACILITATOR_ZIP" /tmp/job31-facilitator-2.zip
          learner_sha="$(sha256sum "$LEARNER_ZIP" | awk '{print $1}')"
          facilitator_sha="$(sha256sum "$FACILITATOR_ZIP" | awk '{print $1}')"
          echo "LEARNER_PACKAGE_SHA256=$learner_sha"
          echo "FACILITATOR_PACKAGE_SHA256=$facilitator_sha"
          echo "LEARNER_PACKAGE_SHA256=$learner_sha" >> "$GITHUB_ENV"
          echo "FACILITATOR_PACKAGE_SHA256=$facilitator_sha" >> "$GITHUB_ENV"
          echo "PACKAGE_DETERMINISM=PASS"

      - name: Validate state, ledger, packages, and adversarial rejection
        run: |
          python -B pilot/student-v0.1/limited-pilot-r1/validate_pilot.py \
            --self-test-adversarial \
            --learner-package "$LEARNER_ZIP" \
            --facilitator-package "$FACILITATOR_ZIP"

      - name: Browser qualification
        run: |
          python -B pilot/student-v0.1/limited-pilot-r1/browser_smoke.py \
            --learner-package "$LEARNER_ZIP"

      - name: Prove generated ZIPs are not tracked
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files 'pilot/student-v0.1/limited-pilot-r1/*.zip' 'qualification/student-v0.1/limited-pilot-r1/*.zip')"
          echo GENERATED_ZIPS_NOT_COMMITTED=PASS

      - name: Verify durable package binding when preparation is finalized
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          state=json.loads(Path("qualification/student-v0.1/limited-pilot-r1/PILOT_STATE.json").read_text(encoding="utf-8"))
          if state["state"]=="PREPARING":
              assert state["learnerPackageSha256"]=="PENDING_QUALIFICATION"
              assert state["facilitatorPackageSha256"]=="PENDING_QUALIFICATION"
              print("PILOT_STATE=PREPARING")
          else:
              assert state["state"]=="READY_NOT_STARTED"
              assert state["learnerPackageSha256"]==os.environ["LEARNER_PACKAGE_SHA256"]
              assert state["facilitatorPackageSha256"]==os.environ["FACILITATOR_PACKAGE_SHA256"]
              assert state["completedRealSessions"]==0
              print("PILOT_STATE=READY_NOT_STARTED")
          PY

      - name: Repository governance
        run: |
          python tools/validate_repository.py
          echo REPOSITORY_GOVERNANCE=PASS

      - name: Upload learner package
        id: learner_upload
        uses: actions/upload-artifact@v4
        with:
          name: student-v01-limited-pilot-r1-learner-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/student-v01-limited-pilot-r1-learner.zip

      - name: Upload facilitator package
        id: facilitator_upload
        uses: actions/upload-artifact@v4
        with:
          name: student-v01-limited-pilot-r1-facilitator-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/student-v01-limited-pilot-r1-facilitator.zip

      - name: Qualification receipt
        shell: bash
        run: |
          echo "LEARNER_PACKAGE_SHA256=$LEARNER_PACKAGE_SHA256"
          echo "LEARNER_PACKAGE_ARTIFACT_ID=${{ steps.learner_upload.outputs.artifact-id }}"
          echo "FACILITATOR_PACKAGE_SHA256=$FACILITATOR_PACKAGE_SHA256"
          echo "FACILITATOR_PACKAGE_ARTIFACT_ID=${{ steps.facilitator_upload.outputs.artifact-id }}"
          echo "REAL_STUDENT_SESSIONS_RECORDED=0"
          echo "MACHINE_SMOKE_ONLY_NOT_A_REAL_STUDENT_SESSION"
          echo "FINAL_VERDICT=PASS_JOB31_PHASE_A_MACHINE_QUALIFICATION"
