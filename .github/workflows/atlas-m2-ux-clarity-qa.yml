name: Atlas M2 UX Clarity Independent QA

on:
  pull_request:
    branches:
      - atlas/ATLAS-WP-006-m2-ux-clarity
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-m2-ux-clarity-qa-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  qa:
    name: Exact M2.2 UX clarity contradictory QA
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'qa/QA-WP-017-m2-ux-clarity-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Bind exact product head and QA-only delta
        shell: bash
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          PRODUCT_HEAD=a72917cae93e30040d39a2dbc6601c15155f31b9
          [[ "$(git rev-parse HEAD)" == "${TARGET}" ]]
          git cat-file -e "${PRODUCT_HEAD}^{commit}"
          [[ "$(git merge-base "${PRODUCT_HEAD}" HEAD)" == "${PRODUCT_HEAD}" ]]
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          product='a72917cae93e30040d39a2dbc6601c15155f31b9'
          expected={
            '.github/workflows/atlas-m2-ux-clarity-qa.yml',
            'apps/learnit-next/tests/qa_atlas_m2_ux_clarity.py',
            'work-packages/QA-WP-017.json',
          }
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',f'{product}...HEAD'],
              text=True,
          ).splitlines())
          assert changed==expected, (sorted(changed),sorted(expected))

          wp=json.loads(Path('work-packages/QA-WP-017.json').read_text())
          assert wp['id']=='QA-WP-017'
          assert wp['authority']['issue']==209
          assert wp['baseline']['productHead']==product
          assert wp['execution']['phase']=='BOUND_TO_EXACT_PRODUCT_HEAD_R2'
          assert wp['execution']['expectedArtifactBytes']==365782
          assert wp['execution']['expectedArtifactSha256']=='df5c827eddb551f726219184ef5a289a58114931d2af7dbbfd5cf05f1e997621'
          assert wp['execution']['finalVerdict'] is None
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install declared browser dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt

      - name: Materialize declared source projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('apps/learnit-next/source_manifest.json').read_text(encoding='utf-8'))
          for item in manifest['workingFiles']:
              path=Path(item['path'])
              if path.is_file():
                  continue
              fp=item.get('fingerprint',{})
              if fp.get('kind')!='git-blob-sha1':
                  continue
              data=subprocess.run(
                  ['git','cat-file','blob',fp['value']],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          PY

      - name: Run independent adversarial oracle
        shell: bash
        run: |
          set -euo pipefail
          python -B apps/learnit-next/tests/qa_atlas_m2_ux_clarity.py

      - name: Re-run product semantic invariants
        shell: bash
        run: |
          set -euo pipefail
          python -B apps/learnit-next/tests/atlas_m2_ux_clarity.py
          python -B apps/learnit-next/tests/atlas_m2_transfer.py
          python -B apps/learnit-next/tests/atlas_m2_memory.py
          python -B apps/learnit-next/tests/atlas_m1_int.py

      - name: Refuse semantic/runtime drift
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD=a72917cae93e30040d39a2dbc6601c15155f31b9
          git diff --exit-code "${PRODUCT_HEAD}...HEAD" --             apps/learnit-next/src             apps/learnit-next/source_manifest.json             authoring contracts
          grep -q "const DATABASE = 'learnit_atlas_m1_v2'" apps/learnit-next/src/adapters/atlas_indexeddb.js
          grep -q "const VERSION = 1" apps/learnit-next/src/adapters/atlas_indexeddb.js
          ! grep -R "transfer-completed" apps/learnit-next/src
          ! grep -En 'fetch\(|XMLHttpRequest|WebSocket|EventSource|https?://'             apps/learnit-next/src/integration/atlas/surface.js             apps/learnit-next/src/integration/atlas/session.js             apps/learnit-next/src/ui/atlas_today.js             apps/learnit-next/src/ui/atlas_summary.js

      - name: Rebuild exact candidate twice
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "${RUNNER_TEMP}/qa-a.html"
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "${RUNNER_TEMP}/qa-b.html"
          cmp "${RUNNER_TEMP}/qa-a.html" "${RUNNER_TEMP}/qa-b.html"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'qa-a.html'
          data=p.read_bytes()
          assert len(data)==365782, len(data)
          digest=hashlib.sha256(data).hexdigest()
          assert digest=='df5c827eddb551f726219184ef5a289a58114931d2af7dbbfd5cf05f1e997621', digest
          print('QA_EXACT_ARTIFACT_BYTES='+str(len(data)))
          print('QA_EXACT_ARTIFACT_SHA256='+digest)
          PY
          mkdir -p apps/learnit-next/dist
          cp "${RUNNER_TEMP}/qa-a.html" apps/learnit-next/dist/learnit-next.html
          cp "${RUNNER_TEMP}/qa-a.html" apps/learnit-next/m2-ux-clarity-qa-candidate.html

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run strict browser regression
        env:
          LEARNIT_NEXT_STRICT_INTEGRATION: '1'
        run: python -B apps/learnit-next/tests/browser_vertical_slice.py

      - name: QA diff hygiene
        run: git diff --check a72917cae93e30040d39a2dbc6601c15155f31b9...HEAD

      - name: Write exact independent QA evidence
        if: success()
        shell: bash
        env:
          QA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          artifact=Path('apps/learnit-next/m2-ux-clarity-qa-candidate.html')
          data=artifact.read_bytes()
          proof={
            'schema':'learnit.atlas.m2.ux-clarity.qa-evidence.v1',
            'result':'PASS',
            'verdict':'PASS_ATLAS_M2_UX_CLARITY_TO_HUMAN_GATE',
            'workPackage':'QA-WP-017',
            'authorityIssue':209,
            'productIssue':208,
            'productHead':'a72917cae93e30040d39a2dbc6601c15155f31b9',
            'qaHead':os.environ['QA_HEAD'],
            'artifactBytes':len(data),
            'artifactSha256':hashlib.sha256(data).hexdigest(),
            'productArtifactByteIdentity':'PASS',
            'objectiveIdentity':'PASS',
            'atlasContinuationOwnership':'PASS',
            'humanReadableTime':'PASS',
            'feedbackTransition':'PASS',
            'planObjectiveSeparation':'PASS',
            'semanticNonRegression':'PASS',
            'desktopBrowser':'PASS',
            'networkRequired':False,
            'storageMigration':False,
          }
          out=Path('apps/learnit-next/.agent-result')
          out.mkdir(parents=True,exist_ok=True)
          (out/'atlas_m2_ux_clarity_qa.json').write_text(
              json.dumps(proof,sort_keys=True,separators=(',',':'))+'\n',
              encoding='utf-8',
          )
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY

      - name: Upload exact QA evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-m2-ux-clarity-qa-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
          path: |
            apps/learnit-next/m2-ux-clarity-qa-candidate.html
            apps/learnit-next/.agent-result/atlas_m2_ux_clarity_qa.json
            apps/learnit-next/tests/qa_atlas_m2_ux_clarity.py
