name: ATLAS-WP-058 transient qualification carrier

on:
  pull_request:
    branches:
      - student-v01/r2-v5-runtime-atlas-projection-r1

permissions:
  contents: read

jobs:
  qualify-handoff4:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install qualification dependencies
        run: |
          set -euo pipefail
          python -m pip install 'jsonschema>=4.18' playwright
          python -m playwright install --with-deps chromium
          chromium_path="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as pw:
              print(pw.chromium.executable_path)
          PY
          )"
          sudo ln -sf "$chromium_path" /usr/bin/chromium
      - name: Syntax and Handoff 4 causal qualification
        run: |
          set -euo pipefail
          node --check apps/learnit-next/src/ui/activity_presenters.js
          node --check apps/learnit-next/src/integration/atlas/session.js
          node --check apps/learnit-next/src/main.js
          node --check apps/learnit-next/src/ui/render.js
          python -B apps/learnit-next/tests/v8_selected_presenters_r1.py
      - name: Exact selected V7 Lab reproduction
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/v7-lab 577aa6cde9dfc58663a4935545e48bf8953c902b
          cd /tmp/v7-lab/labs/student-v0.1/activity-experience
          python -B test_lab.py
          python -B browser_smoke.py
          python -B production_audit.py
          python -B production_geometry_audit.py
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/v7-lab
          echo "V7_LAB_EXACT_REPRODUCTION=PASS"
      - name: Handoff 3 causal regression
        run: python -B apps/learnit-next/tests/v5_runtime_atlas_projection_r1.py
      - name: Frozen V5 V4 and Factory regressions
        run: |
          set -euo pipefail
          python -B authoring/v5/tests/test_validate_v5.py -v
          python -B authoring/v4/tests/test_validate_v4.py -v
          PYTHONPATH=. python -B authoring/factory/tests/test_v5_authoring_factory_source_governance.py -v
      - name: Historical runtime and Atlas regressions
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/learnit-next/tests/student_v01_learning_runtime.py")
          text = path.read_text(encoding="utf-8")
          old = "unknownContract.contract='learnit.kit.v5'"
          new = "unknownContract.contract='learnit.kit.v6'"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -B apps/learnit-next/tests/student_v01_learning_runtime.py -v
          git checkout -- apps/learnit-next/tests/student_v01_learning_runtime.py
          python -B apps/learnit-next/tests/student_v01_activity_presentation.py
          python -B apps/learnit-next/tests/atlas_activity_ui_seam.py
          python -B apps/learnit-next/tests/atlas_m1_core.py -v
          python -B apps/learnit-next/tests/atlas_m1_learning.py -v
          python -B apps/learnit-next/tests/atlas_m1_int.py -v
      - name: Deterministic build
        run: |
          set -euo pipefail
          python -B apps/learnit-next/build.py
          first_sha="$(sha256sum apps/learnit-next/dist/learnit-next.html | awk '{print $1}')"
          first_bytes="$(wc -c < apps/learnit-next/dist/learnit-next.html | tr -d ' ')"
          python -B apps/learnit-next/build.py
          second_sha="$(sha256sum apps/learnit-next/dist/learnit-next.html | awk '{print $1}')"
          second_bytes="$(wc -c < apps/learnit-next/dist/learnit-next.html | tr -d ' ')"
          test "$first_sha" = "$second_sha"
          test "$first_bytes" = "$second_bytes"
          echo "ATLAS_WP_058_BUILD_SHA256=$second_sha"
          echo "ATLAS_WP_058_BUILD_BYTES=$second_bytes"
      - name: Detached Stream 10A compatibility probe
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/stream10a f26216cc28fee9a2f5a55b90e68959d53963663f
          git diff --binary 1bd57ee49f39ebc993af6198d24ebd54cd0ddbab HEAD -- apps/learnit-next/src/ui/render.js > /tmp/h4-render.patch
          for path in \
            apps/learnit-next/src/core/contract.js \
            apps/learnit-next/src/core/import.js \
            apps/learnit-next/src/integration/atlas/activity_projection.js \
            apps/learnit-next/src/integration/atlas/session.js \
            apps/learnit-next/src/main.js \
            apps/learnit-next/src/ui/activity_presenters.js \
            apps/learnit-next/src/styles.css; do
            cp "$path" "/tmp/stream10a/$path"
          done
          cp apps/learnit-next/source_manifest.json /tmp/stream10a/apps/learnit-next/source_manifest.json
          cd /tmp/stream10a
          git apply --3way /tmp/h4-render.patch
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          p=Path("apps/learnit-next/source_manifest.json")
          m=json.loads(p.read_text(encoding="utf-8"))
          for path in ("apps/learnit-next/src/integration/atlas/surface.js","apps/learnit-next/src/ui/render.js"):
              item=next(x for x in m["workingFiles"] if x["path"]==path)
              item["fingerprint"]={"kind":"git-blob-sha1","value":subprocess.check_output(["git","hash-object",path],text=True).strip()}
          me=next(x for x in m["workingFiles"] if x["path"]=="apps/learnit-next/source_manifest.json")
          me["fingerprint"]["value"]=None
          raw=json.dumps(m,ensure_ascii=False,sort_keys=True,separators=(",",":"),allow_nan=False).encode()
          me["fingerprint"]["value"]=hashlib.sha256(raw).hexdigest()
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          python -B apps/learnit-next/build.py
          python -B apps/learnit-next/tests/student_v01_g5_r1_app_experience.py
          python -B apps/learnit-next/tests/browser_student_v01_g5_r1_app_experience.py
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/stream10a
          echo "STREAM_10A_COMPATIBILITY_PROBE=PASS"
