name: Import RC715 source

on:
  push:
    branches:
      - import/rc715-development-baseline
    paths:
      - '.import/rc715-source.payload'
      - '.github/workflows/import-rc715-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out import branch
        uses: actions/checkout@v7
        with:
          ref: import/rc715-development-baseline
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify and safely extract exact source
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          payload = root / '.import' / 'rc715-source.payload'
          destination = root / 'apps' / 'player'
          expected_payload_sha = 'c6854bee987cfea2c2e7673fa0611d58e2f1db15fdb0c19e202806afee140eb4'
          expected_root = 'learnit_rc715_source'
          expected_file_count = 145

          raw = payload.read_bytes()
          actual_payload_sha = hashlib.sha256(raw).hexdigest()
          if actual_payload_sha != expected_payload_sha:
              raise SystemExit(
                  f'RC715 payload SHA mismatch: expected {expected_payload_sha}, got {actual_payload_sha}'
              )

          if destination.exists() and any(destination.iterdir()):
              raise SystemExit('apps/player must be absent or empty before the exact import')
          destination.mkdir(parents=True, exist_ok=True)

          seen: set[str] = set()
          extracted_files: list[str] = []
          with zipfile.ZipFile(payload) as archive:
              for info in archive.infolist():
                  name = info.filename.replace('\\', '/')
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {name}')
                  if not path.parts or path.parts[0] != expected_root:
                      raise SystemExit(f'unexpected archive root: {name}')
                  normalized = path.as_posix()
                  if normalized in seen:
                      raise SystemExit(f'duplicate archive path: {normalized}')
                  seen.add(normalized)
                  unix_mode = info.external_attr >> 16
                  if stat.S_ISLNK(unix_mode):
                      raise SystemExit(f'symbolic link rejected: {name}')
                  relative_parts = path.parts[1:]
                  if not relative_parts:
                      continue
                  target = destination.joinpath(*relative_parts)
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(info) as source, target.open('wb') as output:
                      shutil.copyfileobj(source, output)
                  extracted_files.append(target.relative_to(root).as_posix())

          if len(extracted_files) != expected_file_count:
              raise SystemExit(
                  f'unexpected extracted file count: expected {expected_file_count}, got {len(extracted_files)}'
              )

          evidence_dir = root / 'docs' / 'evidence' / 'rc715'
          evidence_dir.mkdir(parents=True, exist_ok=True)
          evidence = {
              'schemaVersion': 1,
              'workPackage': 'SRC-WP-001',
              'candidate': 'RC715 durable library and rename candidate',
              'sourceArchiveSha256': actual_payload_sha,
              'expectedArtifactSha256': '6d4546efbf9a1216e18fa90ee260e7d79841171c48f533d6b107266e281aa7c0',
              'archiveRoot': expected_root,
              'safeExtraction': True,
              'symlinksRejected': True,
              'duplicatePathsRejected': True,
              'extractedFileCount': len(extracted_files),
              'extractedFiles': sorted(extracted_files),
              'humanPromotion': 'pending',
              'classification': 'development baseline, not promoted stable baseline'
          }
          (evidence_dir / 'import-reconstruction.json').write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8'
          )
          print(json.dumps({
              'payloadSha256': actual_payload_sha,
              'extractedFileCount': len(extracted_files)
          }, indent=2))
          PY

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r apps/player/requirements-test.txt

      - name: Rebuild exact RC715 artifact
        working-directory: apps/player
        run: python build.py

      - name: Verify rebuilt artifact identity
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected = '6d4546efbf9a1216e18fa90ee260e7d79841171c48f533d6b107266e281aa7c0'
          artifact = Path('apps/player/dist/learnit.html')
          actual = hashlib.sha256(artifact.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'artifact SHA mismatch: expected {expected}, got {actual}')

          evidence_path = Path('docs/evidence/rc715/import-reconstruction.json')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          evidence['rebuiltArtifactSha256'] = actual
          evidence['artifactIdentityVerified'] = True
          evidence_path.write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'RC715 artifact identity verified: {actual}')
          PY

      - name: Run mandatory non-browser checks
        working-directory: apps/player
        run: python dev/run_all_checks.py --skip-build

      - name: Validate repository governance
        run: python tools/validate_repository.py

      - name: Remove transfer-only material
        shell: bash
        run: |
          rm -rf .import
          rm -f .github/workflows/import-rc715-source.yml

      - name: Commit exact source and reconstruction evidence
        shell: bash
        run: |
          git config user.name 'learnit-import-bot'
          git config user.email 'learnit-import-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No import changes to commit'
            exit 1
          fi
          git commit -m 'source: import exact RC715 development baseline'
          git push origin HEAD:import/rc715-development-baseline
