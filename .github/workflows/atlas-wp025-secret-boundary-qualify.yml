name: Atlas WP-025 Secret Boundary Qualification

on:
  push:
    branches:
      - ops/atlas-wp025-secret-boundary-repair
    paths:
      - '.github/workflows/atlas-wp025-secret-boundary-qualify.yml'

permissions:
  contents: read

jobs:
  qualify-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: learning/atlas-activity-ui-seam-r15
      TARGET_HEAD: fbc11d091635718307505e1bb69d7218c89c016f
      SOVEREIGN_MAIN: c05380eb145d2503354889dc8516d80d013db4e4
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install declared browser-test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Bind exact PR head fail closed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          actual="$(git rev-parse "origin/${TARGET_BRANCH}")"
          printf 'TARGET_HEAD=%s\nACTUAL_HEAD=%s\n' "${TARGET_HEAD}" "${actual}"
          test "${actual}" = "${TARGET_HEAD}"
          test "$(git merge-base "${SOVEREIGN_MAIN}" "${TARGET_HEAD}")" = "${SOVEREIGN_MAIN}"
          PRODUCT_ROOT="${RUNNER_TEMP}/atlas-wp025-qualified"
          git worktree add --detach "${PRODUCT_ROOT}" "${TARGET_HEAD}"
          echo "PRODUCT_ROOT=${PRODUCT_ROOT}" >> "${GITHUB_ENV}"

      - name: Prove exact six-path bounded scope
        shell: bash
        run: |
          set -euo pipefail
          cd "${PRODUCT_ROOT}"
          mapfile -t changed < <(git diff --name-only "${SOVEREIGN_MAIN}" "${TARGET_HEAD}" | sort)
          printf 'PR_CHANGED_PATHS\n'
          printf '%s\n' "${changed[@]}"
          expected=(
            apps/learnit-next/source_manifest.json
            apps/learnit-next/src/integration/atlas/session.js
            apps/learnit-next/src/ui/render.js
            apps/learnit-next/tests/atlas_activity_ui_seam.py
            apps/learnit-next/tests/atlas_m1_int.py
            work-packages/ATLAS-WP-025.json
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "${path}" >/dev/null
          done
          git diff --exit-code "${SOVEREIGN_MAIN}" "${TARGET_HEAD}" -- apps/learnit-next/src/core/session.js
          git diff --exit-code "${SOVEREIGN_MAIN}" "${TARGET_HEAD}" -- apps/learnit-next/src/core/atlas_planner.js apps/learnit-next/src/core/atlas_evidence.js apps/learnit-next/src/core/atlas_memory.js

      - name: Prove learner-safe UI boundary causally
        shell: bash
        run: |
          set -euo pipefail
          cd "${PRODUCT_ROOT}"
          python3 apps/learnit-next/tests/atlas_activity_ui_seam.py
          grep -F 'projectAtlasActivityPresentation' apps/learnit-next/src/integration/atlas/session.js
          grep -F 'renderAtlasActivityMarkup(activityPresentation)' apps/learnit-next/src/integration/atlas/session.js
          grep -F 'readAtlasActivityResponse(wrapper, activityPresentation)' apps/learnit-next/src/integration/atlas/session.js
          ! grep -F 'renderAtlasActivityMarkup(activity)' apps/learnit-next/src/integration/atlas/session.js
          ! grep -F 'readAtlasActivityResponse(wrapper, activity)' apps/learnit-next/src/integration/atlas/session.js

      - name: Syntax and deterministic build
        shell: bash
        run: |
          set -euo pipefail
          cd "${PRODUCT_ROOT}"
          node --check apps/learnit-next/src/integration/atlas/session.js
          node --check apps/learnit-next/src/ui/render.js
          python3 apps/learnit-next/build.py
          bytes="$(wc -c < apps/learnit-next/dist/learnit-next.html | tr -d ' ')"
          sha="$(sha256sum apps/learnit-next/dist/learnit-next.html | awk '{print $1}')"
          printf 'QUALIFIED_ARTIFACT_BYTES=%s\nQUALIFIED_ARTIFACT_SHA256=%s\n' "${bytes}" "${sha}"

      - name: Replay qcm fill and Atlas regression suites
        shell: bash
        run: |
          set -euo pipefail
          cd "${PRODUCT_ROOT}"
          for path in \
            apps/learnit-next/tests/dev_learning_loop_v2_platform.py \
            apps/learnit-next/tests/dev_learning_loop_v2_ui.py \
            apps/learnit-next/tests/atlas_m1_core.py \
            apps/learnit-next/tests/atlas_m1_learning.py \
            apps/learnit-next/tests/atlas_m1_experience.py \
            apps/learnit-next/tests/atlas_m1_int.py \
            apps/learnit-next/tests/atlas_m2_ux_clarity.py
          do
            test -f "${path}"
            python3 "${path}"
          done

      - name: Exact-head UX handoff verdict
        shell: bash
        run: |
          set -euo pipefail
          cd "${PRODUCT_ROOT}"
          test "$(git rev-parse HEAD)" = "${TARGET_HEAD}"
          test -z "$(git status --porcelain)"
          echo 'UX_SECRET_BOUNDARY=PROVEN'
          echo 'QCM_FILL_EQUIVALENCE=PASS'
          echo 'PRODUCT_REGRESSION=NONE'
          echo 'MERGE=NOT_PERFORMED'
          echo 'CONSTRUCTED_INTEGRATION=BLOCKED_PENDING_UX_REVIEW'
