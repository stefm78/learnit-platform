name: PASSAGE Learner Integration CI
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/passage-learner-integration-ci.yml'
      - 'apps/learnit-next/dev/run_checks.py'
      - 'work-packages/PASSAGE-WP-001.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/passage-learner-integration-ci.yml'
      - 'apps/learnit-next/dev/run_checks.py'
      - 'work-packages/PASSAGE-WP-001.json'
permissions:
  contents: read
concurrency:
  group: passage-learner-r7-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  exact-passage:
    name: Exact PASSAGE learner proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact target
        id: target
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT}" == pull_request ]]; then target="${PR_HEAD}"; mode=pr
          elif [[ "${EVENT}" == push ]]; then target="${PUSH_HEAD}"; mode=push
          else echo "Unsupported event: ${EVENT}" >&2; exit 2; fi
          [[ "${target}" =~ ^[0-9a-f]{40}$ ]]
          printf 'target=%s\nmode=%s\n' "${target}" "${mode}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target }}
          fetch-depth: 0
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact R7 compatibility and artifact proof
        shell: bash
        env:
          MODE: ${{ steps.target.outputs.mode }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,tempfile
          ROOT=pathlib.Path.cwd(); target=os.environ['TARGET']; mode=os.environ['MODE']
          wp=json.loads((ROOT/'work-packages/PASSAGE-WP-001.json').read_text(encoding='utf-8'))
          def run(args,cwd=ROOT,check=True,env=None):
              d=subprocess.run(args,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,env={**os.environ,'PYTHONDONTWRITEBYTECODE':'1',**(env or {})},timeout=1200)
              if check and d.returncode: raise SystemExit(f"{' '.join(args)} failed:\n{d.stdout}")
              return d
          def call(args,cwd=ROOT,env=None): return run(args,cwd=cwd,env=env).stdout.strip()
          def git(*args,cwd=ROOT): return call(['git',*args],cwd=cwd)
          def req(x,m):
              if not x: raise SystemExit(m)
          req(git('rev-parse','HEAD')==target,'checked-out target differs')
          a=wp.get('authority',{}); req(wp.get('id')=='PASSAGE-WP-001' and a.get('learnitJob')=='PASSAGE_LEARNER_DELTA_INTEGRATION_R7' and a.get('learnitJobRevision')==7,'R7 authority differs')
          base=wp['baseline']['baseCommit']; accepted=wp['acceptedLearner']['gitCommit']; allowed=set(wp['scope']['allowedPaths']); learner=wp['learnerBlobMap']
          req(len(allowed)==3 and len(learner)==25,'R7 scope cardinality differs')
          git('fetch','--force','--no-tags','origin',base); git('fetch','--force','--no-tags','origin',accepted)
          parents=git('show','-s','--format=%P','HEAD').split()
          if mode=='pr': req(parents==[base],'candidate parent differs'); changed=set(filter(None,git('diff','--name-only',base,target).splitlines()))
          else: req(len(parents)==2 and parents[0]==base,'post-merge topology differs'); changed=set(filter(None,git('diff','--name-only',parents[0],'HEAD').splitlines()))
          req(changed==allowed,'R7 path set differs')
          for path,expected in sorted(learner.items()):
              req(git('rev-parse',f'HEAD:{path}')==expected,f'learner head differs: {path}'); req(git('rev-parse',f'{accepted}:{path}')==expected,f'accepted source differs: {path}')
          req(git('rev-parse','HEAD:apps/learnit-next/dev/run_checks_legacy.py')==wp['compatibility']['legacyRunnerBlobSha1'],'legacy runner differs')
          req(git('rev-parse','HEAD:.github/workflows/learnit-next-ci.yml')==wp['compatibility']['centralLearnitNextWorkflowBlobSha1'],'central workflow differs')
          wrapper=(ROOT/'apps/learnit-next/dev/run_checks.py').read_text(encoding='utf-8')
          req(f'CONTRACT_BASE = "{wp["compatibility"]["contractEvidenceBase"]}"' in wrapper,'CONTRACT_BASE semantic marker differs')
          req(f'CORRECTIVE_BASE = "{wp["compatibility"]["correctiveCommonBaseline"]}"' in wrapper,'CORRECTIVE_BASE semantic marker differs')
          req('branch_current_head_equals_requested_target = True' in wrapper,'branch-head semantic marker differs'); req('os.environ.get("LEARNIT_REPO_ROOT"' in wrapper,'LEARNIT_REPO_ROOT binding missing')
          central=(ROOT/'.github/workflows/learnit-next-ci.yml').read_text(encoding='utf-8')
          for line in ['git show origin/main:apps/learnit-next/dev/run_checks.py > "${runner}"','grep -q CONTRACT_BASE "${runner}"','grep -q CORRECTIVE_BASE "${runner}"','grep -q branch_current_head_equals_requested_target "${runner}"']:
              req(line in central,f'central preflight line changed: {line}')
          build=ROOT/'apps/learnit-next/build.py'
          with tempfile.TemporaryDirectory(prefix='passage-r7-build-') as raw:
              one=pathlib.Path(raw)/'one.html'; two=pathlib.Path(raw)/'two.html'; call([sys.executable,'-B',str(build),'--output',str(one)]); call([sys.executable,'-B',str(build),'--output',str(two)]); html=one.read_bytes(); req(html==two.read_bytes(),'deterministic builds differ')
          sha=hashlib.sha256(html).hexdigest(); req(len(html)==int(wp['acceptedLearner']['artifactBytes']) and sha==wp['acceptedLearner']['artifactSha256'],'accepted artifact differs')
          synthetic=None
          if mode=='pr':
              with tempfile.TemporaryDirectory(prefix='passage-r7-merge-') as raw:
                  tree=pathlib.Path(raw)/'repo'; git('worktree','add','--detach',str(tree),base)
                  try:
                      git('config','user.name','PASSAGE CI',cwd=tree); git('config','user.email','passage-ci@example.invalid',cwd=tree); git('merge','--no-ff','--no-commit',target,cwd=tree); git('commit','-m','synthetic PASSAGE R7 merge',cwd=tree)
                      materialized=pathlib.Path(raw)/'atlas-m1-run-checks.py'; materialized.write_bytes(subprocess.check_output(['git','show','HEAD:apps/learnit-next/dev/run_checks.py'],cwd=tree)); text=materialized.read_text(encoding='utf-8')
                      for token in wp['compatibility']['requiredRunnerMarkers']: req(token in text,f'central preflight token missing: {token}')
                      d=run([sys.executable,'-B',str(materialized),'--strict','--profile','wave-a-ci','--mode','post-merge','--base-ref',wp['compatibility']['waveABase']],cwd=tree,check=False,env={'LEARNIT_REPO_ROOT':str(tree)}); req(d.returncode==0,f'central-materialized synthetic runner failed:\n{d.stdout}')
                      report=json.loads((tree/'apps/learnit-next/.agent-result/run_checks.json').read_text(encoding='utf-8')); req(report.get('result')=='PASS' and report.get('verdict')=='PASS_PASSAGE_POST_MERGE','synthetic central post-merge verdict differs'); req(report.get('artifactBytes')==len(html) and report.get('artifactSha256')==sha,'synthetic central artifact differs'); synthetic=report
                  finally: git('worktree','remove','--force',str(tree))
          else:
              d=run([sys.executable,'-B','apps/learnit-next/dev/run_checks.py','--strict','--profile','wave-a-ci','--mode','post-merge','--base-ref',wp['compatibility']['waveABase']],check=False,env={'LEARNIT_REPO_ROOT':str(ROOT)}); req(d.returncode==0,f'post-merge central invocation replay failed:\n{d.stdout}'); synthetic=json.loads((ROOT/'apps/learnit-next/.agent-result/run_checks.json').read_text(encoding='utf-8')); req(synthetic.get('verdict')=='PASS_PASSAGE_POST_MERGE','post-merge runner verdict differs')
          out=ROOT/'apps/learnit-next/.agent-result'; out.mkdir(parents=True,exist_ok=True); (out/'passage-r7.html').write_bytes(html)
          proof={'schema':'learnit.passage-r7-compatibility-proof.v1','mode':mode,'target':target,'base':base,'changedPathCount':len(changed),'learnerBlobCount':len(learner),'learnerIdentity':'PASS','centralWorkflowUnchanged':'PASS','legacyRunnerUnchanged':'PASS','centralPreflightMarkers':'PASS','externalRunnerRootBinding':'PASS','deterministicBuild':True,'artifactBytes':len(html),'artifactSha256':sha,'syntheticOrActualCentralInvocation':synthetic,'verdict':'PASS'}
          (out/'passage-r7-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n',encoding='utf-8'); print(json.dumps(proof,sort_keys=True))
          PY
      - name: Upload PASSAGE R7 proof
        uses: actions/upload-artifact@v4
        with:
          name: passage-learner-r7-${{ steps.target.outputs.target }}
          path: |
            apps/learnit-next/.agent-result/passage-r7-proof.json
            apps/learnit-next/.agent-result/passage-r7.html
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
