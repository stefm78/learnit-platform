name: Learn-it Next Pages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/learnit-next-pages.yml'
      - 'work-packages/OPS-WP-016.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/learnit-next-pages.yml'
      - 'work-packages/OPS-WP-016.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: learnit-next-pages
  cancel-in-progress: false

env:
  LEARNER_PROMOTED_HEAD: 4eebdef9fb0014c2e4a965e0c1e78d127dd712f4
  LEARNER_EXPECTED_SHA256: 4b50af3dfe8820d258eaa73999b8a7e52b4991584d27986dca7e647af608f6d7
  LEARNER_EXPECTED_BYTES: '366412'
  M3_1_PROMOTED_MAIN: be3d5b2635836e8ce0d9a6ecf42d573efc9ef749
  FROZEN_PRODUCT_HEAD: 6fa1acc23999b5a0b9a0b7f375a12f19ecc4e4e2
  FROZEN_QA_HEAD: 6ff592af68e6cc95bd479911a09388293c5528f5

jobs:
  verify:
    name: Verify stable M3.1 Pages package
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      site_artifact: ${{ steps.names.outputs.site_artifact }}
    steps:
      - name: Checkout exact promoted M3.1 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.M3_1_PROMOTED_MAIN }}
          fetch-depth: 0
          clean: true

      - name: Prove exact promoted M3.1 product identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$M3_1_PROMOTED_MAIN" ]]
          for path in             work-packages/ATLAS-WP-012.json             authoring/v2/atlas/pedagogical_quality.py             authoring/skills/SKILL_ATLAS_KIT_AUTHORING_V1.md             authoring/studio/core.py             authoring/studio/web/index.html             authoring/studio/web/studio.css             authoring/studio/web/studio.js             authoring/studio/pages/build_pages.py             authoring/studio/pages/pages-bootstrap.js             authoring/studio/tests/test_m3_1_pedagogical_quality.py             .github/workflows/atlas-m3-1-pedagogical-quality-ci.yml; do
              [[ "$(git rev-parse "$FROZEN_PRODUCT_HEAD:$path")" == "$(git rev-parse "HEAD:$path")" ]] || exit 1
          done

      - name: Materialize exact independent QA worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "$FROZEN_QA_HEAD"
          [[ "$(git merge-base "$FROZEN_PRODUCT_HEAD" "$FROZEN_QA_HEAD")" == "$FROZEN_PRODUCT_HEAD" ]]
          qa="$RUNNER_TEMP/qa"
          git worktree add --detach "$qa" "$FROZEN_QA_HEAD"
          echo "QA_TREE=$qa" >> "$GITHUB_ENV"
          python - <<'PY'
          import os, subprocess
          expected={
            'work-packages/QA-WP-021.json',
            'authoring/studio/tests/qa_m3_1_pedagogical_quality.py',
            '.github/workflows/atlas-m3-1-pedagogical-quality-qa.yml',
          }
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',os.environ['FROZEN_PRODUCT_HEAD']+'...'+os.environ['FROZEN_QA_HEAD']],
              text=True,
          ).splitlines())
          assert changed==expected, sorted(changed)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Re-run M3.1 and compatible inherited product proof
        shell: bash
        run: |
          set -euo pipefail
          python -B authoring/v2/validate_kit.py             authoring/v2/atlas/nombres_complexes_atlas.json             authoring/v2/atlas/signaux_electriques_atlas.json
          python -B authoring/v2/atlas/validate_atlas_content.py
          python -B authoring/studio/tests/test_m3_1_pedagogical_quality.py
          python -B authoring/studio/tests/test_m3_authoring_foundation.py
          # Historical M3 Pages candidate includes a frozen-M3.0 identity assertion.
          # M3.1 Pages/Pyodide behavior is covered by the M3.1 product and QA oracles.
          cd "$QA_TREE"
          python -B authoring/studio/tests/qa_m3_1_pedagogical_quality.py

      - name: Assemble deterministic stable site
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          site="$RUNNER_TEMP/stable-site"
          learner="$RUNNER_TEMP/learner-source"
          authoring_a="$RUNNER_TEMP/authoring-a"
          authoring_b="$RUNNER_TEMP/authoring-b"
          mkdir -p "$site"

          python -B authoring/studio/pages/build_pages.py --output "$authoring_a"
          python -B authoring/studio/pages/build_pages.py --output "$authoring_b"
          diff -qr "$authoring_a" "$authoring_b"
          cmp authoring/v2/atlas/pedagogical_quality.py             "$authoring_a/_authority/authoring/v2/atlas/pedagogical_quality.py"

          git worktree add --detach "$learner" "$LEARNER_PROMOTED_HEAD"
          python -B "$learner/apps/learnit-next/build.py" --output "$site/index.html"
          cp "$site/index.html" "$site/learnit-next.html"
          actual_sha="$(sha256sum "$site/index.html" | awk '{print $1}')"
          actual_bytes="$(wc -c < "$site/index.html" | tr -d ' ')"
          [[ "$actual_sha" == "$LEARNER_EXPECTED_SHA256" ]]
          [[ "$actual_bytes" == "$LEARNER_EXPECTED_BYTES" ]]
          cmp "$site/index.html" "$site/learnit-next.html"

          cp -a "$authoring_a" "$site/authoring"
          authoring_sha="$(sha256sum "$site/authoring/index.html" | awk '{print $1}')"
          quality_sha="$(sha256sum authoring/v2/atlas/pedagogical_quality.py | awk '{print $1}')"

          cat > "$site/deployment-evidence.json" <<EOF
          {
            "schema": "learnit.next.pages.deployment.v3",
            "learnerPromotedHead": "$LEARNER_PROMOTED_HEAD",
            "learnerArtifactBytes": $LEARNER_EXPECTED_BYTES,
            "learnerArtifactSha256": "$LEARNER_EXPECTED_SHA256",
            "m3_1PromotedMain": "$M3_1_PROMOTED_MAIN",
            "frozenProductHead": "$FROZEN_PRODUCT_HEAD",
            "frozenQaHead": "$FROZEN_QA_HEAD",
            "qualityEngineSha256": "$quality_sha",
            "authoringIndexSha256": "$authoring_sha",
            "authoringPath": "/authoring/",
            "learnerIndexByteIdentity": "PASS",
            "stableAuthoringPublication": true,
            "humanUxDebtIssue": 272,
            "runtimeBackendDependencyAdded": false
          }
          EOF

          echo "STABLE_SITE=$site" >> "$GITHUB_ENV"

      - name: Name immutable stable site artifact
        id: names
        shell: bash
        run: echo "site_artifact=learnit-stable-pages-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload verified stable site
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.site_artifact }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ env.STABLE_SITE }}

  deploy:
    name: Deploy stable learner plus M3.1 authoring
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download immutable verified site
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify.outputs.site_artifact }}
          path: ${{ runner.temp }}/stable-site

      - name: Recheck stable site identity
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/stable-site"
          actual_sha="$(sha256sum "$site/index.html" | awk '{print $1}')"
          actual_bytes="$(wc -c < "$site/index.html" | tr -d ' ')"
          [[ "$actual_sha" == "$LEARNER_EXPECTED_SHA256" ]]
          [[ "$actual_bytes" == "$LEARNER_EXPECTED_BYTES" ]]
          cmp "$site/index.html" "$site/learnit-next.html"
          grep -q '"m3_1PromotedMain": "'"$M3_1_PROMOTED_MAIN"'"' "$site/deployment-evidence.json"
          grep -q '"stableAuthoringPublication": true' "$site/deployment-evidence.json"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload stable Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/stable-site

      - name: Deploy stable learner plus M3.1 authoring
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post-deploy live smoke
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/stable-site"
          expected_authoring_sha="$(sha256sum "$site/authoring/index.html" | awk '{print $1}')"
          ok=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "$PAGE_URL" -o "$RUNNER_TEMP/live-index.html"               && curl --fail --silent --show-error "${PAGE_URL}authoring/" -o "$RUNNER_TEMP/live-authoring.html"               && curl --fail --silent --show-error "${PAGE_URL}authoring/pages-evidence.json" -o "$RUNNER_TEMP/live-pages-evidence.json"               && curl --fail --silent --show-error "${PAGE_URL}deployment-evidence.json" -o "$RUNNER_TEMP/live-deployment-evidence.json"; then
              live_sha="$(sha256sum "$RUNNER_TEMP/live-index.html" | awk '{print $1}')"
              live_bytes="$(wc -c < "$RUNNER_TEMP/live-index.html" | tr -d ' ')"
              live_authoring_sha="$(sha256sum "$RUNNER_TEMP/live-authoring.html" | awk '{print $1}')"
              if [[ "$live_sha" == "$LEARNER_EXPECTED_SHA256"                     && "$live_bytes" == "$LEARNER_EXPECTED_BYTES"                     && "$live_authoring_sha" == "$expected_authoring_sha" ]]                  && cmp "$RUNNER_TEMP/live-pages-evidence.json" "$site/authoring/pages-evidence.json"                  && cmp "$RUNNER_TEMP/live-deployment-evidence.json" "$site/deployment-evidence.json"; then
                ok=1
                break
              fi
            fi
            sleep 3
          done
          [[ "$ok" == 1 ]]
          cat > "$RUNNER_TEMP/stable-live-evidence.json" <<EOF
          {
            "schema": "learnit.next.pages.stable-live.v1",
            "result": "PASS",
            "m3_1PromotedMain": "$M3_1_PROMOTED_MAIN",
            "frozenProductHead": "$FROZEN_PRODUCT_HEAD",
            "frozenQaHead": "$FROZEN_QA_HEAD",
            "learnerSha256": "$LEARNER_EXPECTED_SHA256",
            "liveLearner": "PASS",
            "liveAuthoring": "PASS",
            "livePagesEvidenceIdentity": "PASS",
            "stableAuthoringPublication": true
          }
          EOF

      - name: Upload stable live evidence
        uses: actions/upload-artifact@v4
        with:
          name: learnit-stable-pages-live-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/stable-live-evidence.json
