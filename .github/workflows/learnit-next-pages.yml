name: Learn-it Next Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/learnit-next-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: learnit-next-pages
  cancel-in-progress: false

env:
  PROMOTED_HEAD: dd0c191179f968d35742cb58f7d6bb9ccb53a852
  EXPECTED_SHA256: 7c242614c394ca1a0eb739c0f02c672c6afe280a128056a8f75b96266727a091
  EXPECTED_BYTES: '352237'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact promoted M2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROMOTED_HEAD }}
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and verify canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${PROMOTED_HEAD}" ]]

          mkdir -p "${RUNNER_TEMP}/learnit-pages"
          artifact="${RUNNER_TEMP}/learnit-pages/learnit-next.html"
          python -B apps/learnit-next/build.py --output "${artifact}"

          actual_sha="$(sha256sum "${artifact}" | awk '{print $1}')"
          actual_bytes="$(wc -c < "${artifact}" | tr -d ' ')"
          [[ "${actual_sha}" == "${EXPECTED_SHA256}" ]]
          [[ "${actual_bytes}" == "${EXPECTED_BYTES}" ]]

          site="${RUNNER_TEMP}/learnit-pages/site"
          mkdir -p "${site}"
          cp "${artifact}" "${site}/index.html"
          cp "${artifact}" "${site}/learnit-next.html"
          cmp "${site}/index.html" "${site}/learnit-next.html"

          cat > "${site}/deployment-evidence.json" <<EOF
          {
            "schema": "learnit.next.pages.deployment.v1",
            "promotedHead": "${PROMOTED_HEAD}",
            "artifactBytes": ${EXPECTED_BYTES},
            "artifactSha256": "${EXPECTED_SHA256}",
            "indexByteIdentity": "PASS",
            "runtimeBackendDependencyAdded": false
          }
          EOF

          {
            echo "## Learn-it Next Pages deployment"
            echo ""
            echo "- promoted head: \`${PROMOTED_HEAD}\`"
            echo "- artifact bytes: \`${actual_bytes}\`"
            echo "- artifact SHA-256: \`${actual_sha}\`"
            echo "- index/download byte identity: \`PASS\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/learnit-pages/site

      - name: Deploy exact promoted artifact
        id: deployment
        uses: actions/deploy-pages@v4
