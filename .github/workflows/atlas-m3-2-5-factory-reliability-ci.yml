name: Atlas M3.2.5 Factory Reliability CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-m3-2-5-reliability-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  reliability:
    name: M3.2.5 Factory Reliability exact-head evidence
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'atlas/ATLAS-WP-015-m3-2-5-factory-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reliability head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Bind exact baseline and scope
        shell: bash
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          BASE=39775e83d029f780bf0fa21783ea597ab1abc6b5
          SCOPE_BASE="${PR_BASE_SHA:-$BASE}"
          [[ "$(git rev-parse HEAD)" == "$TARGET" ]]
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$SCOPE_BASE^{commit}"
          [[ "$(git merge-base "$BASE" HEAD)" == "$BASE" ]]
          [[ "$(git merge-base "$SCOPE_BASE" HEAD)" == "$SCOPE_BASE" ]]
          export SCOPE_BASE
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          wp=json.loads(Path('work-packages/ATLAS-WP-015.json').read_text(encoding='utf-8'))
          assert wp['id']=='ATLAS-WP-015'
          assert wp['authority']['issue']==297
          assert wp['baseline']['baseCommit']=='39775e83d029f780bf0fa21783ea597ab1abc6b5'
          allowed=set(wp['scope']['allowedPaths'])
          changed=set(subprocess.check_output(
              ['git','diff','--name-only',os.environ['SCOPE_BASE']+'...HEAD'], text=True
          ).splitlines())
          assert changed==allowed, f'ATLAS_WP_015_SCOPE_MISMATCH:{sorted(changed)} != {sorted(allowed)}'
          assert len(changed)==7
          print('ATLAS_WP_015_SCOPE=PASS')
          PY

      - name: Prove promoted M3.2 authority untouched
        shell: bash
        run: |
          set -euo pipefail
          BASE=39775e83d029f780bf0fa21783ea597ab1abc6b5
          git diff --exit-code "$BASE"...HEAD --             authoring/factory/factory_gate.py             authoring/skills             authoring/v2             contracts             apps             governance
          echo 'M3_2_PROMOTED_AUTHORITY_UNCHANGED=PASS'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install declared test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt

      - name: Validate repository and canonical Atlas content
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/validate_repository.py
          python -B authoring/v2/validate_kit.py             authoring/v2/atlas/nombres_complexes_atlas.json             authoring/v2/atlas/signaux_electriques_atlas.json
          python -B authoring/v2/atlas/validate_atlas_content.py

      - name: Re-run promoted M3.2 product oracle
        run: python -B authoring/factory/tests/test_ai_kit_factory.py

      - name: Run M3.2.5 reliability oracle
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile authoring/factory/reliability.py authoring/factory/tests/test_factory_reliability.py
          python -B authoring/factory/tests/test_factory_reliability.py

      - name: Validate executable benchmark contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from authoring.factory import reliability
          contract=json.loads(Path('authoring/factory/benchmark_contract.json').read_text(encoding='utf-8'))
          reliability.validate_benchmark_contract(contract)
          assert contract['minimumRuns'] >= len(contract['requiredDomains'])
          assert contract['minimumPass'] >= 2
          assert contract['minimumHold'] >= 2
          assert contract['maximumHumanEscalationRate'] <= 0.25
          print('M3_2_5_BENCHMARK_CONTRACT=PASS')
          PY

      - name: Prove local read-only reliability boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -REn '\b(requests|httpx|aiohttp)\b|urllib\.request|socket\.|WebSocket|XMLHttpRequest|EventSource'             authoring/factory/reliability.py
          ! grep -En '\.write_text\(|\.write_bytes\(|(^|[^A-Za-z])open\('             authoring/factory/reliability.py
          ! grep -REni '\b(pypdf|pdfplumber|pymupdf|fitz|tesseract|ocr)\b'             authoring/factory/reliability.py
          echo 'M3_2_5_RELIABILITY_BOUNDARY=PASS'

      - name: Diff hygiene
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          SCOPE_BASE="${PR_BASE_SHA:-39775e83d029f780bf0fa21783ea597ab1abc6b5}"
          git diff --check "$SCOPE_BASE"...HEAD

      - name: Write exact M3.2.5 evidence
        if: success()
        shell: bash
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          proof={
            'schema':'learnit.atlas.m3_2_5.factory-reliability.product-evidence.v1',
            'result':'PASS',
            'verdict':'PASS_ATLAS_M3_2_5_FACTORY_RELIABILITY_PRODUCT_HEAD',
            'workPackage':'ATLAS-WP-015',
            'authorityIssue':297,
            'head':os.environ['TARGET'],
            'baseline':'39775e83d029f780bf0fa21783ea597ab1abc6b5',
            'm3_2FactoryGateUnchanged':True,
            'reliabilitySha256':hashlib.sha256(Path('authoring/factory/reliability.py').read_bytes()).hexdigest(),
            'benchmarkContractSha256':hashlib.sha256(Path('authoring/factory/benchmark_contract.json').read_bytes()).hexdigest(),
            'resourceIdentity':'resourceId+version+sha256',
            'minimumBenchmarkRuns':8,
            'minimumPass':2,
            'minimumHold':2,
            'networkRequired':False,
            'inputMutation':False,
            'sourceIngestion':False,
          }
          out=Path(os.environ['RUNNER_TEMP'])/'atlas_m3_2_5_factory_reliability.json'
          out.write_text(json.dumps(proof,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY

      - name: Upload exact M3.2.5 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-m3-2-5-factory-reliability-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/atlas_m3_2_5_factory_reliability.json
