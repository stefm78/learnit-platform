name: PASSAGE V6 Consumption Closure R2

on:
  push:
    branches: [passage/v6-consumption-closure-r2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passage-v6-consumption-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head V6 consumer qualification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Bind R2 authority and exact scope
        shell: bash
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BASE=10f058c4693fb72439a13feb3abfd45db43f9b42
          [[ "$(git rev-parse HEAD)" == "$TARGET" ]]
          [[ "$(git merge-base "$BASE" HEAD)" == "$BASE" ]]
          python - <<'PY'
          import subprocess
          base='10f058c4693fb72439a13feb3abfd45db43f9b42'
          changed=set(subprocess.check_output(['git','diff','--name-only',base+'...HEAD'],text=True).splitlines())
          allowed={
            '.github/workflows/passage-v6-consumption-closure-ci.yml',
            'apps/learnit-next/source_manifest.json',
            'apps/learnit-next/src/core/activity_semantics.js',
            'apps/learnit-next/src/integration/atlas/activity_projection.js',
            'apps/learnit-next/src/integration/atlas/import_adapter.js',
            'apps/learnit-next/src/ui/activity_presenters.js',
            'apps/learnit-next/tests/passage_v6_consumption.py',
            'work-packages/PASSAGE-WP-002.json',
          }
          assert changed == allowed, f'PASSAGE_WP_002_SCOPE_MISMATCH:{sorted(changed)} != {sorted(allowed)}'
          print('PASSAGE_WP_002_CHANGED='+','.join(sorted(changed)))
          PY

      - name: Prove producer and V2-V5 firewall unchanged
        shell: bash
        run: |
          set -euo pipefail
          BASE=10f058c4693fb72439a13feb3abfd45db43f9b42
          git diff --exit-code "$BASE"...HEAD -- \
            contracts/learnit-kit-v6.schema.json \
            authoring/v6 \
            authoring/factory \
            apps/learnit-next/src/core/contract.js \
            apps/learnit-next/src/core/import.js

      - name: Verify deterministic source manifest read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest_path=Path('apps/learnit-next/source_manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          expected={
            'apps/learnit-next/src/integration/atlas/import_adapter.js':'49874783671cfc9a57a9333dbd5a59fa2c4b3c67',
            'apps/learnit-next/src/core/activity_semantics.js':'b31807c7f48f3de9710b93d1518a863b09c3d45b',
            'apps/learnit-next/src/integration/atlas/activity_projection.js':'793b6a0f27d02bcb24b0b946d59c5a7c782bba41',
            'apps/learnit-next/src/ui/activity_presenters.js':'6700be900223f59ced10db857273263e3f43097f',
          }
          items={item['path']:item for item in manifest['workingFiles']}
          def blob_sha1(path):
              data=Path(path).read_bytes()
              return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for path, expected_sha in expected.items():
              item=items[path]
              assert item['fingerprint']=={'kind':'git-blob-sha1','value':expected_sha}, (path,item['fingerprint'])
              assert blob_sha1(path)==expected_sha, (path,blob_sha1(path),expected_sha)
          self_item=items['apps/learnit-next/source_manifest.json']
          declared=self_item['fingerprint']
          assert declared['kind']=='canonical-self-sha256'
          clone=json.loads(json.dumps(manifest))
          for item in clone['workingFiles']:
              if item['path']=='apps/learnit-next/source_manifest.json':
                  item['fingerprint']['value']=None
                  break
          canonical=json.dumps(clone,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
          calculated=hashlib.sha256(canonical).hexdigest()
          assert calculated==declared['value'], (calculated,declared['value'])
          assert calculated=='6f32c08d5c4042c9daac197a49373c5e1050397b16893c23100450face7f3134'
          print('SOURCE_MANIFEST_SELF_SHA256='+calculated)
          PY
          git diff --exit-code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Build twice deterministically
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "$RUNNER_TEMP/learnit-a.html"
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "$RUNNER_TEMP/learnit-b.html"
          cmp "$RUNNER_TEMP/learnit-a.html" "$RUNNER_TEMP/learnit-b.html"
          bytes="$(wc -c < "$RUNNER_TEMP/learnit-a.html" | tr -d ' ')"
          sha="$(sha256sum "$RUNNER_TEMP/learnit-a.html" | awk '{print $1}')"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "LEARNER_BYTES=$bytes"
          echo "LEARNER_SHA256=$sha"
          mkdir -p apps/learnit-next/dist
          cp "$RUNNER_TEMP/learnit-a.html" apps/learnit-next/dist/learnit-next.html
          cmp "$RUNNER_TEMP/learnit-a.html" apps/learnit-next/dist/learnit-next.html

      - name: Materialize all manifest-declared regression support
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path('apps/learnit-next/source_manifest.json').read_text(encoding='utf-8'))
          materialized=[]
          for item in manifest['workingFiles']:
              path_text=item['path']
              if path_text=='apps/learnit-next/source_manifest.json':
                  continue
              path=Path(path_text)
              if path.is_file():
                  continue
              fingerprint=item.get('fingerprint',{})
              assert fingerprint.get('kind')=='git-blob-sha1', path_text
              data=subprocess.run(['git','cat-file','blob',fingerprint['value']],check=True,stdout=subprocess.PIPE).stdout
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
              materialized.append(path_text)
          print('MATERIALIZED_DECLARED_SUPPORT='+str(len(materialized)))
          for path in materialized:
              print(path)
          PY

      - name: Prove stale Wave A storage oracle is baseline-identical
        shell: bash
        run: |
          set -euo pipefail
          BASE=10f058c4693fb72439a13feb3abfd45db43f9b42
          PATHNAME=apps/learnit-next/src/ports/storage.js
          git diff --exit-code "$BASE"...HEAD -- "$PATHNAME"
          grep -q 'NEXT_INDEXED_DB_VERSION = 3' "$PATHNAME"
          git show "$BASE:$PATHNAME" | grep -q 'NEXT_INDEXED_DB_VERSION = 3'
          grep -q 'NEXT_INDEXED_DB_VERSION = 2' apps/learnit-next/tests/dev_learning_loop_v2_platform.py
          echo BASELINE_IDENTICAL_STORAGE_V3_AND_STALE_WAVE_A_EXPECTATION_V2

      - name: Replay preserved V2-V5 runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          python -B apps/learnit-next/tests/contract_v2.py
          python -B apps/learnit-next/tests/storage_isolation.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_learning.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_authoring.py
          python -B apps/learnit-next/tests/dev_learning_loop_v2_ui.py
          python -B apps/learnit-next/tests/atlas_m1_core.py
          python -B apps/learnit-next/tests/atlas_m1_int.py

      - name: Prove generic V6 consumer closure in Node and Chromium
        shell: bash
        env:
          LEARNIT_V6_ARTIFACT: ${{ runner.temp }}/learnit-a.html
        run: python -B apps/learnit-next/tests/passage_v6_consumption.py

      - name: Exact-head hygiene gate
        shell: bash
        run: |
          set -euo pipefail
          BASE=10f058c4693fb72439a13feb3abfd45db43f9b42
          git diff --check "$BASE"...HEAD
          git diff --exit-code

      - name: Write exact-head qualification proof
        shell: bash
        env:
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_BYTES: ${{ steps.build.outputs.bytes }}
          BUILD_SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          proof={
            'schema':'learnit.passage.v6-consumption.exact-head-proof.r2',
            'result':'PASS',
            'verdict':'PASS_PASSAGE_V6_CONSUMPTION_EXACT_HEAD_R2',
            'head':os.environ['TARGET'],
            'baseline':'10f058c4693fb72439a13feb3abfd45db43f9b42',
            'contract':'learnit.kit.v6',
            'sourceManifestSelfSha256':'6f32c08d5c4042c9daac197a49373c5e1050397b16893c23100450face7f3134',
            'learnerArtifactBytes':int(os.environ['BUILD_BYTES']),
            'learnerArtifactSha256':os.environ['BUILD_SHA256'],
            'nativeV6Storage':True,
            'v5Conversion':False,
            'productiveEvaluatorKinds':['numeric-tolerance','canonical-expression-set','required-concepts'],
            'preservedContracts':['learnit.kit.v2','learnit.kit.v3','learnit.kit.v4','learnit.kit.v5'],
            'producerFirewallUnchanged':True,
            'baselineStorageVersion':3,
            'staleWaveAStorageOracleExpectedVersion':2,
            'sourceTreeCleanAfterQualification':True,
          }
          out=Path(os.environ['RUNNER_TEMP'])/'passage-v6-consumption-proof.json'
          out.write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY
          echo PASS_PASSAGE_V6_CONSUMPTION_EXACT_HEAD_R2

      - name: Upload exact-head qualification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passage-v6-consumption-exact-head-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/passage-v6-consumption-proof.json
            ${{ runner.temp }}/learnit-a.html
          if-no-files-found: error
          retention-days: 14
