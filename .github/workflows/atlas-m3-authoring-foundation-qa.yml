name: Atlas M3 Authoring Foundation QA

on:
  pull_request:
    branches:
      - main
      - atlas/ATLAS-WP-009-m3-authoring-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-m3-authoring-qa-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  oracle-preparation:
    name: QA-WP-018 independent oracle preparation
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'qa/QA-WP-018-m3-authoring-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove independent preparation scope and compile oracle
        shell: bash
        run: |
          set -euo pipefail
          BASE=c8e6e2a01a9a517f0aa7bdbfc2e01a600d2f30ba
          [[ "$(git merge-base "${BASE}" HEAD)" == "${BASE}" ]]
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          wp=json.loads(Path('work-packages/QA-WP-018.json').read_text(encoding='utf-8'))
          assert wp['id']=='QA-WP-018'
          assert wp['status']=='in-progress'
          assert wp['baseline']['productHead'] is None
          allowed=set(wp['scope']['allowedPaths'])
          changed=set(subprocess.check_output(['git','diff','--name-only','c8e6e2a01a9a517f0aa7bdbfc2e01a600d2f30ba...HEAD'],text=True).splitlines())
          assert changed<=allowed, sorted(changed-allowed)
          PY
          python -m py_compile authoring/studio/tests/qa_m3_authoring_foundation.py
          echo 'PRE_CANDIDATE_QA_READY'

  final-contradictory-qa:
    name: QA-WP-018 exact-head contradictory QA
    if: github.event_name == 'pull_request' && github.base_ref == 'atlas/ATLAS-WP-009-m3-authoring-foundation' && startsWith(github.head_ref, 'qa/QA-WP-018-m3-authoring-foundation-final')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          clean: true

      - name: Bind exact frozen product head and QA-only diff
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT_HEAD=$(python - <<'PY'
          import json
          from pathlib import Path
          wp=json.loads(Path('work-packages/QA-WP-018.json').read_text(encoding='utf-8'))
          print(wp['baseline']['productHead'])
          PY
          )
          PRODUCT_SHA=$(python - <<'PY'
          import json
          from pathlib import Path
          wp=json.loads(Path('work-packages/QA-WP-018.json').read_text(encoding='utf-8'))
          print(wp['baseline']['productArtifactSha256'])
          PY
          )
          [[ "${PRODUCT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PRODUCT_SHA}" =~ ^[0-9a-f]{64}$ ]]
          git cat-file -e "${PRODUCT_HEAD}^{commit}"
          [[ "$(git merge-base "${PRODUCT_HEAD}" HEAD)" == "${PRODUCT_HEAD}" ]]
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          wp=json.loads(Path('work-packages/QA-WP-018.json').read_text(encoding='utf-8'))
          assert wp['id']=='QA-WP-018'
          assert wp['status']=='in-progress'
          product=wp['baseline']['productHead']
          allowed=set(wp['scope']['allowedPaths'])
          changed=set(subprocess.check_output(['git','diff','--name-only',f'{product}...HEAD'],text=True).splitlines())
          assert changed==allowed, {'changed':sorted(changed),'expected':sorted(allowed)}
          product_changed=set(subprocess.check_output(['git','diff','--name-only','c8e6e2a01a9a517f0aa7bdbfc2e01a600d2f30ba...'+product],text=True).splitlines())
          product_allowed=set(json.loads(Path('work-packages/ATLAS-WP-009.json').read_text(encoding='utf-8'))['scope']['allowedPaths'])
          assert product_changed<=product_allowed, sorted(product_changed-product_allowed)
          PY
          echo "product_head=${PRODUCT_HEAD}" >> "${GITHUB_OUTPUT}"
          echo "product_sha=${PRODUCT_SHA}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install declared QA dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r apps/player/requirements-test.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Execute independent contradictory oracle
        env:
          ATLAS_M3_QA_STRICT: '1'
          ATLAS_M3_PRODUCT_HEAD: ${{ steps.binding.outputs.product_head }}
          ATLAS_M3_PRODUCT_SOURCE_SHA256: ${{ steps.binding.outputs.product_sha }}
        run: python -B authoring/studio/tests/qa_m3_authoring_foundation.py

      - name: Re-run frozen canonical validators independently
        shell: bash
        run: |
          set -euo pipefail
          python -B authoring/v2/validate_kit.py \
            authoring/v2/atlas/nombres_complexes_atlas.json \
            authoring/v2/atlas/signaux_electriques_atlas.json
          python -B authoring/v2/atlas/validate_atlas_content.py

      - name: Materialize exact declared learner projection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          manifest=json.loads(Path('apps/learnit-next/source_manifest.json').read_text(encoding='utf-8'))
          for item in manifest['workingFiles']:
              path=Path(item['path'])
              if path.is_file() or item.get('fingerprint',{}).get('kind')!='git-blob-sha1':
                  continue
              data=subprocess.run(['git','cat-file','blob',item['fingerprint']['value']],check=True,stdout=subprocess.PIPE).stdout
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          PY

      - name: Run learner regression boundary
        shell: bash
        run: |
          set -euo pipefail
          python -B apps/learnit-next/tests/contract_v2.py
          python -B apps/learnit-next/tests/storage_isolation.py
          python -B apps/learnit-next/tests/atlas_m1_content.py
          python -B apps/learnit-next/tests/atlas_m1_int.py
          python -B apps/learnit-next/tests/atlas_m2_memory.py
          python -B apps/learnit-next/tests/atlas_m2_transfer.py
          python -B apps/learnit-next/tests/atlas_m2_ux_clarity.py
          rm -rf apps/learnit-next/dist
          python -B apps/learnit-next/build.py --output "${RUNNER_TEMP}/learner.html"
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          data=(Path(os.environ['RUNNER_TEMP'])/'learner.html').read_bytes()
          assert len(data)==366412, len(data)
          assert hashlib.sha256(data).hexdigest()=='4b50af3dfe8820d258eaa73999b8a7e52b4991584d27986dca7e647af608f6d7'
          PY
          mkdir -p apps/learnit-next/dist
          cp "${RUNNER_TEMP}/learner.html" apps/learnit-next/dist/learnit-next.html

      - name: Strict browser import regression on unchanged learner artifact
        env:
          LEARNIT_NEXT_STRICT_INTEGRATION: '1'
        run: python -B apps/learnit-next/tests/browser_vertical_slice.py

      - name: Diff hygiene
        run: git diff --check ${{ steps.binding.outputs.product_head }}...HEAD

      - name: Write final exact-head QA evidence
        if: success()
        shell: bash
        env:
          PRODUCT_HEAD: ${{ steps.binding.outputs.product_head }}
          PRODUCT_SHA: ${{ steps.binding.outputs.product_sha }}
          QA_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          proof={
            'schema':'learnit.atlas.m3.authoring-foundation.qa-evidence.v1',
            'result':'PASS',
            'verdict':'PASS_QA_WP_018_EXACT_HEAD_CONTRADICTORY_QA',
            'workPackage':'QA-WP-018',
            'authorityIssue':233,
            'productHead':os.environ['PRODUCT_HEAD'],
            'productArtifactSha256':os.environ['PRODUCT_SHA'],
            'qaHead':os.environ['QA_HEAD'],
            'qaOnlyDiff':True,
            'canonicalNoOpIdentity':'PASS',
            'revisionAndLineageAdversarial':'PASS',
            'claimAndDigestAdversarial':'PASS',
            'blockingValidation':'PASS',
            'storageIsolation':'PASS',
            'loopbackNoNetwork':'PASS',
            'browserAuthoringLoop':'PASS',
            'learnerArtifactIdentity':'PASS',
            'learnerBrowserRegression':'PASS',
          }
          out=Path(os.environ['RUNNER_TEMP'])/'atlas_m3_authoring_qa.json'
          out.write_text(json.dumps(proof,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          print(json.dumps(proof,indent=2,sort_keys=True))
          PY

      - name: Upload final QA evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-m3-authoring-qa-${{ github.event.pull_request.head.sha }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/atlas_m3_authoring_qa.json
