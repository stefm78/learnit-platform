name: LearnIT V6 single Pages publication
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/activity-explorer/**'
      - '.github/workflows/activity-explorer-qualification.yml'
      - '.github/workflows/learnit-v6-root-promotion.yml'
      - 'work-packages/OPS-WP-033.json'
  push:
    branches: [main]
    paths:
      - 'tools/activity-explorer/**'
      - '.github/workflows/activity-explorer-qualification.yml'
      - '.github/workflows/learnit-v6-root-promotion.yml'
      - 'work-packages/OPS-WP-033.json'
permissions:
  contents: read
concurrency:
  group: learnit-v6-unique-pages-publisher
  cancel-in-progress: false
env:
  FROZEN_BASE: '8354e775db99f9bd239787c7b0c7b4e630e1f067'
  RELEASE_TITLE: 'release(activity-explorer): single Pages 2026-11-01'
  ROOT_SHA: '4390d2f525ba1779e681a30f7c853f391094b9d1b85ce7b13f230efcf5be01eb'
  ROOT_BYTES: '626416'
jobs:
  qualify:
    name: Qualify exact 60-route Explorer candidate without modifying renderer
    if: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 510) || (github.event_name == 'push' && github.event.head_commit.message == 'release(activity-explorer): single Pages 2026-11-01') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR510 exact source scope, one-shot merge, only one Pages publisher
        shell: bash
        env:
          PR_NO: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          MERGE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$FROZEN_BASE" HEAD
          python - <<'PY'
          import json,os,subprocess,re
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          base=os.environ['FROZEN_BASE']
          allowed=sorted([
            '.github/workflows/activity-explorer-qualification.yml',
            '.github/workflows/learnit-v6-root-promotion.yml',
            'tools/activity-explorer/README.md',
            'tools/activity-explorer/explorer.css',
            'tools/activity-explorer/explorer.js',
            'tools/activity-explorer/index.html',
            'tools/activity-explorer/stage_pages.py',
            'tools/activity-explorer/tests/test_browser.py',
            'tools/activity-explorer/tests/test_structure.py',
            'work-packages/OPS-WP-033.json'
          ])
          assert sorted(git('diff','--name-only',base,'HEAD').splitlines())==allowed
          wp=json.loads(Path('work-packages/OPS-WP-033.json').read_text())
          assert wp['id']=='OPS-WP-033' and wp['status']=='proposed'
          assert wp['baseline']['baseCommit']==base and wp['baseline']['prNumber']==510
          assert wp['authority']['mergeGO']=='USER_EXPLICIT_MERGE_PR510_AFTER_REVALIDATION_2026-11-01'
          assert wp['authority']['productionGO']=='USER_EXPLICIT_SINGLE_PUBLISHER_60_ROUTE_PAGES_RELEASE_2026-11-01'
          assert wp['authority']['releaseMergeTitle']==os.environ['RELEASE_TITLE']
          workflows=sorted(Path('.github/workflows').glob('*.yml'))
          assert len(workflows)==40
          publishers=[p for p in workflows if re.search(r'(?m)^\s*uses:\s*actions/deploy-pages@v4\s*$',p.read_text())]
          assert publishers==[Path('.github/workflows/learnit-v6-root-promotion.yml')],publishers
          if os.environ['GITHUB_EVENT_NAME']=='pull_request':
            assert os.environ['PR_NO']=='510'
            assert os.environ['PR_BASE']==base and os.environ['PR_HEAD']==git('rev-parse','HEAD')
            assert os.environ['PR_BRANCH']=='feature/learnit-activity-explorer-canonical-r1-20261101'
            assert os.environ['PR_REPO']=='stefm78/learnit-platform'
          else:
            assert os.environ['GITHUB_EVENT_NAME']=='push'
            assert os.environ['GITHUB_REF']=='refs/heads/main'
            assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
            assert os.environ['MERGE_MESSAGE'].splitlines()[0]==os.environ['RELEASE_TITLE']
            assert git('rev-parse','HEAD^1')==base
            assert len(git('show','-s','--format=%P','HEAD').split())==2
            assert sorted(git('diff','--name-only',base,'HEAD^2').splitlines())==allowed
          print('PASS_EXACT_HUMAN_GO_SOURCE_DIFF_10_AND_ONE_PUBLISHER')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual browser engine
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify actual existing renderer, media and navigation
        run: |
          python -m unittest discover -s tools/activity-explorer/tests -p test_structure.py -v
          python tools/activity-explorer/tests/test_browser.py
      - name: Reproduce currently deployed V6 root byte for byte
        shell: bash
        run: |
          set -euo pipefail
          python -B apps/learnit-next/build.py --output "$RUNNER_TEMP/root-a.html"
          python -B apps/learnit-next/build.py --output "$RUNNER_TEMP/root-b.html"
          cmp "$RUNNER_TEMP/root-a.html" "$RUNNER_TEMP/root-b.html"
          test "$(sha256sum "$RUNNER_TEMP/root-a.html" | cut -d' ' -f1)" = "$ROOT_SHA"
          test "$(wc -c < "$RUNNER_TEMP/root-a.html" | tr -d ' ')" = "$ROOT_BYTES"
      - name: Rebuild 52 known historical paths and stage exactly eight extras
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/learnit_v6_site/assemble.py --repo . --output "$RUNNER_TEMP/old52" --manifest "$RUNNER_TEMP/old52.json"
          python -B tools/learnit_v6_site/test_site.py --site "$RUNNER_TEMP/old52" --manifest "$RUNNER_TEMP/old52.json"
          cp -a "$RUNNER_TEMP/old52" "$RUNNER_TEMP/published52"
          cp "$RUNNER_TEMP/root-a.html" "$RUNNER_TEMP/published52/index.html"
          cp "$RUNNER_TEMP/root-a.html" "$RUNNER_TEMP/published52/learnit-next.html"
          python -B tools/activity-explorer/stage_pages.py --repo . --published-site "$RUNNER_TEMP/published52" --output "$RUNNER_TEMP/staged60"
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'staged60'
          v=json.loads((out/'manifest.json').read_text())
          assert v['route_count']==60 and v['published_routes_preserved']==52
          assert v['status']=='PASS_LOCAL_ONLY_NO_PUBLICATION' and len(v['new_routes'])==8
          assert len([f for f in (out/'site').rglob('*') if f.is_file()])==60
          print('PASS_60_STAGED_52_IDENTICAL_8_NEW')
          PY
      - name: Upload Pages site only on authorized main merge
        if: >-
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'release(activity-explorer): single Pages 2026-11-01' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/staged60/site
      - name: Preserve local stage manifest as audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnit-activity-explorer-60-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/staged60/manifest.json
  hints-preview-stage:
    name: PR512 native 60-route comparison (57 unchanged, 3 JS changed; NO DEPLOY)
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 512 && github.head_ref == 'feature/learnit-v6-hints-preview-r4-20261102' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact candidate and reconstruct deployed baseline in temporary worktree
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE=91945c7a7cb4417671653693ab0cb00457ba3438
          FROZEN=29810299b7c4b791b191904bf015b48902788155
          [[ "${PR_BASE}" == "${BASE}" && "${PR_HEAD}" == "$(git rev-parse HEAD)" ]]
          git merge-base --is-ancestor "${BASE}" HEAD
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          wp=json.loads(Path('work-packages/OPS-WP-034.json').read_text(encoding='utf-8'))
          assert wp['id']=='OPS-WP-034' and wp['authority']['productionGO']=='NOT_GRANTED'
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          assert sorted(git('diff','--name-only','91945c7a7cb4417671653693ab0cb00457ba3438','HEAD').splitlines())==sorted(wp['scope']['allowedPaths'])
          files=['apps/learnit-next/source_manifest.json','apps/learnit-next/src/integration/atlas/activity_projection.js','apps/learnit-next/src/ui/activity_presenters.js','tools/activity-explorer/explorer.js','tools/activity-explorer/tests/test_hints_native_dom_browser.py','tools/activity-explorer/tests/test_hints_preview_browser.py','tools/activity-explorer/tests/test_structure.py']
          assert subprocess.run(['git','diff','--quiet','29810299b7c4b791b191904bf015b48902788155','HEAD','--',*files]).returncode==0
          PY
          git worktree add --detach "${RUNNER_TEMP}/hints-reference" "${BASE}"
          python -B "${RUNNER_TEMP}/hints-reference/apps/learnit-next/build.py" --output "${RUNNER_TEMP}/root-reference-a.html"
          python -B "${RUNNER_TEMP}/hints-reference/apps/learnit-next/build.py" --output "${RUNNER_TEMP}/root-reference-b.html"
          cmp "${RUNNER_TEMP}/root-reference-a.html" "${RUNNER_TEMP}/root-reference-b.html"
          test "$(sha256sum "${RUNNER_TEMP}/root-reference-a.html" | cut -d' ' -f1)" = 4390d2f525ba1779e681a30f7c853f391094b9d1b85ce7b13f230efcf5be01eb
          python -B apps/learnit-next/build.py --output "${RUNNER_TEMP}/root-candidate-a.html"
          python -B apps/learnit-next/build.py --output "${RUNNER_TEMP}/root-candidate-b.html"
          cmp "${RUNNER_TEMP}/root-candidate-a.html" "${RUNNER_TEMP}/root-candidate-b.html"
          test "$(sha256sum "${RUNNER_TEMP}/root-candidate-a.html" | cut -d' ' -f1)" = ba858cf01f6785bade8cfc5249419eb8ce6fa8c70b9a5ad783861806092c6712
      - name: Reassemble historical 52 routes and independently stage baseline/candidate 60 routes
        shell: bash
        run: |
          set -euo pipefail
          BASE_REPO="${RUNNER_TEMP}/hints-reference"
          python -B "${BASE_REPO}/tools/learnit_v6_site/assemble.py" --repo "${BASE_REPO}" --output "${RUNNER_TEMP}/hints-old52" --manifest "${RUNNER_TEMP}/hints-old52.json"
          python -B "${BASE_REPO}/tools/learnit_v6_site/test_site.py" --site "${RUNNER_TEMP}/hints-old52" --manifest "${RUNNER_TEMP}/hints-old52.json" --expected "${BASE_REPO}/tools/learnit_v6_site/expected_files.json"
          cp -a "${RUNNER_TEMP}/hints-old52" "${RUNNER_TEMP}/hints-published52"
          cp "${RUNNER_TEMP}/root-reference-a.html" "${RUNNER_TEMP}/hints-published52/index.html"
          cp "${RUNNER_TEMP}/root-reference-a.html" "${RUNNER_TEMP}/hints-published52/learnit-next.html"
          python -B "${BASE_REPO}/tools/activity-explorer/stage_pages.py" --repo "${BASE_REPO}" --published-site "${RUNNER_TEMP}/hints-published52" --output "${RUNNER_TEMP}/hints-baseline60"
          python -B tools/activity-explorer/stage_pages.py --repo . --published-site "${RUNNER_TEMP}/hints-published52" --output "${RUNNER_TEMP}/hints-candidate60" --compare-baseline-60 "${RUNNER_TEMP}/hints-baseline60/site"
          test "$(find "${RUNNER_TEMP}/hints-candidate60/site" -type f | wc -l | tr -d ' ')" = 60
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ['RUNNER_TEMP']) / 'hints-candidate60' / 'manifest.json').read_text(encoding='utf-8'))
          delta = manifest['hints_preview_delta']
          assert manifest['status'] == 'PASS_LOCAL_ONLY_NO_PUBLICATION'
          assert manifest['published_routes_preserved'] == 52 and manifest['route_count'] == 60
          assert delta['status'] == 'PASS_LOCAL_ONLY_NO_PUBLICATION'
          assert delta['routes'] == 60 and delta['byte_identical'] == 57
          assert delta['modified'] == [
              'apps/learnit-next/src/integration/atlas/activity_projection.js',
              'apps/learnit-next/src/ui/activity_presenters.js',
              'tools/activity-explorer/explorer.js'
          ]
          print('PASS_DURABLE_STAGE_EVIDENCE_57_UNCHANGED_3_JS')
          PY
          echo PASS_60_ROUTE_STAGING_57_BYTE_IDENTICAL_3_JS_CHANGED_NO_DEPLOY
      - name: Save nonpublishing staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hints-preview-60-route-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/hints-candidate60/manifest.json

  deploy:
    name: Deploy from exact one-shot approved merge
    needs: qualify
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.event.head_commit.message == 'release(activity-explorer): single Pages 2026-11-01' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publish exact verified 60-route site
        id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    name: Verify HTTP SHA256 of 52 preserved and 8 new URLs
    needs: [qualify, deploy]
    if: ${{ github.event_name == 'push' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: GET and SHA-256 every one of the 60 published files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,time
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request,urlopen
          old=json.loads(Path('tools/learnit_v6_site/expected_files.json').read_text())['files']
          assert len(old)==52
          canonical='4390d2f525ba1779e681a30f7c853f391094b9d1b85ce7b13f230efcf5be01eb'
          files={x['path']:(canonical,626416) if x['path'] in ('index.html','learnit-next.html') else (x['sha256'],x['bytes']) for x in old}
          extra=[
           'tools/activity-explorer/index.html','tools/activity-explorer/explorer.js','tools/activity-explorer/explorer.css',
           'apps/learnit-next/src/integration/atlas/activity_projection.js',
           'apps/learnit-next/src/ui/activity_presenters.js','apps/learnit-next/src/ui/media.js',
           'apps/learnit-next/src/core/activity_semantics.js','apps/learnit-next/src/styles.css'
          ]
          assert len(files)==52 and len(set(extra))==8 and not (set(extra)&set(files))
          for key in extra:
            b=Path(key).read_bytes()
            files[key]=(hashlib.sha256(b).hexdigest(),len(b))
          assert len(files)==60
          origin='https://stefm78.github.io/learnit-platform/'
          for i,(key,(expected,size)) in enumerate(sorted(files.items()),1):
            url=origin+quote(key,safe='/')+'?release='+os.environ['GITHUB_RUN_ID']
            failure='unverified'
            for attempt in range(7):
              try:
                with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=25) as r:
                  data=r.read()
                  if r.status==200 and len(data)==size and hashlib.sha256(data).hexdigest()==expected:
                    failure=None;break
                  failure=f'HTTP={r.status}, len={len(data)}, SHA={hashlib.sha256(data).hexdigest()}'
              except Exception as exc: failure=str(exc)
              if attempt<6: time.sleep(10)
            if failure: raise RuntimeError('LIVE_HOLD '+key+': '+failure)
            print('PASS_LIVE_SHA256',i,'/60',key,flush=True)
          with urlopen(Request(origin+'tools/activity-explorer/?release='+os.environ['GITHUB_RUN_ID']),timeout=25) as r:
            data=r.read()
          assert hashlib.sha256(data).hexdigest()==files['tools/activity-explorer/index.html'][0]
          print('PASS_LIVE_60_OF_60 AND DIRECTORY_INDEX')
          PY
