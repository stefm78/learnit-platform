name: LearnIT V6 single Pages publication
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/learnit-v6-root-promotion.yml'
      - 'work-packages/OPS-WP-027.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/learnit-v6-root-promotion.yml'
      - 'work-packages/OPS-WP-027.json'
permissions:
  contents: read
concurrency:
  group: learnit-v6-unique-pages-publisher
  cancel-in-progress: false
jobs:
  qualify:
    name: Exact V6 site, known history and publisher exclusivity
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exactly one publisher and 8 retired Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,subprocess
          from pathlib import Path
          retired={
            'atlas-m3-1-human-gate-deploy.yml':'5a546ffbc226e84cdea6247292c2195b7ba29550',
            'atlas-m3-pages-candidate.yml':'af7f5051ed9c5b3247ff7f86bd96dd86282e3f4b',
            'atlas-m3-pages-human-gate-deploy.yml':'19b9ce6bfc319ccc154fc1227e78106153b84936',
            'atlas-r10-human-replay-deploy.yml':'15314d95f7f36599fc68124654d4ca0bd0dd2153',
            'atlas-r13-final-human-replay-deploy.yml':'19dfe32729a1c55ba24a56c03666e7eed5e08e08',
            'atlas-r14-human-replay-deploy.yml':'551a4f5875d23a362cb6ef6041530d977e1bcadb',
            'atlas-r15-human-replay-deploy.yml':'585ea027e9827b4c58c602e4bb99c2672f79f033',
            'learnit-next-pages.yml':'42c1b42310d6c0a728d91ca64a06039faef09328'
          }
          root=Path('.github/workflows/learnit-v6-root-promotion.yml')
          files=sorted(Path('.github/workflows').glob('*.yml'))
          assert len(files)==38,len(files)
          active=[]
          for p in files:
              data=p.read_text(encoding='utf-8')
              if re.search(r'(?m)^\s*uses:\s*actions/deploy-pages@v4\s*$',data): active.append(p)
              if p!=root:
                  assert not re.search(r'actions/(?:deploy-pages|upload-pages-artifact|configure-pages)@|peaceiris/actions-gh-pages@',data),p
                  assert not re.search(r'(?m)^[ \t]*(?:pages|id-token):[ \t]*write\b',data),p
          assert active==[root],active
          for name,blob in retired.items():
              sha=subprocess.check_output(['git','rev-parse','HEAD:.github/workflows/'+name],text=True).strip()
              assert sha==blob,(name,sha)
          content=root.read_text(encoding='utf-8')
          assert len(re.findall(r'(?m)^\s*uses:\s*actions/deploy-pages@v4\s*$',content))==1
          assert len(re.findall(r'(?m)^\s*uses:\s*actions/upload-pages-artifact@v3\s*$',content))==1
          assert "github.run_attempt == 1" in content
          assert "startsWith(github.event.head_commit.message, 'release(learnit-v6): single Pages 2026-10-26')" in content
          assert not re.search(r'(?m)^  workflow_dispatch:[ \t]*$', content)
          print('PASS_SINGLE_PUBLISHER=1')
          print('PASS_LEGACY_PUBLISHERS_RETIRED=8/8')
          PY
      - name: Assemble exact 52 known files twice
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/learnit_v6_site/assemble.py --repo . --output "$RUNNER_TEMP/site-a" --manifest "$RUNNER_TEMP/site-a.json"
          python -B tools/learnit_v6_site/assemble.py --repo . --output "$RUNNER_TEMP/site-b" --manifest "$RUNNER_TEMP/site-b.json"
          cmp "$RUNNER_TEMP/site-a.json" "$RUNNER_TEMP/site-b.json"
          python -B tools/learnit_v6_site/test_site.py --site "$RUNNER_TEMP/site-a" --manifest "$RUNNER_TEMP/site-a.json"
          test "$(find "$RUNNER_TEMP/site-a" -type f | wc -l)" -eq 52
          test "$(sha256sum "$RUNNER_TEMP/site-a/index.html" | cut -d' ' -f1)" = "92115133901b50509880c2e7ad9d76816f74e30443b5f52d1cf35d935dac953b"
      - name: Stage site artifact without publishing on PR
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site-a
      - name: Preserve evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: learnit-v6-exact-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/site-a.json
          if-no-files-found: error
          retention-days: 30
  deploy:
    name: One-shot Pages release from exact human-authorized merge commit
    needs: qualify
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(learnit-v6): single Pages 2026-10-26') && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out exact release merge commit for one-shot CAS verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify authorized exact merge subject and first-parent SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^1)" = "3c22da0642d42919d99a4c45c451744737ec7d81"
          test "$(git log -1 --format=%s)" = "release(learnit-v6): single Pages 2026-10-26"
      - name: Publish exact prepared Pages artifact
        uses: actions/deploy-pages@v4
        id: deployment
  verify-live:
    name: Verify exact public SHA256 for all 52 known URLs
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public root, recovery, authoring and historical replay paths
        env:
          RELEASE_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,time
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen,Request
          manifest=json.loads(Path('tools/learnit_v6_site/expected_files.json').read_text(encoding='utf-8'))
          assert len(manifest['files'])==52
          for f in manifest['files']:
              url='https://stefm78.github.io/learnit-platform/'+quote(f['path'],safe='/')+'?learnit_release='+os.environ['RELEASE_RUN']
              bad=None
              for attempt in range(8):
                  try:
                      with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=25) as response:
                          b=response.read()
                          if response.status==200 and len(b)==f['bytes'] and hashlib.sha256(b).hexdigest()==f['sha256']:
                              bad=None;break
                          bad=f"HTTP={response.status}, SHA={hashlib.sha256(b).hexdigest()}"
                  except Exception as ex: bad=str(ex)
                  if attempt<7: time.sleep(12)
              if bad: raise RuntimeError('LIVE_HASH_HOLD: '+f['path']+' '+bad)
          print('PASS_LIVE_FILES=52/52')
          print('PASS_LIVE_V6_SHA=92115133901b50509880c2e7ad9d76816f74e30443b5f52d1cf35d935dac953b')
          PY
